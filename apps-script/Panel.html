  function saveWebAppUrl(value, prefix) {
    var st = S.ui.webApp;
    var url = str(value).trim();
    st.value = url;
    var again = { test: prefix + '-field', focusTest: prefix + '-input', flash: false };
    if (!url) {
      st.error = 'Paste the web app address first. It starts with https:// and ends with /exec.';
      S.ui.pendingFocus = again;
      renderMain(true);
      return;
    }
    st.error = '';
    withBusy('Checking the web app address…', function () { return call('panelSetWebAppUrl', url); }).then(function (res) {
      S.urls.webApp = str(obj(res).web_app_url) || url;
      S.webAppRecorded = true;
      var wasAccess = S.webAppAccess;
      S.webAppAccess = str(obj(res).web_app_access) === 'domain' ? 'domain' : 'anyone';
      /* Files prepared for the GitHub copy before this carry the old address (or
         test mode): they must be prepared again (21 Oct review). */
      S.ui.exportFiles = null;
      S.ui.exportWarning = '';
      st.editing = false; st.value = ''; st.error = '';
      renderMain(true);
      if (S.webAppAccess === 'domain') {
        toast('Saved as Meesho-only: colleagues signed in with a company account can open the survey through the web app. Check that “Who has access” is “Anyone within …” your company, not “Only myself”. Make the links again (Links) so they point at it.', { kind: 'ok', timeout: 10000 });
      } else if (wasAccess === 'domain') {
        toast('Web app address saved: it is open to anyone now. Make the links again (Links) so they point at the form’s own address, and refresh the GitHub copy.', { kind: 'ok', timeout: 9000 });
      } else {
        toast('Web app address saved. The GitHub copy (Publish > Backup copy in GitHub) now uses it.', { kind: 'ok', timeout: 6000 });
      }
    }, function (e) {
      st.error = e.message;   // the server's plain-English reason, shown under the box
      S.ui.pendingFocus = again;
      renderMain(true);
    });
  }

  /* ---- Round numbers (loaded only when needed, they can take a few seconds) -- */

  function countsView(id) {
    var box = h('span', { class: 'counts', 'data-counts-for': id, test: 'counts-' + id });
    fillCounts(box, id);
    return box;
  }

  function fillCounts(box, id) {
    var c = S.ui.counts[id];
    box.textContent = '';
    if (!S.savedRoundIds[id]) {   // the server doesn't know this round until it is saved
      appendKids(box, [h('span', { class: 'small muted', text: 'Save first to see numbers.' })]);
      return;
    }
    if (!c) {
      appendKids(box, [btn('Show numbers', 'counts-load-' + id, function () { loadCounts(id); }, { small: true, kind: 'ghost' })]);
      return;
    }
    if (c.loading) { appendKids(box, [h('span', { class: 'spinner is-small' }), h('span', { class: 'muted', text: 'Counting…' })]); return; }
    if (c.error) {
      appendKids(box, [h('span', { class: 'field-error', text: c.error }), btn('Try again', 'counts-load-' + id, function () { loadCounts(id); }, { small: true, kind: 'ghost' })]);
      return;
    }
    var d = obj(c.data);
    var links = Number(d.links) || 0, sub = Number(d.submitted) || 0;
    var parts = [
      [fmtNum(links), plural(links, 'link').replace(/^\d+ /, '')],
      [fmtNum(d.opened), 'opened'], [fmtNum(d.started), 'started'], [fmtNum(sub), 'sent answers']
    ];
    parts.forEach(function (p, i) {
      if (i) box.appendChild(h('span', { class: 'sep', text: '·' }));
      box.appendChild(h('span', null, h('span', { class: 'num', text: p[0] }), ' ', p[1]));
    });
    if (links) box.appendChild(h('span', { class: 'badge badge-req', text: Math.round(100 * sub / links) + '% answered' }));
    var langs = Object.keys(obj(d.by_lang)).filter(function (k) { return d.by_lang[k]; });
    var extra = [];
    if (langs.length) extra.push(langs.map(function (k) { return englishName(k) + ' ' + fmtNum(d.by_lang[k]); }).join(', '));
    if (d.last_submission_at) extra.push('last answer ' + fmtDate(d.last_submission_at, true));
    box.appendChild(btn('Refresh', 'counts-load-' + id, function () { loadCounts(id); }, { small: true, kind: 'ghost' }));
    if (extra.length) box.appendChild(h('span', { class: 'small muted', style: 'flex-basis:100%', text: extra.join(' · ') }));
  }

  function loadCounts(id) {
    S.ui.counts[id] = { loading: true };
    updateCountsUI(id);
    call('panelRoundCounts', id).then(function (d) {
      S.ui.counts[id] = { data: d };
      updateCountsUI(id);
    }, function (e) {
      S.ui.counts[id] = { error: e.message };
      updateCountsUI(id);
    });
  }

  function updateCountsUI(id) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-counts-for]'), function (el) {
      if (el.getAttribute('data-counts-for') === id) fillCounts(el, id);
    });
  }

  /* Numbers for open rounds and the three newest ones load by themselves. */
  function autoLoadCounts() {
    var rounds = M().rounds;
    rounds.forEach(function (r, i) {
      if (S.ui.counts[r.id] || !S.savedRoundIds[r.id]) return;
      if (r.status === 'open' || i >= rounds.length - 3) loadCounts(r.id);
    });
  }

  /* ==========================================================================
     PART 8. QUESTIONS: the list, the editor and "Add a question"
     ========================================================================== */

  VIEWS.questions = function () {
    if (S.ui.editing !== null) {
      var s = findScreen(S.ui.editing);
      if (s) return screenEditor(s);
      S.ui.editing = null;
    }
    if (S.ui.qview === 'map' && S.flow.lib) return mapView();
    if (S.ui.qview === 'try' && S.flow.lib) return tryView();
    S.ui.qview = 'list';
    var screens = M().screens;
    var end = mainEndIndex();
    var mainRows = end === -1 ? screens : screens.slice(0, end + 1);
    var noTools = S.flow.loading ? 'The route tools are still loading. Try again in a moment.' : 'The route tools could not start: see the note below the title.';
    return [
      sectionHead('Questions', 'Every screen partners go through, in order. Changes reach partners after you save and publish.', [
        S.flow.lib ? btn('Map', 'open-map', function () { S.ui.qview = 'map'; renderMain(false); }, { small: true, title: 'See the whole route as a diagram' })
          : lockedBtn('Map', 'open-map', noTools),
        S.flow.lib ? btn('Try a path', 'open-try', function () { S.ui.qview = 'try'; renderMain(false); }, { small: true, title: 'Pick answers and see the screens a partner gets' })
          : lockedBtn('Try a path', 'open-try', noTools),
        btn('Add a question', 'add-question', addQuestionFlow, { kind: 'primary', icon: '+' })]),
      codesNote(),
      routeNote(),
      screens.length
        ? h('div', { class: 'qlist', test: 'main-route' }, mainRows.map(function (s2, i) { return screenCard(s2, i); }))
        : emptyState('No questions yet', 'Start from the questionnaire stored in GitHub (Settings > Import from GitHub), or add questions one by one.',
          btn('Add a question', 'add-question-empty', addQuestionFlow, { kind: 'primary' })),
      end === -1 ? null : otherRoutes(screens, end)
    ];
  };

  /* Rows after the main thank-you screen: other routes and endings, which
     partners reach only through a jump (docs/flow-engine.md 9.1). */
  function otherRoutes(screens, end) {
    var rows = screens.slice(end + 1);
    if (!rows.length && !S.flow.lib) return null;
    return h('section', { test: 'other-routes' },
      h('div', { class: 'qsection-head' }, h('h2', { text: 'Other routes and endings' }),
        S.flow.lib ? btn('Add an ending', 'add-ending', addEndingFlow, { small: true, icon: '+', title: 'Another thank-you screen, reached by a jump' }) : null),
      h('p', { class: 'qsection-help', text: rows.length
        ? 'These screens come after the main thank-you screen, so partners reach them only through a jump (Edit a question > After this question > Add a jump). Every ending sends the answers.'
        : 'Nothing here yet. Add an ending (another thank-you screen) or a question below the thank-you screen, then send partners there with a jump from an earlier question.' }),
      rows.length ? h('div', { class: 'qlist' }, rows.map(function (s, k) { return screenCard(s, end + 1 + k); })) : null);
  }

  /* The route badges of a card: where the screen goes, repeats, endings,
     and what the form's own checker found wrong with its arrows. */
  function routeBadges(s, i) {
    var out = [];
    if (!S.flow.lib) return out;
    if (s.type === 'thank_you') {
      out.push(badge('Ends the survey', 'end', 'screen-end-' + s.id, 'Partners stop here and their answers are sent.'));
    } else {
      jumpsOf(s).forEach(function (j, k) {
        if (!j || typeof j !== 'object' || !j['goto']) return;
        out.push(badge('↪ goes to ' + targetShort(j['goto']) + ' when ' + shortRule(j.when), 'route', 'screen-jump-' + s.id + '-' + k,
          'If ' + ruleSentence(j.when) + ', partners go to ' + targetName(j['goto']) + '.'));
      });
      if (s.next) out.push(badge('↪ then goes to ' + targetShort(s.next), 'route', 'screen-next-' + s.id, 'After this question partners usually go to ' + targetName(s.next) + '.'));
      if (s.repeat && REPEAT_LABELS[s.repeat] && canRepeat(s.type)) {
        out.push(badge(s.repeat === 'each_low_area' ? 'Repeats for each area rated low' : 'Repeats for each area', 'req', 'screen-repeat-' + s.id,
          'Asked once for each area' + (s.repeat === 'each_low_area' ? ' rated at or below its limit' : '') + ', with the area’s name above it.'));
      }
    }
    var rp = routeProblems(s, i);
    var jumpMsgs = [];
    Object.keys(rp.jumps).forEach(function (k) { jumpMsgs = jumpMsgs.concat(rp.jumps[k]); });
    if (Object.keys(rp.dropped).length || jumpMsgs.length) {
      out.push(badge('⚠ this jump can never happen', 'error', 'screen-jump-problem-' + s.id, jumpMsgs.concat(rp.row).join(' ') || 'Open the question to see why.'));
    } else if (rp.row.length) {
      out.push(badge('⚠ ' + (jumpsUnreadable(s) ? 'the jumps can’t be read' : rp.rowError ? 'route problem: see the editor' : 'route note: see the editor'),
        rp.rowError ? 'error' : 'warn', 'screen-route-problem-' + s.id, rp.row.join(' ')));
    }
    if (rp.unreached) out.push(badge('⚠ nothing leads here: add a jump to it', 'error', 'screen-unreached-' + s.id, rp.unreached));
    return out;
  }

  function screenCard(s, i) {
    var t = typeInfo(s.type);
    var screens = M().screens;
    var end = mainEndIndex();
    var isMainEnd = i === end;
    var extraEnd = s.type === 'thank_you' && !isMainEnd;
    var other = end !== -1 && i > end;
    var lastMain = end === -1 ? screens.length - 1 : end - 1;
    var canUp = !isMainEnd && (other ? i > end + 1 : i > 0);
    var canDown = !isMainEnd && (other ? i < screens.length - 1 : i < lastMain);
    var second = secondLang();
    var english = cardEnglish(s, t);
    var secondText = s.text && second && !isTodo(textValue(s.text, second.code)) ? textValue(s.text, second.code) : '';
    var problems = s.type === 'thank_you' ? [] : ruleProblems(s, i);

    var badges = [];
    if (t.builtin && !extraEnd) badges.push(badge('Built-in', null, null, 'Part of every questionnaire: it can be hidden but not deleted.'));
    if (hasRequired(s)) badges.push(effectiveRequired(s) ? badge('Required', 'req') : badge('Optional (Skip button)', null));
    if (s.show_if) badges.push(badge('Only if ' + ruleSentence(s.show_if), 'rule', 'screen-rule-' + s.id));
    if (problems.length) badges.push(badge('⚠ The rule tests a later or hidden answer: edit it', 'error', 'screen-rule-problem-' + s.id, problemText(problems[0], i)));
    if (s.skip_if === 'lang_in_url') badges.push(badge('Skipped when the link already says the language', null));
    if (s.skip_if === 'empty') badges.push(badge('Skipped when there is nothing to show', null));
    badges = badges.concat(routeBadges(s, i));
    if (!s.active) badges.push(badge('Hidden: partners don’t see it', 'hidden'));

    var upWhy = isMainEnd ? 'The thank-you screen always stays at the end of the main route.'
      : other ? 'Screens below the thank-you screen stay there: partners reach them only through a jump.' : 'This is already the first screen.';
    var downWhy = isMainEnd ? 'The thank-you screen always stays at the end of the main route.'
      : other ? 'This is already the last screen.' : 'Nothing can come after the thank-you screen.';
    var actions = [
      canUp ? btn('', 'screen-up-' + s.id, function () { moveScreen(i, -1); }, { small: true, icon: '↑', aria: 'Move up', title: 'Move up' })
        : lockedBtn('↑', 'screen-up-' + s.id, upWhy),
      canDown ? btn('', 'screen-down-' + s.id, function () { moveScreen(i, 1); }, { small: true, icon: '↓', aria: 'Move down', title: 'Move down' })
        : lockedBtn('↓', 'screen-down-' + s.id, downWhy),
      btn('Edit', 'screen-edit-' + s.id, function () { openEditor(s.id); }, { small: true }),
      isMainEnd ? lockedBtn('Hide', 'screen-toggle-' + s.id, 'The thank-you screen sends the answers, so it can’t be hidden.')
        : btn(s.active ? 'Hide' : 'Show', 'screen-toggle-' + s.id, function () { toggleScreen(s); }, { small: true }),
      t.builtin && !extraEnd ? lockedBtn('Delete', 'screen-delete-' + s.id, 'Built-in screens can’t be deleted. Hide it instead.', { kind: 'danger' })
        : isDataColumnScreen(s.id) ? lockedBtn('Delete', 'screen-delete-' + s.id, 'This question fills the ' + DATA_COLUMN_SCREENS[s.id] + ' column of the answers sheet, so it can’t be deleted and its code never changes. Hide it instead.', { kind: 'danger' })
        : isLive.screen(s.id) ? lockedBtn('Delete', 'screen-delete-' + s.id, 'Live questions can’t be deleted (past answers use the code). Hide it instead.', { kind: 'danger' })
        : btn('Delete', 'screen-delete-' + s.id, function () { deleteScreenFlow(s); }, { small: true, kind: 'danger' })
    ];

    return h('article', { class: 'qcard' + (s.active ? '' : ' is-hidden'), test: 'screen-card-' + s.id },
      h('div', { class: 'qnum', text: String(i + 1) }),
      h('div', { class: 'qicon', 'aria-hidden': 'true', text: t.icon }),
      h('div', { class: 'qbody' },
        h('div', { class: 'qtitle-row' }, h('span', { class: 'qtype', text: extraEnd ? 'Another ending' : t.label }), codeChip(s.id, isLive.screen(s.id), 'this screen')),
        english ? h('div', { class: 'qtext', text: english }) : null,
        secondText ? h('div', { class: 'qtext-2', lang: second.code, text: secondText }) : null,
        h('div', { class: 'badges' }, badges)),
      h('div', { class: 'qactions' }, actions));
  }

  function cardEnglish(s, t) {
    if (s.type === 'function_ratings') {
      var names = M().areas.filter(function (a) { return a.active; }).map(function (a) { return areaName(a.id); });
      return 'One rating screen per area: ' + (names.length ? names.join(', ') : 'no areas shown yet') + '.';
    }
    if (s.type === 'function_deep_dives') return '“' + (en('q.deep_dive') || 'What is the main problem?') + '” for each area rated ' + standardThreshold() + ' or lower.';
    if (s.type === 'language_picker') return en('lang.title') || t.description;
    if (s.type === 'whats_changed') return (en('wc.title') || 'What changed') + ' (bullets per round are in Rounds)';
    if (s.type === 'thank_you') return (s.text && en(s.text)) || en('thanks.title') || 'Thank you!';
    if (s.text && en(s.text)) return en(s.text);
    if (t.needs_text) return '(no English text yet)';
    return t.description;
  }

  /* Arrows only go down the list (docs/flow-engine.md 9.1), except to an
     ending, which is fine anywhere. After a move, say which arrows now point
     up: the form leaves those out. */
  function backwardArrows() {
    var out = [];
    M().screens.forEach(function (s, i) {
      var targets = [];
      if (s.next) targets.push(s.next);
      jumpsOf(s).forEach(function (j) { if (j && j['goto']) targets.push(j['goto']); });
      targets.forEach(function (to) {
        var p = screenPos(to);
        if (p !== -1 && p <= i && !(p < i && isFixedEnding(M().screens[p]))) out.push({ from: i, to: p });
      });
    });
    return out;
  }
  function warnBackward(movedId) {
    var at = screenPos(movedId);
    var bad = backwardArrows().filter(function (a) { return a.from === at || a.to === at; });
    if (!bad.length) return;
    toast('Question ' + (bad[0].from + 1) + ' now has an arrow back up to question ' + (bad[0].to + 1) +
      '. Arrows only go down the list, so the form leaves it out: move the question back, or change the jump.', { kind: 'info', timeout: 9000 });
  }

  function moveScreen(i, delta) {
    moveItem(M().screens, i, i + delta);
    var s = M().screens[i + delta];
    changed();
    S.ui.pendingFocus = { test: 'screen-card-' + s.id, focusTest: 'screen-' + (delta < 0 ? 'up-' : 'down-') + s.id, flash: false };
    renderMain(true);
    warnBackward(s.id);
  }

  /* Hides or shows a screen. Hiding an ending that partners reach first says
     what will happen and asks (confirmed = true skips that: the person
     already read it, for example in the delete dialog's "Hide it instead"). */
  function toggleScreen(s, confirmed) {
    if (s.active && s.type === 'thank_you' && !confirmed) {
      /* A hidden ending still ends its route, at the main thank-you screen
         (flow-panel.js): partners never run on into the screens below it. */
      var e = endingNotes(s);
      if (e.reach.length) {
        openModal({ title: 'Hide this ending?', test: 'confirm-hide-ending',
          body: [h('p', { test: 'hide-ending-note', text: 'While it is hidden, partners who would reach it (' + e.reach.join('; ') + ') end at ' + e.mainName +
            ' instead. Their answers are still sent, and they never go on to the screens below it.' })],
          buttons: [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } },
            { label: 'Hide it', kind: 'primary', test: 'modal-confirm', onClick: function (c) { c(); toggleScreen(s, true); } }] });
        return;
      }
    }
    s.active = !s.active;
    changed({ rerender: true });
    if (s.active) return;
    if (s.type === 'thank_you') {
      toast('Ending hidden. Partners who would reach it now end at ' + endingNotes(s).mainName + '.', { kind: 'info', timeout: 7000 });
      return;
    }
    var users = rulesUsing(function (ref) { return ref === s.id || isRepeatedRef(ref, s.id); }, true);
    var into = arrowNames(arrowsInto(s.id));
    var parts = [];
    if (users.length) parts.push('A rule or jump on ' + users.join(', ') + ' tests this hidden question: change it too.');
    if (into.length) parts.push(capitalFirst(joinWith(into, 'and')) + (into.length === 1 ? ' goes' : ' go') + ' to this question: while it is hidden, partners go where it would have gone instead.');
    if (parts.length) toast(parts.join(' '), { kind: 'info', timeout: 9000 });
  }
  function capitalFirst(text) { return text.charAt(0).toUpperCase() + text.slice(1); }

  /* What hiding or deleting an ending (thank-you screen) s changes:
       reach     how partners get there: 'question 3 jumps here', 'question 10,
                 just above it, goes on to it'
       above     the shown question just above it whose route runs into it
                 (no "usually go to" of its own), as { index }, or null
       below     the first shown screen below it, as { index, route: true when
                 a jump of another question leads there }, or null
       mainName  the main thank-you screen, as the messages name it */
  function endingNotes(s) {
    var list = M().screens;
    var pos = screenPos(s.id);
    var out = { reach: [], above: null, below: null, mainName: 'the main thank-you screen' };
    var main = list.filter(function (x) { return x !== s && isFixedEnding(x); })[0];
    if (main) out.mainName = 'the main thank-you screen (question ' + (screenPos(main.id) + 1) + ')';
    arrowsInto(s.id).forEach(function (a) {
      var what = 'question ' + (a.index + 1) + (a.how === 'jump' ? ' jumps here' : ' goes here');
      if (out.reach.indexOf(what) === -1) out.reach.push(what);
    });
    for (var k = pos - 1; k >= 0; k--) {
      if (!list[k].active) continue;
      if (list[k].type !== 'thank_you' && !list[k].next && k > mainEndIndex()) {
        out.above = { index: k };
        out.reach.push('question ' + (k + 1) + ', just above it, goes on to it');
      }
      break;
    }
    var aboveAt = out.above ? out.above.index : -1;
    for (var b = pos + 1; b < list.length; b++) {
      if (!list[b].active) continue;
      var id = list[b].id;
      out.below = { index: b, route: list.some(function (x, i) {
        return i !== aboveAt && x.active && jumpsOf(x).some(function (j) { return j && j['goto'] === id; });
      }) };
      break;
    }
    return out;
  }

  function openEditor(id) {
    S.ui.editing = id;
    S.ui.qview = 'list';   // "← All questions" goes back to the list
    stopMapFrame();
    go('questions');
    $('#main').scrollTop = 0;
  }

  function deleteScreenFlow(s) {
    var live = isLive.screen(s.id);
    var ending = s.type === 'thank_you';
    var e = ending ? endingNotes(s) : null;
    var users = rulesUsing(function (ref) { return ref === s.id || isRepeatedRef(ref, s.id); });
    var body = [h('p', { text: 'This removes ' + quote(shorten(screenEnglish(s) || s.id, 70)) + ' and its texts in every language.' })];
    if (live) {
      // Live questions are never deleted: earlier rounds' answers use the code,
      // and the dashboard compares rounds with it. Hiding keeps the history intact.
      body = [h('div', { class: 'callout is-warn' }, h('p', { text: ending
        ? 'This ending is live: answers from earlier rounds name it, so the dashboard compares rounds with it. It can’t be deleted, but you can hide it.'
        : 'This question is live: answers from earlier rounds use its code, so the dashboard compares rounds with it. It can’t be deleted, but you can hide it: partners stop seeing it and its past answers stay readable.' }))];
      if (ending && s.active) body.push(h('p', { test: 'hide-ending-note', text: 'While it is hidden, partners who would reach it' + (e.reach.length ? ' (' + e.reach.join('; ') + ')' : '') + ' end at ' + e.mainName + ' instead. Their answers are still sent, and they never go on to the screens below it.' }));
      var liveButtons = [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }];
      if (s.active) liveButtons.push({ label: 'Hide it instead', kind: 'primary', test: 'modal-hide-instead', onClick: function (c) { c(); toggleScreen(s, true); } });
      openModal({ title: ending ? 'This ending can’t be deleted' : 'This question can’t be deleted', test: 'confirm-delete-screen', body: body, buttons: liveButtons });
      return;
    }
    if (users.length) body.push(h('p', { class: 'field-warn', text: 'The rule on ' + users.join(', ') + ' tests this question and will need a new rule.' }));
    var into = arrowNames(arrowsInto(s.id));
    if (into.length) body.push(h('p', { class: 'field-warn', test: 'delete-arrows-note', text: capitalFirst(joinWith(into, 'and')) + (into.length === 1 ? ' goes' : ' go') + ' to this ' + (ending ? 'ending' : 'question') + '. ' + (into.length === 1 ? 'That arrow is' : 'Those arrows are') + ' removed too: partners then go ' + (ending ? 'where that question usually goes.' : 'on to the next question in the list.') }));
    if (ending && e.above) {
      /* The route above it would no longer stop here (flow-panel.js only stops at endings that are still in the list). */
      var aboveName = 'question ' + (e.above.index + 1);
      var then = !e.below ? 'it then goes to the thank-you screen the form adds at the end'
        : 'it then goes on to question ' + (e.below.index + 1) + ' (' + quote(shorten(screenEnglish(M().screens[e.below.index]) || M().screens[e.below.index].id, 50)) + ')' +
          (e.below.route ? ', which starts another route, so Publish refuses until you choose where ' + aboveName + ' goes' : '');
      body.push(h('div', { class: 'callout is-warn', test: 'delete-ending-note' },
        h('p', { text: capitalFirst(aboveName) + ', just above this ending, has no “Usually go to”: ' + then + '. To keep its route ending here, hide this ending instead (partners then end at ' + e.mainName + '), or set ' + aboveName + '’s “Usually go to” first (Edit it > After this question).' })));
    }
    var buttons = [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }];
    if (ending && e.above && s.active) buttons.push({ label: 'Hide it instead', test: 'modal-hide-instead', onClick: function (c) { c(); toggleScreen(s, true); } });
    buttons.push({ label: 'Delete', kind: 'danger-solid', test: 'modal-confirm', onClick: function (c) { c(); deleteScreen(s); } });
    openModal({ title: ending ? 'Delete this ending?' : 'Delete this question?', test: 'confirm-delete-screen', body: body, buttons: buttons });
  }

  function deleteScreen(s) {

      parts.push(h('div', { class: 'help', style: 'margin-top:8px', text: 'Right end (10):' }));

  function skipEditor(s) {

  function optionsEditor(s) {

        h('div', { class: 'row-head' },

          h('div', { class: 'btn-group' },

    });

  }

  function builtinTextsCard(s) {
    var list = BUILTIN_SCREEN_TEXTS[s.type];
    if (!list || isExtraEnding(s, screenPos(s.id))) return null;
    var formKeys = arr(S.catalog.form_text_keys);
    var shownList = list.filter(function (p) { return M().texts[p[0]] || formKeys.indexOf(p[0]) !== -1; });
    if (!shownList.length) return null;
    return card({ title: 'Texts on this screen', sub: 'These texts belong to the form itself. You can reword them here or in Texts & translations.', test: 'editor-builtin-texts' },
      shownList.map(function (p) {
        return h('div', { style: 'margin-bottom:12px' }, h('div', { class: 'group-label', text: p[1] }), langFields(p[0], { test: 'builtin-' + p[0], label: p[1], compact: true }));
      }));

  function builtinPointer(s) {
    var map = {
      function_ratings: ['The areas, their order and their problems are edited in Areas & problems.', 'areas', 'Go to Areas & problems'],

  /* ---- The rule builder ("Show this question only if...") -------------------- */

  function ruleCard(s, idx) {
    var box = h('div', { test: 'rule-builder' });
    function draw() { redraw(box, function () { return ruleBody(s, idx, draw); }); }
    draw();
    return card({ title: 'When to show this question', sub: 'Use a rule to show it only to some partners, for example only to those who rated Payments low.', test: 'rule-card' }, box);
  }

  function ruleBody(s, idx, draw) {
    var answers = ruleAnswers(s, idx, 'show_if');
    /* A new condition starts from the latest earlier answer; only when there
       is none, from the language or the round (SHOW_IF_FACTS). */
    var realAnswers = answers.filter(function (a) { return a.kind !== 'fact'; });
    var starter = realAnswers[realAnswers.length - 1] || answers[0];
    var parsed = parseRule(s.show_if);
    var name = 'rule-mode-' + s.id;
    /* Switching to "Always" remembers the rule, so switching back restores it. */
    function setMode(mode) {
      if (mode === 'always') {
        if (s.show_if) S.ui.lastRule[s.id] = s.show_if;
        s.show_if = null;
      } else if (!s.show_if) {
        if (S.ui.lastRule[s.id]) s.show_if = S.ui.lastRule[s.id];
        else if (!answers.length) { toast('No earlier answers to test here. Move the question further down first.', { kind: 'info' }); draw(); return; }
        else s.show_if = conditionObject(defaultCondition(starter));
      }
      changed();
      draw();
    }
    var modes = h('div', { class: 'radio-cards', role: 'radiogroup', 'aria-label': 'When to show this question' },
      radioCard(name, 'always', parsed.mode === 'always', 'Always show it', 'rule-mode-always', setMode),
      radioCard(name, 'if', parsed.mode !== 'always', 'Only show it if…', 'rule-mode-if', setMode));
    var out = [modes];
    if (parsed.mode === 'complex') {
      out.push(h('div', { class: 'callout is-warn', style: 'margin-top:12px' },
        h('p', null, 'This rule was written by hand in the Sheet and is too detailed for this editor: ', h('strong', { text: ruleSentence(s.show_if) }), '.'),
        h('p', null, btn('Replace it with a simple rule', 'rule-replace', function () {
          if (!answers.length) { toast('There are no earlier answers to test here.', { kind: 'info' }); return; }
          s.show_if = conditionObject(defaultCondition(starter)); changed(); draw();
        }, { small: true }), ' ', btn('Remove the rule', 'rule-clear', function () { s.show_if = null; changed(); draw(); }, { small: true, kind: 'danger' }))));
      return out;
    }
    if (parsed.mode === 'always') {
      if (!realAnswers.length) out.push(h('p', { class: 'help', style: 'margin-top:10px', text: answers.length ? 'No earlier answers can be tested here, because this is near the start (only the partner’s language or the round). Questions further down can depend on it.' : 'No earlier answers can be tested here, because this is near the start. Questions further down can depend on it.' }));
      return out;

          function (v) { parsed.combine = v; commit(); }, { aria: 'All or any of the conditions', inline: true })));
    }
    parsed.conds.forEach(function (c, i) { out.push(conditionRow(c, i, answers, idx, parsed, commit, null)); });
    out.push(h('div', { style: 'margin-top:10px' }, btn('Add another condition', 'rule-add', function () {

    }, { small: true, icon: '+' })));
    out.push(h('div', { class: 'sentence', test: 'rule-sentence' }, 'Partners see this question only if ', h('strong', { text: ruleSentence(s.show_if) }), '.'));
    return out;
  }

  function radioCard(name, value, on, label, test, onPick) {
    var input = h('input', { type: 'radio', name: name, value: value, checked: on, test: test });
    input.addEventListener('change', function () { if (input.checked) onPick(value === 'always' ? 'always' : 'if'); });
    return h('label', { class: 'radio-card' + (on ? ' is-on' : '') }, input, label);
  }

  /* A sensible first condition for an answer: low scores for numbers, the
     first choice for lists, "was answered" for typed answers. */
  function defaultCondition(ans) {
    if (ans.kind === 'text') return { answer: ans.ref, test: 'answered', value: null };
    if (ans.kind === 'number') return { answer: ans.ref, test: 'at_most', value: ans.max === 10 ? 6 : 2 };
    return { answer: ans.ref, test: 'equals', value: ans.values.length ? ans.values[0].v : '' };
  }

  /* One condition of a rule or of a jump. o (optional) = { prefix: the start
     of the data-test names ('rule-' by default), forJump: true for a jump's
     condition, keepOne: the last condition can't be removed }. */
  function conditionRow(c, i, answers, idx, parsed, commit, o) {
    o = o || {};
    var P = o.prefix || 'rule-';
    var ans = null;
    answers.forEach(function (a) { if (a.ref === c.answer) ans = a; });
    var answerOptions = answers.map(function (a) { return { value: a.ref, label: a.label, group: a.group }; });
    if (!ans) {
      var d = describeAnswer(c.answer);
      answerOptions.unshift({ value: c.answer, label: '⚠ ' + (d ? d.label : c.answer) + ' (can’t be used here)' });
    }
    var answerSel = selectCtl(answerOptions, c.answer, P + 'answer-' + i, function (v) {
      var a = null;
      answers.forEach(function (x) { if (x.ref === v) a = x; });
      if (a) parsed.conds[i] = defaultCondition(a);
      commit();
    }, { aria: o.forJump ? 'Which answer' : 'Which earlier answer' });
    var known = ans || describeAnswer(c.answer);   // for labels, even when it can't be used here
    var kind = known && TESTS_FOR[known.kind] ? known.kind : 'choice';
    var tests = TESTS_FOR[kind].slice();
    if (tests.indexOf(c.test) === -1) tests.unshift(c.test);
    var testSel = selectCtl(tests.map(function (t) { return { value: t, label: TEST_LABELS[t] || t }; }), c.test, P + 'test-' + i, function (v) {
      parsed.conds[i] = convertTest(c, v, known);
      commit();
    }, { aria: 'Test' });
    var valueCtl = conditionValue(c, i, known, commit, P) || h('span');
    var remove = btn('', P + 'remove-' + i, function () {
      if (o.keepOne && parsed.conds.length === 1) { toast('A jump needs at least one condition. To drop it, remove the whole jump.', { kind: 'info' }); return; }
      parsed.conds.splice(i, 1);
      if (!parsed.conds.length) parsed.mode = 'always';
      commit();
    }, { small: true, icon: '✕', aria: 'Remove this condition', title: 'Remove this condition' });
    /* Classes place the parts on narrow windows (see .cond in the look). */
    answerSel.classList.add('cond-answer');
    testSel.classList.add('cond-test');
    valueCtl.classList.add('cond-value');
    remove.classList.add('cond-remove');
    return h('div', { class: 'cond', test: P + 'cond-' + i },
      answerSel, testSel, valueCtl, remove,
      ans ? null : h('div', { class: 'cond-problem field-error', text: problemText(c.answer, idx, o.forJump) }));
  }

  /* Keeps the chosen value sensible when the test changes ("is" <-> "is one of"). */
  function convertTest(c, test, ans) {
    var out = { answer: c.answer, test: test, value: null };
    var first = ans && ans.values.length ? ans.values[0].v : '';
    var current = Array.isArray(c.value) ? c.value[0] : c.value;
    if (test === 'answered' || test === 'not_answered') return out;
    if (test === 'in') { out.value = current !== null && current !== undefined && current !== '' ? [current] : [first]; return out; }
    if (test === 'at_most' || test === 'at_least') {
      out.value = typeof current === 'number' ? current : (ans ? (ans.max === 10 ? 6 : 2) : 2);
      return out;
    }
    out.value = current !== null && current !== undefined && current !== '' ? current : first;
    return out;
  }

  function conditionValue(c, i, ans, commit, prefix) {
    var P = prefix || 'rule-';
    if (c.test === 'answered' || c.test === 'not_answered') return null;
    var values = ans ? ans.values : [];
    if (c.test === 'at_most' || c.test === 'at_least') values = values.filter(function (v) { return typeof v.v === 'number'; });
    function toValue(text) {
      for (var k = 0; k < values.length; k++) if (String(values[k].v) === text) return values[k].v;
      return text;
    }
    if (c.test === 'in') {
      var chosen = arr(c.value).map(String);
      return h('div', { class: 'pills', test: P + 'value-' + i, role: 'group', 'aria-label': 'Possible answers' }, values.map(function (v) {
        var on = chosen.indexOf(String(v.v)) !== -1;
        var input = h('input', { type: 'checkbox', checked: on, test: P + 'value-' + i + '-' + v.v, 'aria-label': v.label });
        input.addEventListener('change', function () {
          var set = values.filter(function (x) {
            return x === v ? input.checked : chosen.indexOf(String(x.v)) !== -1;
          }).map(function (x) { return x.v; });
          if (!set.length) { input.checked = true; toast('Keep at least one answer ticked.', { kind: 'info' }); return; }
          c.value = set;
          commit();
        });
        return h('label', { class: 'pill' + (on ? ' is-on' : '') }, input, v.label);
      }));
    }
    var options = values.map(function (v) { return { value: String(v.v), label: v.label }; });
    if (!values.some(function (v) { return String(v.v) === String(c.value); })) options.unshift({ value: String(c.value), label: '⚠ ' + str(c.value) + ' (not a possible answer)' });
    return selectCtl(options, String(c.value), P + 'value-' + i, function (v) { c.value = toValue(v); commit(); }, { aria: 'Answer value' });
  }

  /* ---- "After this question": where partners go next (jumps) ----------------
     The Screens tab's "next" (usually go to) and "jumps" (exceptions, checked
     in order before "next"). Only LATER rows are offered, so arrows can never
     go round in circles. The answers a jump may test come from the form's
     own checker (ruleAnswers: answers before this screen, its own answers,
     the language and the round). */

  /* A shown thank-you screen without a rule always ends the route, so an
     arrow may point at it from anywhere, also from a question below it (an
     ending never goes on, so no circle is possible: flow-panel.js does the
     same). */
  function isFixedEnding(x) { return !!x && x.type === 'thank_you' && x.active && !x.show_if && !x.skip_if; }

  /* The rows below row idx a jump or "usually go to" may point at, and the
     endings above it: [{ value, label, group }]. Hidden rows are left out. */
  function laterTargets(idx) {
    var end = mainEndIndex();
    var out = [];
    M().screens.forEach(function (x, i) {
      if (i === idx || !x.active || (i < idx && !isFixedEnding(x))) return;
      var ending = x.type === 'thank_you';
      out.push({ value: x.id, label: ending ? (i + 1) + '. ' + (i === end ? 'The thank-you screen' : 'Ending: ' + shorten(screenEnglish(x), 50)) : afterLabel(x, i),
        group: ending ? 'Endings (send the answers)' : (end !== -1 && i > end ? 'Other routes (below the thank-you screen)' : 'Later questions') });
    });
    out.sort(function (a, b) {
      var rank = { 'Later questions': 0, 'Other routes (below the thank-you screen)': 1, 'Endings (send the answers)': 2 };
      return rank[a.group] - rank[b.group];
    });
    return out;
  }

  /* Where "the next one in the list" leads from row idx. A hidden ending on
     the way still ends the route: at the main thank-you screen (flow-panel.js). */
  function followingName(idx) {
    var list = M().screens;
    for (var i = idx + 1; i < list.length; i++) {
      if (list[i].active) return targetName(list[i].id);
      if (list[i].type === 'thank_you') {
        var main = firstFixedEnding();
        return (main ? targetName(main.id) : 'the end (the form adds a thank-you screen)') + ', because the ending below this question (question ' + (i + 1) + ') is hidden';
      }
    }
    return 'the end (the form adds a thank-you screen)';
  }
  /* The main ending as the form's route has it: the first shown thank-you screen without a rule. */
  function firstFixedEnding() { return M().screens.filter(isFixedEnding)[0] || null; }

  function afterCard(s, idx) {
    if (!S.flow.lib) return null;
    var info = flowInfo();
    if (!info || !info.ok) return null;
    if (s.type === 'thank_you') {
      return card({ title: 'After this screen', test: 'after-card' },
        h('p', { class: 'help', test: 'ending-note', text: 'This is an ending: partners stop here and their answers are sent. Partners reach it ' +
          (idx === mainEndIndex() ? 'at the end of the main route, or through a jump.' : 'only through a jump from an earlier question (Edit that question > After this question > Add a jump).') }));
    }
    var box = h('div', { test: 'after-body' });
    function draw() { redraw(box, function () { return afterBody(s, idx, draw); }); }
    draw();
    return card({ title: 'After this question', sub: 'Where partners go next. Usually the next question in the list; a jump sends some partners elsewhere, for example to an ending.', test: 'after-card' }, box);
  }

  function afterBody(s, idx, draw) {
    var out = [];
    var info = flowInfo();
    var dd = s.type === 'function_deep_dives' && settingRaw('deep_dive.when') === 'immediate';
    if (dd) {
      /* In this mode the form does not use this row at all, so its own arrows
         are not offered; settings left over from the other mode can be cleared. */
      out.push(h('div', { class: 'callout is-info small', test: 'after-not-used' }, h('p', { text: 'Not used while the problem screens come straight after each low rating: set where partners go on the area ratings screen instead.' })));
      if (s.next || jumpsUnreadable(s) || jumpsOf(s).length || s.repeat) {
        out.push(h('div', { class: 'callout is-warn small', style: 'margin-top:10px', test: 'after-leftovers' },
          h('p', { text: 'This row still has ' + joinWith([s.next ? 'a “Usually go to”' : '', jumpsUnreadable(s) || jumpsOf(s).length ? 'jumps' : '', s.repeat ? 'an “ask for each area”' : ''].filter(Boolean), 'and') +
            ' from before. They change nothing for partners in this mode, but the check warns about them until they are cleared.' }),
          h('p', null, btn('Clear them', 'after-clear', function () { s.next = ''; s.jumps = []; s.repeat = ''; changed(); draw(); }, { small: true }))));
      }
      return out;
    }
    var rp = routeProblems(s, idx);
    if (rp.row.length) {
      out.push(h('div', { class: 'callout is-warn small', style: 'margin-bottom:10px', test: 'route-problems' },
        h('p', { text: 'The form’s route code says:' }), h('ul', { class: 'route-list' }, rp.row.map(function (m) { return h('li', { text: m }); }))));
    }
    var targets = laterTargets(idx);
    var nextOpts = [{ value: '', label: 'The next one in the list: ' + followingName(idx) }].concat(targets);
    if (s.next && !targets.some(function (t) { return t.value === s.next; })) {
      nextOpts.splice(1, 0, { value: s.next, label: '⚠ ' + targetName(s.next) + ' (can’t be used: it is not below this question, or it is hidden)' });
    }
    out.push(field('Usually go to', selectCtl(nextOpts, s.next || '', 'next-select', function (v) { s.next = v; changed(); draw(); }, { aria: 'Usually go to' }),
      'Arrows only go down the list, so a route can never go round in circles.'));
    if (jumpsUnreadable(s)) {
      out.push(h('div', { class: 'callout is-warn', style: 'margin-top:12px', test: 'jumps-unreadable' },
        h('p', { text: 'The jumps of this question were changed by hand in the Sheet and can’t be read: ' + shorten(s.jumps.unreadable, 80) }),
        h('p', null, btn('Remove them, and build them again here', 'jumps-clear', function () { s.jumps = []; changed(); draw(); }, { small: true, kind: 'danger' }))));
    } else {
      jumpsOf(s).forEach(function (j, k) { out.push(jumpRow(s, idx, j, k, draw, targets, rp)); });
      out.push(h('div', { style: 'margin-top:10px' }, btn('Add a jump', 'jump-add', function () { addJump(s, idx, targets); draw(); }, { small: true, icon: '+' })));
    }
    out.push(h('div', { class: 'sentence', test: 'jump-sentence' }, afterSentence(s, idx)));
    return out;
  }

  /* A new jump: "if <this question's answer (or the last one before it)> …
     go to the first ending below it". */
  function addJump(s, idx, targets) {
    if (!targets.length) { toast('There is nothing below this question to jump to. Add a question or an ending below it first.', { kind: 'info', timeout: 7000 }); return; }
    var own = ownAnswers(idx);
    var answers = ruleAnswers(s, idx, 'jump').filter(function (a) { return a.kind !== 'fact'; });
    var facts = factAnswers();
    var first = own[own.length - 1] || answers[answers.length - 1] || facts[0];
    if (!first) { toast('Nothing can be tested here yet.', { kind: 'info' }); return; }
    var ending = targets.filter(function (t) { return t.group === 'Endings (send the answers)'; })[0] || targets[0];
    if (!Array.isArray(s.jumps)) s.jumps = [];
    s.jumps.push({ when: conditionObject(defaultCondition(first)), 'goto': ending.value });
    changed();
  }

  function jumpRow(s, idx, j, k, draw, targets, rp) {
    var P = 'jump-' + k + '-';
    var jumps = s.jumps;
    var head = h('div', { class: 'row-head' }, h('span', { class: 'name', text: 'Jump ' + (k + 1) }),
      h('span', { class: 'small muted', text: k === 0 ? 'checked first' : 'checked if the jumps above don’t apply' }),
      h('div', { class: 'btn-group' },
        k > 0 ? btn('', P + 'up', function () { moveItem(jumps, k, k - 1); changed(); draw(); }, { small: true, icon: '↑', aria: 'Check this jump earlier' }) : null,
        k < jumps.length - 1 ? btn('', P + 'down', function () { moveItem(jumps, k, k + 1); changed(); draw(); }, { small: true, icon: '↓', aria: 'Check this jump later' }) : null,
        btn('Remove', P + 'remove', function () { jumps.splice(k, 1); changed(); draw(); }, { small: true, kind: 'danger' })));
    var body = [head];
    if (!j || typeof j !== 'object') {
      body.push(h('p', { class: 'field-error', text: 'This jump can’t be read. Remove it and add it again.' }));
      return h('div', { class: 'jump-row', test: 'jump-' + k }, body);
    }
    var answers = ruleAnswers(s, idx, 'jump');
    var parsed = parseRule(j.when);
    function commit() { j.when = buildRule(parsed); changed(); draw(); }
    if (parsed.mode === 'complex' || parsed.mode === 'always') {
      body.push(h('div', { class: 'callout is-warn small', test: P + 'complex' },
        h('p', null, parsed.mode === 'always' ? 'This jump has no condition.' : 'This jump’s condition was written by hand and is too detailed for this editor: ', parsed.mode === 'always' ? null : h('strong', { text: ruleSentence(j.when) })),
        h('p', null, btn('Replace it with a simple condition', P + 'replace', function () {
          var first = answers[answers.length - 1];
          if (!first) { toast('Nothing can be tested here yet.', { kind: 'info' }); return; }
          j.when = conditionObject(defaultCondition(first)); changed(); draw();
        }, { small: true }))));
    } else {
      body.push(h('div', { class: 'small muted', style: 'margin-top:2px', text: 'If' }));
      if (parsed.conds.length > 1) {
        body.push(h('div', { class: 'row', style: 'margin-top:6px' }, h('span', { text: 'Jump when' }),
          selectCtl([{ value: 'all', label: 'all of these are true' }, { value: 'any', label: 'any of these is true' }], parsed.combine, P + 'combine',
            function (v) { parsed.combine = v; commit(); }, { aria: 'All or any of the conditions', inline: true })));
      }
      parsed.conds.forEach(function (c, i) { body.push(conditionRow(c, i, answers, idx, parsed, commit, { prefix: P, forJump: true, keepOne: true })); });
      body.push(h('div', { style: 'margin-top:8px' }, btn('Add another condition', P + 'add', function () {
        var last = answers[answers.length - 1];
        if (!last) return;
        parsed.conds.push(defaultCondition(last));
        commit();
      }, { small: true, icon: '+' })));
    }
    var gotoOpts = targets.slice();
    if (j['goto'] && !targets.some(function (t) { return t.value === j['goto']; })) {
      gotoOpts.unshift({ value: j['goto'], label: '⚠ ' + targetName(j['goto']) + ' (can’t be used: it is not below this question, or it is hidden)' });
    }
    if (!j['goto']) gotoOpts.unshift({ value: '', label: 'Pick where to go' });
    var gotoSel = selectCtl(gotoOpts, j['goto'] || '', P + 'goto', function (v) { j['goto'] = v; changed(); draw(); }, { aria: 'Go to' });
    body.push(h('div', { class: 'jump-goto' }, h('label', { class: 'field-label', for: gotoSel.id = 'jg' + (++uid), text: '→ go to' }), gotoSel));
    var problems = (rp.jumps[k] || []).slice();
    if (rp.dropped[k]) problems.unshift('This jump is not used by the form: its question is missing, above this one or hidden, or its condition is incomplete. Pick another question or ending.');
    if (problems.length) body.push(h('div', { class: 'field-error', style: 'margin-top:6px', test: P + 'problem' }, '⚠ This jump can never happen. ', problems.join(' ')));
    return h('div', { class: 'jump-row', test: 'jump-' + k }, body);
  }

  /* "After this question, partners go to …; except: if …, they go to …". */
  function afterSentence(s, idx) {
    var usual = s.next ? targetName(s.next) : followingName(idx);
    var parts = ['After this question, partners go to ', h('strong', { text: usual }), '.'];
    jumpsOf(s).forEach(function (j) {
      if (!j || typeof j !== 'object' || !j['goto']) return;
      parts.push(' Except: if ', h('strong', { text: ruleSentence(j.when) || '(no condition)' }), ', they go to ', h('strong', { text: targetName(j['goto']) }), '.');
    });
    if (jumpsOf(s).length > 1) parts.push(' The first jump that applies wins.');
    return parts;
  }

  /* ---- "Add an ending": another thank-you screen, reached by a jump -------- */

  function addEndingFlow() {
    var titleBox = textInput('', 'ending-new-title', null, { placeholder: 'For example: Thank you! Our team will call you this week.' });
    var bodyBox = h('textarea', { rows: 2, test: 'ending-new-body', placeholder: 'For example: Your answers were sent. You can close this page.', 'aria-label': 'Message in English' });
    var preview = h('div', { class: 'help', test: 'ending-new-code' });
    function taken() {
      var t = takenScreenIds();
      Object.keys(M().texts).forEach(function (k) { var m = /^end\.([a-z0-9_]+)\./.exec(k); if (m) t[m[1]] = true; });
      return t;
    }
    function upd() { preview.textContent = 'Code in the data: ' + slug(titleBox.value, taken(), 'ending') + ' (' + codeChangeHint() + '). Its texts: end.<code>.title and end.<code>.body.'; }
    titleBox.addEventListener('input', upd);
    upd();
    openModal({
      title: 'Add an ending', test: 'add-ending-modal',
      body: [h('p', { class: 'help', text: 'Another thank-you screen. It goes below the main one, and partners get there only through a jump you add to an earlier question. It sends the answers, like the main one.' }),
        field('Title in English', titleBox, null, preview),
        field('Message in English', bodyBox, 'The other languages show the English until they are translated (Texts & translations).')],
      buttons: [
        { label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } },
        { label: 'Add ending', kind: 'primary', test: 'ending-new-create', onClick: function (c) {

          if (!bodyBox.value.trim()) { bodyBox.classList.add('is-invalid'); bodyBox.focus(); toast('Write the message in English too.', { kind: 'info' }); return; }
          c();
          var id = slug(titleBox.value, taken(), 'ending');
          var s = normaliseScreen({ id: id, type: 'thank_you', active: true, required: null, text: 'end.' + id + '.title', body: 'end.' + id + '.body' });
          addTextKey(s.text, { en: titleBox.value.trim() }, 'end.');
          addTextKey(s.body, { en: bodyBox.value.trim() }, 'end.');
          M().screens.push(s);
          changed();
          S.ui.qview = 'list';
          go('questions', { test: 'screen-card-' + id });
          toast('Ending added below the thank-you screen. Now send partners there with a jump: Edit an earlier question > After this question > Add a jump.', { kind: 'ok', timeout: 9000 });
        } }
      ]
    });
  }

  /* ---- Questions > Map ----------------------------------------------------- */

  function backToList() {
    return btn('← All questions', 'qview-back', function () { stopMapFrame(); S.ui.qview = 'list'; renderMain(false); }, { small: true });
  }

  function mapView() {
    var st = S.ui.map;
    var box = h('div', { test: 'map-box', 'data-state': 'starting', style: 'margin-top:12px' });
    setTimeout(function () { if (document.body.contains(box)) fillMap(box); }, 0);
    return [
      sectionHead('Map of the route', 'Every screen partners can get and every arrow between them, worked out by the form’s own route code.', backToList()),
      card({ test: 'map-card' },
        h('div', { class: 'radio-cards', role: 'radiogroup', 'aria-label': 'Which version' },
          choiceCard('map-which', 'draft', st.which === 'draft', 'Your draft (unsaved changes included)', 'map-which-draft', function () { st.which = 'draft'; renderMain(true); }),
          choiceCard('map-which', 'live', st.which === 'live', 'The live version (what partners get now)', 'map-which-live', function () { st.which = 'live'; renderMain(true); })),
        box)
    ];
  }

  function fillMap(box) {
    stopMapFrame();
    var st = S.ui.map, lib = S.flow.lib;
    function say(cls, text, test, extra) {
      box.setAttribute('data-state', 'message');
      redraw(box, function () { return h('div', { class: 'callout' + (cls ? ' ' + cls : ''), test: test }, h('p', { text: text }), extra || null); });
    }
    var survey, strings;
    if (st.which === 'live') {
      if (!st.live && !st.liveError) {
        say('', 'Loading the live version…', 'map-live-loading');
        if (!st.liveLoading) {
          st.liveLoading = true;
          call('panelLiveSurvey').then(function (res) { st.live = obj(res); }, function (e) { st.liveError = e.message; }).then(function () {
            st.liveLoading = false;
            if (document.body.contains(box)) fillMap(box);
          });
        }
        return;
      }
      if (st.liveError) {
        say('is-error', 'The live version could not be loaded: ' + st.liveError, 'map-live-error',
          h('p', null, btn('Try again', 'map-live-retry', function () { st.liveError = ''; st.live = null; fillMap(box); }, { small: true })));
        return;
      }
      if (!st.live.live) { say('', 'Nothing is published yet, so partners get the questionnaire stored in GitHub. Switch to your draft to see its map.', 'map-live-none'); return; }
      survey = st.live.survey;
      strings = st.live.strings;
    } else {
      var info = flowInfo();
      if (!info || !info.ok) { say('is-warn', 'The route could not be worked out: ' + (info ? info.error : 'the route tools are not loaded') + '.', 'map-error'); return; }
      survey = info.survey;
      strings = M().texts;
    }
    var code;
    try { code = lib.flowCheck.toMermaid(survey, strings); } catch (e) {
      say('is-error', 'The map could not be made: ' + ((e && e.message) || e), 'map-error');
      return;
    }
    drawMapFrame(box, code, survey, strings, st.which === 'live' ? 'Version ' + str(st.live.live.version) : 'Your draft');
  }

  /* The Map: the route as a text outline straight away (with the
     mermaid.live link), and the drawing in a sandboxed frame below it, out of
     sight until the frame says "drawn"; then the drawing replaces the
     outline. After MAP_SLOW_MS a note says it is still loading; after
     MAP_WAIT_MS (or when the frame says "failed") the panel stops waiting
     and keeps the outline. */
  function drawMapFrame(box, code, survey, strings, label) {
    var token = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    var frame = h('iframe', { class: 'map-frame is-loading', sandbox: 'allow-scripts', title: 'Map of the route: ' + label, test: 'map-frame', tabindex: '-1' });
    frame.setAttribute('srcdoc', mapDocument(code, token));
    var status = h('p', { class: 'help', test: 'map-status' }, h('span', { class: 'spinner is-small' }),
      ' Drawing the map of ' + label.toLowerCase() + '… Meanwhile, here is the same route as a list.');
    var link = h('p', { class: 'help', test: 'map-link' },
      h('a', { href: mermaidLiveUrl(code), target: '_blank', rel: 'noopener noreferrer', test: 'map-mermaid-live' }, 'Open in mermaid.live ↗'),
      ' draws it in a new browser tab. The link holds only the questionnaire’s wording and codes, no partner data.');
    var outline = h('div', { test: 'map-text' }, routeOutline(survey, strings));
    box.textContent = '';
    box.setAttribute('data-state', 'drawing');
    appendKids(box, [status, link, outline, frame]);
    mapFrame = { el: frame, token: token, timer: null, slowTimer: null, onMessage: null };
    function fallback(why) {
      if (mapFrame.el !== frame) return;
      stopMapFrame();
      if (!document.body.contains(box)) return;
      box.setAttribute('data-state', 'fallback');
      frame.remove();
      status.remove();
      box.insertBefore(h('div', { class: 'callout is-warn', test: 'map-fallback' },
        h('p', { text: 'The diagram could not be drawn here (' + why + '). Below is the same route as a list; the link opens the drawing in a new tab.' })), box.firstChild);
    }
    mapFrame.onMessage = function (d) {
      if (d.kind === 'drawn') {
        clearTimeout(mapFrame.timer);
        clearTimeout(mapFrame.slowTimer);
        mapFrame.timer = null;
        mapFrame.slowTimer = null;

  /* ---- Questions > Try a path -------------------------------------------------

     shows the screens, why the others are skipped, where Next would be

  function testedInputs(info) {
    var F = S.flow.lib.flow;
    var keys = [], facts = {};
    var areas = F.items(info.graph, info.survey, 'areas');
    function add(k) { if (keys.indexOf(k) === -1) keys.push(k); }
    function cond(c) {
      if (!c || typeof c !== 'object') return;
      if (Array.isArray(c.all)) c.all.forEach(cond);
      if (Array.isArray(c.any)) c.any.forEach(cond);
      if (c.not) cond(c.not);
      if (typeof c.fact === 'string') facts[c.fact] = true;
      if (typeof c.answer === 'string') {
        if (/\{area(\.[a-z_]+)?\}/.test(c.answer)) areas.forEach(function (a) { add(F.fill(c.answer, { area: a })); });
        else add(c.answer);
      }
    }
    function node(n) {
      if (!n || typeof n !== 'object') return;
      cond(n.show_if);
      if (n.repeat_for && n.repeat_for.where) cond(n.repeat_for.where);
      if (Array.isArray(n.next)) n.next.forEach(function (x) { if (x && typeof x === 'object') cond(x.when); });
      if (n.type === 'group' && n.body) arr(n.body.nodes).forEach(node);
    }
    arr(info.graph.nodes).forEach(node);
    var all = catalogAnswers(null) || [];
    var known = {};
    all.forEach(function (d) { known[d.ref] = true; });
    return { answers: all.filter(function (d) { return keys.indexOf(d.ref) !== -1; }), unknown: keys.filter(function (k) { return !known[k]; }), round: !!facts.round };
  }

  function tryResult(info, st) {

  /* One line of the "Put it after" list. Built-in blocks use the name on

  function afterLabel(s, i) {

  function createScreen(type, english, afterIdx) {
    var t = typeInfo(type);
    var id = t.builtin ? slug(t.default_id || type, takenSet(M().screens.map(function (s) { return s.id; })), type) : slug(english, takenScreenIds(), 'question');
    var s = normaliseScreen({ id: id, type: type, active: true, required: null });
    if (t.fields.indexOf('required') !== -1) s.required = effectiveRequired(s);   // start from the type's standard
    if (t.needs_text) {
      var key = t.default_text || 'q.' + id;
      s.text = key;
      if (!M().texts[key]) addTextKey(key, { en: english }, 'q.');

  /* ==========================================================================
     PART 17. LOADING, SAVING, PREVIEWING AND PUBLISHING
     ========================================================================== */

  function adoptLoad(res, keepSection) {
    res = obj(res);
    S.revision = res.revision;
    S.model = normaliseModel(res.model);
    var cat = obj(res.catalog);
    S.catalog = { settings_schema: arr(cat.settings_schema), screen_types: arr(cat.screen_types), form_text_keys: arr(cat.form_text_keys) };
    S.live = res.live && typeof res.live === 'object' ? res.live : null;
    /* codes_locked is false until the first real round opens: nothing is
       locked yet. (A server without codes_locked locks whatever is live.) */
    S.codesLocked = res.codes_locked !== false;
    S.liveIdsUnknown = S.codesLocked && !!res.live_ids_unknown;
    S.liveIds = normaliseLiveIds(S.codesLocked ? (S.liveIdsUnknown ? idsOfModel(S.model) : res.live_ids) : null);
    S.draftDiffers = !!res.draft_differs_from_live;
    S.savedKey = contentKey(S.model);
    rememberLiveBullets();
    S.user = str(res.user);
    S.urls = { sheet: str(res.spreadsheet_url), folder: str(res.folder_url), webApp: str(res.web_app_url) };
    /* The web app address counts only once someone recorded it (a server
       without web_app_url_recorded sends an address only when it knows it). */
    S.webAppRecorded = !!S.urls.webApp && res.web_app_url_recorded !== false;
    S.webAppAccess = S.webAppRecorded ? (str(res.web_app_access) === 'domain' ? 'domain' : 'anyone') : '';
    S.dcCount = Number(res.dc_count) || 0;
    S.activeDcCount = Number(res.active_dc_count) || 0;
    S.savedRoundIds = {};
    S.model.rounds.forEach(function (r) { S.savedRoundIds[r.id] = true; });
    S.dirty = false;
    if (S.undo && S.undo.remove) S.undo.remove();
    S.undo = null;
    if (!keepSection && res.open_section) {
      var hint = String(res.open_section).toLowerCase().replace(/[^a-z]/g, '');
      SECTIONS.forEach(function (sec) { if (hint === sec.id || hint.indexOf(sec.id) === 0) S.section = sec.id; });
      if (hint.indexOf('link') !== -1) S.section = 'links';
      if (hint.indexOf('publish') !== -1) S.section = 'publish';
    }
    if (S.ui.editing !== null && !findScreen(S.ui.editing)) S.ui.editing = null;
  }

  /* Loads can overlap (a background refresh after Save, then a reload after
     opening a round). Only the most recently requested one may be used, so an
     older, slower answer never overwrites a newer one. Resolves null for an
     outdated answer. */
  var loadSeq = 0;
  function loadLatest() {
    var mine = ++loadSeq;
    return call('panelLoad').then(function (res) { return mine === loadSeq ? res : null; });
  }

  function reloadQuiet() {
    return loadLatest().then(function (res) { if (res) { adoptLoad(res, true); forgetUnsaved(); renderAll(); } });
  }

  function save(o) {
    o = o || {};
    if (S.saving) return S.savingPromise;
    if (!S.dirty && !o.force) return Promise.resolve(true);
    S.saving = true;
    updateChrome();
    var seq = S.changeSeq;
    var roundIds = M().rounds.map(function (r) { return r.id; });
    var sentKey = contentKey(M());
    S.savingPromise = call('panelSave', S.revision, M()).then(function (res) {
      res = obj(res);
      S.saving = false;
      if (res.ok) {
        S.revision = res.revision;
        S.draftDiffers = !!res.draft_differs_from_live;
        S.savedKey = sentKey;
        S.savedRoundIds = {};
        roundIds.forEach(function (id) { S.savedRoundIds[id] = true; });
        if (S.changeSeq === seq) { S.dirty = false; forgetUnsaved(); rememberLiveBullets(); }
        updateChrome();
        savedMessage(o);
        refreshAfterSave(seq);
        return true;
      }
      updateChrome();
      if (res.conflict) return resolveConflict(res, o);
      throw new Error('The Sheet gave an unexpected answer while saving. Please try again.');
    }).catch(function (e) {
      S.saving = false;
      updateChrome();
      showError('Your changes were not saved', e, function () { save(o); });
      return false;
    });
    return S.savingPromise;
  }

  /* The message after a save. After "Keep mine and overwrite" it always says
     whose changes were replaced; a plain Save also mentions mistyped colours
     (they block publishing). Saves made on the way to something else (quiet)
     say nothing else. */
  function savedMessage(o) {
    if (o.replaced) {
      toast('Saved. You replaced the changes ' + o.replaced.who + ' saved ' + whenText(o.replaced.at) + '.', { kind: 'ok', timeout: 9000 });
      return;
    }
    if (o.quiet) return;
    var bad = badColorNames();
    if (bad.length) {
      var one = bad.length === 1;
      toast('Saved. ' + (one ? 'The colour code of ' + bad[0] + ' is' : 'The colour codes of ' + joinWith(bad, 'and') + ' are') +
        ' not valid yet (Look & feel): ' + COLOR_HINT + '. Publishing waits until ' + (one ? 'it is' : 'they are') + ' fixed.', { timeout: 9000 });
      return;
    }
    toast('Saved. Partners don’t see it until you publish.', { kind: 'ok' });
  }

  /* The server tidies texts while saving (fills "[TRANSLATE]", adds notes for
     translators). Fetch its version, unless the person kept typing. */
  function refreshAfterSave(seq) {
    loadLatest().then(function (res) {
      if (!res || S.changeSeq !== seq || S.dirty || S.saving) return;
      adoptLoad(res, true);
      updateChrome();
      renderMain(true);
    }, function () { /* the save itself worked; a later load will catch up */ });
  }

  /* Saves until nothing is left unsaved (edits made while a save was running
     need a second save). Resolves true when everything is in the Sheet. */
  function saveAll() {
    var tries = 0;
    function step() {
      if (!S.dirty && !S.saving) return Promise.resolve(true);
      if (tries++ > 3) return Promise.resolve(!S.dirty);
      return save({ quiet: true }).then(function (ok) { return ok ? step() : false; });
    }
    return step();
  }

  function resolveConflict(res, o) {
    return new Promise(function (resolve) {
      var who = str(res.saved_by) || 'Someone else';
      var when = res.saved_at ? fmtDate(res.saved_at, true) : 'a moment ago';
      openModal({
        title: 'Someone else saved changes', test: 'conflict', dismissible: false,
        body: [h('p', null, h('strong', { text: who }), ' saved the draft (' + when + ') after you opened the control panel. Their changes and yours can’t be combined automatically.'),
          h('ul', { style: 'margin:0 0 6px;padding-left:18px' },
            h('li', null, h('strong', { text: 'Reload the latest version: ' }), 'you get their version, and your unsaved changes are lost.'),
            h('li', null, h('strong', { text: 'Keep mine and overwrite: ' }), 'your version replaces theirs.'))],
        /* Reloading is the safe choice, so it is the main button; overwriting
           throws away someone else's work, so it looks like a warning. */
        buttons: [
          { label: 'Cancel', test: 'conflict-cancel', onClick: function (c) { c(); resolve(false); } },
          { label: 'Keep mine and overwrite', kind: 'warn', test: 'conflict-overwrite', onClick: function (c) {
            c();
            S.revision = res.revision;
            S.dirty = true;
            save(Object.assign({}, o, { force: true, replaced: { who: str(res.saved_by) || 'someone else', at: res.saved_at } })).then(resolve);
          } },
          { label: 'Reload the latest version', kind: 'primary', test: 'conflict-reload', onClick: function (c) {
            c();
            withBusy('Loading the latest version…', reloadQuiet).then(function () { toast('You now have the latest version.', { kind: 'ok' }); resolve(false); },
              function (e) { showError('The latest version could not be loaded', e); resolve(false); });
          } }
        ]
      });
    });
  }

  function discardFlow() {
    confirmBox({ title: 'Discard your unsaved changes?', test: 'confirm-discard', body: [h('p', { text: 'The panel goes back to the last saved draft. This can’t be undone.' })], ok: 'Discard changes', danger: true })
      .then(function (ok) {
        if (!ok) return;
        withBusy('Loading the saved draft…', reloadQuiet).then(function () { toast('Changes discarded.', { kind: 'ok' }); },
          function (e) { showError('The saved draft could not be loaded', e); });
      });
  }

  function runCheck() {
    return withBusy('Checking for problems…', function () { return call('panelValidate', M()); }).then(function (res) {
      res = obj(res);
      S.ui.check = { errors: arr(res.errors), warnings: arr(res.warnings), summary: res.summary || null, seq: S.changeSeq, at: new Date() };
      if (S.section === 'publish') renderMain(true);
      updateChrome();
      return S.ui.check;
    }, function (e) { showError('The check could not run', e, runCheck); return null; });
  }

  function publishFlow() {
    if (S.section !== 'publish') go('publish');
    var before = saveAll();
    return before.then(function (ok) {
      if (!ok) return null;
      return runCheck();
    }).then(function (check) {
      if (!check) return;
      if (check.errors.length) {
        S.ui.pendingFocus = { test: 'check-errors' };
        applyPendingFocus();
        toast('Not published: fix the ' + plural(check.errors.length, 'problem') + ' marked in red first.', { kind: 'error', timeout: 7000 });
        return;
      }
      return askPublishNote(check).then(function (note) {
        if (note === null) return;
        return withBusy('Publishing… this can take up to a minute.', function () { return call('panelPublish', S.revision, note); })
          .then(function (res) { return afterPublish(obj(res), note); });
      });
    }).catch(function (e) { showError('Nothing was published', e); });
  }

  function askPublishNote(check) {
    return new Promise(function (resolve) {
      var next = S.live ? Number(S.live.version) + 1 : 1;
      var same = sameAsLive();
      var note = h('textarea', { rows: 3, test: 'publish-note-modal', value: S.ui.publishNote, placeholder: 'For example: Added a Returns area', 'aria-label': 'Note for the history' });
      var err = h('div', { class: 'field-error' });

        title: 'Publish version ' + next + '?', test: 'publish-modal', onClose: function (r) { if (r === undefined || r === null) resolve(null); },
        body: [same ? h('div', { class: 'callout is-warn', style: 'margin-bottom:10px', test: 'publish-same-as-live' }, h('p', { text: sameAsLiveText() + ' Publish anyway?' })) : null,
          h('p', { text: 'This makes your saved draft live for every partner straight away. Partners who already started get this version the next time they open their link: their answers are kept, and they carry on where they stopped (a question you added before that point is skipped for them).' }),
          check.warnings.length ? h('div', { class: 'callout is-warn', style: 'margin-bottom:10px' }, h('p', { text: 'There ' + (check.warnings.length === 1 ? 'is 1 warning' : 'are ' + check.warnings.length + ' warnings') + '. They don’t block publishing, but have a look first.' })) : null,

        buttons: [

          { label: same ? 'Publish anyway' : 'Publish now', kind: 'primary', test: 'publish-confirm', onClick: function (c) {
            if (!note.value.trim()) { err.textContent = 'Write a few words, so everyone knows what this version changed.'; note.focus(); return; }

          } }
        ]
      });
