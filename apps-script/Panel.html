      support: {
        items: m.support.filter(function (x) { return x.active && x.code; }).map(function (x) { return x.code; }),
        allow_not_applicable: typedSetting('support.allow_not_applicable'), allow_comment: typedSetting('support.allow_comment'),
        comment_text: typedSetting('support.comment_text')
      }
    };
  }

  function flowKey() {
    var m = M();
    return JSON.stringify([m.screens, m.areas, m.chips, m.support, m.languages, m.rounds.map(function (r) { return r.id; }),
      FLOW_SETTINGS.map(function (k) { return m.settings[k]; })]);
  }

  /* 'question 5 ("Did you contact Valmo support…")', the way Model.gs names questions. */
  function questionName(row, index) {
    var place = 'question ' + (index + 1);
    var text = row && row.text ? shorten(en(row.text), 60) : '';
    if (text) return place + ' ("' + text + '")';
    var t = row ? typeInfo(row.type) : null;
    return t && t.label ? place + ' (' + t.label + ')' : place;
  }

  /* The draft's route, made and checked by the form's own code. Cached until
     the screens, areas, problems, support items, languages, rounds or the
     route's settings change (typing a text never rebuilds it). Returns null
     without the route code; info.ok = false (with info.error) if it failed.
       survey      the draft as the form would get it (survey.flow = the graph)
       graph       the same graph, indexed by the engine (graph.byId)
       notes       what flow-panel.js said while making it ({ code, row, message })
       nodeOfRow   row index -> the node the row became (null: hidden or not used)
       rowOfNode   '#' + node id -> row index
       findings    the checker's findings ({ level, code, node, message })
       catalog     every answer code a screen can store ({ key, node, part, vars, owner })
       avail       routeAnswers: which of them a rule or a jump on each node may test */
  function flowInfo() {
    var lib = S.flow.lib;
    if (!lib || !S.model) return null;
    teachKinds(lib);
    var key = flowKey();
    if (flowCache && flowCache.key === key) return flowCache;
    var info = { key: key, ok: false, error: '' };
    flowCache = info;
    try {
      var survey = draftSurvey();
      var made = lib.flowPanel.fromRows(M().screens, survey, { nameOf: questionName });
      survey.flow = made.graph;
      info.survey = survey;
      info.notes = arr(made.warnings);
      info.graph = lib.flow.load(survey);
      info.nodeOfRow = rowNodes(info.graph);
      info.rowOfNode = {};
      info.nodeOfRow.forEach(function (id, i) { if (id && info.rowOfNode['#' + id] === undefined) info.rowOfNode['#' + id] = i; });
      var nameOf = function (node) {
        var i = node && typeof node.id === 'string' ? info.rowOfNode['#' + node.id] : undefined;
        return i === undefined ? '' : questionName(M().screens[i], i);
      };
      info.findings = arr(lib.flowCheck.check(survey, null, { surface: 'panel', nameOf: nameOf }).findings);
      info.catalog = keyCatalog(lib, info);
      info.avail = routeAnswers(lib, info);
      info.ok = true;
    } catch (e) {
      info.error = (e && e.message) || String(e);
    }
    return info;
  }

  /* Which node each row became: its own (same code), or, for the area
     ratings while problem screens follow each low rating, the group that
     holds them. Hidden rows (and that mode's problem screens row) have none. */
  function rowNodes(graph) {
    var byId = {};
    arr(graph.nodes).forEach(function (n) {
      if (!n || typeof n !== 'object' || typeof n.id !== 'string') return;
      if (n.type === 'group' && n.body) {
        arr(n.body.nodes).forEach(function (b) {
          if (b && b.type === 'function_rating' && byId['#' + b.id] === undefined) byId['#' + b.id] = n.id;
        });
      }
      if (byId['#' + n.id] === undefined) byId['#' + n.id] = n.id;
    });
    return M().screens.map(function (s) { return s.active && byId['#' + s.id] ? byId['#' + s.id] : null; });
  }

  /* Every answer code a node can store, from the engine itself
     (PP.flow.keysOf for each node and loop item), in the route's order.
     owner = the top-level node (= the row) it belongs to. */
  function keyCatalog(lib, info) {
    var F = lib.flow, g = info.graph, survey = info.survey;
    var out = [], seen = {};
    function add(node, vars, owner) {
      F.keysOf(g, survey, node, vars).forEach(function (k, part) {
        if (typeof k !== 'string' || seen['#' + k]) return;
        seen['#' + k] = true;
        out.push({ key: k, node: node, part: part, vars: vars, owner: owner });
      });
    }
    function each(node, owner, outer) {
      if (!node || typeof node !== 'object') return;
      var rf = node.repeat_for;
      if (rf && typeof rf.each === 'string') {
        F.items(g, survey, rf['in']).forEach(function (item) {
          var vars = Object.assign({}, outer);
          vars[rf.each] = item;
          visit(node, owner, vars);
        });
      } else {
        visit(node, owner, outer);
      }
    }
    function visit(node, owner, vars) {
      if (node.type === 'group') { arr(node.body && node.body.nodes).forEach(function (b) { each(b, owner, vars); }); return; }
      add(node, vars, owner);
    }
    arr(g.nodes).forEach(function (n) { if (n && typeof n.id === 'string') each(n, n.id, {}); });
    return out;
  }

  /* Which answers can a rule on each node test? The form's own checker
     says: PP.flowCheck.answersAt gives exactly what its rule checks accept
     there ("show only if": the answers that can exist before the node; a
     jump: those and the node's own). Returns { ok, at: { '#' + node id: {
     show_if: { '#code': true }, jump: { '#code': true } } }, kinds: { '#code': the
     checker's description of that answer (kind, min, max, na, values) } }.
     ok is false with an older route code (a Flow.gs from before 26 Oct 2026
     has no answersAt), or if it fails: the callers then offer the older list
     of earlier rows (availableAnswers), which is safe: Publish still checks
     every rule, and the rest of the route tools keep working. */
  function routeAnswers(lib, info) {
    var C = lib.flowCheck;
    var out = { ok: false, at: {}, kinds: {} };
    if (typeof C.answersAt !== 'function') return out;
    try {
      var all = C.answersAt(info.survey, null, {});
      if (!all || !all.ok) return out;
      arr(all.answers).forEach(function (a) { if (a && typeof a.key === 'string') out.kinds['#' + a.key] = a; });
      info.nodeOfRow.forEach(function (id) {
        if (!id || out.at['#' + id]) return;
        var entry = { show_if: {}, jump: {} };
        [['show_if', {}], ['jump', { forJump: true }]].forEach(function (x) {
          arr(C.answersAt(info.survey, id, x[1]).answers).forEach(function (a) { if (a && typeof a.key === 'string') entry[x[0]]['#' + a.key] = true; });
        });
        out.at['#' + id] = entry;
      });
    } catch (e) {
      return { ok: false, at: {}, kinds: {} };   // the earlier rows instead; the rest of the route tools keep working
    }
    out.ok = true;
    return out;
  }

  /* Kinds of question added in web/js/types/ (docs/config-guide.md, "How to
     add a question type") are not in the route code itself: each one comes
     with its row in the Sheet's list of kinds (S.catalog.screen_types, from
     Model.gs PP_SCREEN_TYPES) as "catalogue", its whole description. They are
     taught to this window's route code, as Model.gs PP_mdlFlowLib_ does on
     the server, so the badges, Map and "Try a path" know them. A kind the
     code already knows keeps its own rules. */
  function teachKinds(lib) {
    if (!lib || !lib.flowCheck || typeof lib.flowCheck.loadCatalogue !== 'function') return;
    var entries = [];
    arr(S.catalog.screen_types).forEach(function (row) {
      if (row && row.catalogue && typeof row.catalogue === 'object' && !Array.isArray(row.catalogue)) entries.push(row.catalogue);
    });
    if (!entries.length) return;
    var added = [];
    try { added = arr(lib.flowCheck.loadCatalogue(entries)); } catch (e) { return; }
    if (added.length) flowCache = null;   // the route is worked out again with them
  }

  /* One catalogue entry described for Try a path's drop-downs and the rule
     sentences (labels in English), or null for codes rules can't test. */
  function describeEntry(info, e) {
    var n = e.node, t = n.type;
    var rowIdx = info.rowOfNode['#' + e.owner];
    var row = rowIdx === undefined ? findScreen(n.id) : M().screens[rowIdx];
    var item = e.vars ? e.vars.area : undefined;
    var areaId = item && typeof item === 'object' ? item.id : item;
    var forArea = areaId !== undefined ? ' for ' + areaName(areaId) : '';
    var q = shorten((row && screenEnglish(row)) || n.id, 48);
    var naArea = n.allow_not_applicable === true ? (en('rating.na') || 'I don’t handle this') : null;
    var d = null;
    switch (t) {
      case 'nps_0_10':
        d = numberAnswer(e.key, q + (forArea ? ' –' + forArea : ''), 'the answer to ' + quote(q) + forArea, 0, 10, { group: 'Questions' }); break;
      case 'rating_1_5':
        d = numberAnswer(e.key, q + (forArea ? ' –' + forArea : ''), 'the answer to ' + quote(q) + forArea, 1, 5, { faces: true, group: 'Questions' }); break;
      case 'yes_no':
        d = choiceAnswer(e.key, q + (forArea ? ' –' + forArea : ''), 'the answer to ' + quote(q) + forArea, [{ v: 'yes', label: en('ui.yes') || 'Yes' }, { v: 'no', label: en('ui.no') || 'No' }], 'Questions'); break;
      case 'single_choice':
      case 'multi_choice':
        d = choiceAnswer(e.key, q + (forArea ? ' –' + forArea : ''), (t === 'multi_choice' ? 'the answers ticked in ' : 'the answer to ') + quote(q) + forArea, arr(n.options).map(function (o) {
          var code = o && typeof o === 'object' ? str(o.code) : str(o);
          return { v: code, label: optionLabel(n.id, code) };
        }), 'Questions');
        if (t === 'multi_choice') multiAnswer(d);
        break;
      case 'free_text':
        d = textAnswer(e.key, q + (forArea ? ' –' + forArea : '') + ' (typed or recorded)', 'the question ' + quote(q) + forArea, 'Questions'); break;
      case 'function_rating':
        d = numberAnswer(e.key, 'Rating of ' + areaName(areaId), 'the rating of ' + areaName(areaId), 1, 5, { faces: true, na: naArea, group: 'Area ratings' }); break;
      case 'function_deep_dive': {
        var values = arr(item && typeof item === 'object' ? item.issues : []).map(function (code) { return { v: code, label: chipLabel(areaId, code) }; });
        values.push({ v: 'other', label: chipLabel(areaId, 'other') });
        d = choiceAnswer(e.key, 'Main problem in ' + areaName(areaId), 'the main problem picked in ' + areaName(areaId), values, 'Main problems');
        break;
      }
      case 'support_block': {
        if (e.part === 0) return null;
        var items = n.rows && typeof n.rows === 'object' ? S.flow.lib.flow.items(info.graph, info.survey, n.rows['in']) : [];
        if (e.part <= items.length) {
          var code = str(items[e.part - 1] && items[e.part - 1].id);
          var naSupport = n.allow_not_applicable === true ? (en('support.not_applicable') || 'Doesn’t apply') : null;
          d = numberAnswer(e.key, 'Support: ' + supportLabel(code), 'the support rating ' + quote(supportLabel(code)), 1, 5, { faces: true, na: naSupport, group: 'Support' });
        } else {
          d = textAnswer(e.key, 'Support comment (typed or recorded)', 'the support comment', 'Support');
        }
        break;
      }
      default:
        d = kindAnswer(info, e, q + (forArea ? ' –' + forArea : ''), 'the answer to ' + quote(q) + forArea);
        if (!d) return null;
    }
    d.owner = e.owner;
    return d;
  }

  /* Any other kind (one added in web/js/types/): described from what the
     form's checker says its answer is (routeAnswers' kinds: a number from
     min to max, a choice of codes, or typed or recorded text), or null. */
  function kindAnswer(info, e, label, subject) {
    var k = info.avail && info.avail.kinds ? info.avail.kinds['#' + e.key] : null;
    if (!k || typeof k !== 'object') return null;
    if (k.kind === 'number') {
      var min = Number(k.min), max = Number(k.max);
      if (!isFinite(min) || !isFinite(max) || Math.floor(min) !== min || Math.floor(max) !== max || max < min || max - min > 100) return null;
      return numberAnswer(e.key, label, subject, min, max, { na: k.na === true ? (en('rating.na') || 'I don’t handle this') : null, group: 'Questions' });
    }
    if (k.kind === 'choice' || k.kind === 'choices') {
      var texts = k.value_texts && typeof k.value_texts === 'object' ? k.value_texts : {};
      var made = choiceAnswer(e.key, label, subject, arr(k.values).map(function (v) {
        var key = Object.prototype.hasOwnProperty.call(texts, v) ? texts[v] : '';
        return { v: v, label: (key && en(key)) || String(v) };
      }), 'Questions');
      return k.kind === 'choices' ? multiAnswer(made) : made;
    }
    if (k.kind === 'text') return textAnswer(e.key, label + ' (typed or recorded)', 'the question ' + quote(label), 'Questions');
    return null;
  }

  /* The answers rules can test, described for the drop-downs, in the
     route's order. keep(entry) picks some (null = all). null without the
     route code. */
  function catalogAnswers(keep) {
    var info = flowInfo();
    if (!info || !info.ok) return null;
    var out = [];
    info.catalog.forEach(function (e) {
      if (keep && !keep(e)) return;
      var d = describeEntry(info, e);
      if (d) out.push(d);
    });
    return out;
  }

  /* The answers (and facts: the language, the round) the "show only if"
     rule of row idx may test: the answers that can exist before the screen.
     A hidden row gets what exists after the nearest shown question above it
     (that question's "jump" list: its own answers too). Without the route
     code: the older list of earlier rows. Used by ruleProblems (the badge
     "the rule tests a later or hidden answer"). */
  function ruleAnswers(s, idx) {
    var info = flowInfo();
    var facts = SHOW_IF_FACTS ? factAnswers() : [];
    if (!info || !info.ok || !info.avail.ok) return availableAnswers(idx).concat(facts);
    var nodeId = info.nodeOfRow[idx];
    var keepOwn = false;
    if (!nodeId) {
      for (var j = idx - 1; j >= 0 && !nodeId; j--) if (info.nodeOfRow[j]) nodeId = info.nodeOfRow[j];
      if (!nodeId) return facts;
      keepOwn = true;
    }
    var at = info.avail.at['#' + nodeId] || {};
    var avail = (keepOwn ? at.jump : at.show_if) || {};
    var list = catalogAnswers(function (e) { return avail['#' + e.key] === true; }) || [];
    return list.concat(facts);
  }

  /* JSON with sorted keys: two rules that mean the same give the same text. */
  function canonJson(v) {
    if (Array.isArray(v)) return '[' + v.map(canonJson).join(',') + ']';
    if (v && typeof v === 'object') {
      return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + canonJson(v[k]); }).join(',') + '}';
    }
    return JSON.stringify(v === undefined ? null : v);
  }

  /* What flow-panel.js says while it makes the route that stops Publish
     (Model.gs PP_MDL_FLOW_ERRORS_: an arrow to nowhere or back, settings it
     had to leave out), and any note it marks level "error" (G5, since 27 Oct
     2026: a route below the thank-you screen that runs on into another
     route); its other notes, and any it marks level "warning", are
     warnings. Only the colour of a badge depends on it here. */
  var FLOW_NOTE_ERRORS = { G2: true, G3: true, F1: true };

  /* What is wrong with a row's arrows, from the form's own code:
       row      what flow-panel.js said about this row (an arrow it left out,
                a target that is hidden, a repeat it can't use, ...)
       rowError true when one of those stops Publish (FLOW_NOTE_ERRORS)
       jumps    { jump index: [the checker's messages about that jump's rule] }
       dropped  { jump index: true } for jumps that are not in the route at all
       unreached  the checker's message when no arrow leads to this screen */
  function routeProblems(s, idx) {
    var out = { row: [], rowError: false, jumps: {}, dropped: {}, unreached: '', any: false };
    var info = flowInfo();
    if (!info || !info.ok) return out;
    info.notes.forEach(function (n) {
      if (!n || n.row !== idx) return;
      out.row.push(str(n.message));
      if (n.level === 'error' || (n.level !== 'warning' && FLOW_NOTE_ERRORS[n.code])) out.rowError = true;
    });
    var nodeId = info.nodeOfRow[idx];
    if (!nodeId) { out.any = out.row.length > 0; return out; }
    var node = info.graph.byId ? info.graph.byId[nodeId] : null;
    var compiled = [];   // the node's jumps: { at: its place in the node's "next", jump }
    if (node && Array.isArray(node.next)) {
      node.next.forEach(function (x, at) { if (x && typeof x === 'object' && Object.prototype.hasOwnProperty.call(x, 'goto')) compiled.push({ at: at, jump: x }); });
    }
    var used = {};
    jumpsOf(s).forEach(function (j, k) {
      if (!j || typeof j !== 'object' || !j.when) { out.dropped[k] = true; return; }
      var c = canonJson(j.when), hit = null;
      for (var m = 0; m < compiled.length; m++) if (!used[m] && canonJson(compiled[m].jump.when) === c) { hit = compiled[m]; used[m] = true; break; }
      if (!hit) { out.dropped[k] = true; return; }
      var target = str(hit.jump['goto']);
      info.findings.forEach(function (f) {
        if (f.level !== 'error' || f.node !== nodeId || ['R1', 'R2', 'R3'].indexOf(f.code) === -1) return;
        if (f.site !== undefined) {
          // the checker says which rule it is about: this jump (its place in "next")
          if (f.site !== 'jump' || f.index !== hit.at) return;
        } else if (str(f.message).indexOf('jump to "' + target + '"') === -1) {
          return;   // an older route code (before 26 Oct 2026) says it only in words: its message names the jump's target
        }
        (out.jumps[k] = out.jumps[k] || []).push(str(f.message));
      });
    });
    info.findings.forEach(function (f) {
      if (f.level === 'error' && f.code === 'G1' && f.node === nodeId && !out.unreached) out.unreached = str(f.message);
    });
    out.any = out.row.length > 0 || Object.keys(out.jumps).length > 0 || Object.keys(out.dropped).length > 0 || !!out.unreached;
    return out;
  }

  /* A short note in Questions while the route tools are missing in this
     window, with Try again. It says whether pasting a route still works
     through the server (S.flow.server: panelRouteTable) or is off too; the
     Map, Try a path and the route badges always need this window's code.
     data-server (for the bench) = the server's state. */
  function routeNote() {
    if (S.flow.lib) {
      var info = flowInfo();
      if (info && !info.ok) {
        return h('div', { class: 'callout is-warn small', style: 'margin-bottom:14px', test: 'flow-error-note' },
          h('p', { text: 'The route could not be worked out from these rows (' + info.error + '). Check for problems in Publish.' }));
      }
      return null;
    }
    if (S.flow.loading || (!S.flow.error && !S.flow.lib)) {
      return h('div', { class: 'callout small', style: 'margin-bottom:14px', test: 'flow-loading-note' }, h('p', null, h('span', { class: 'spinner is-small' }), ' Loading the route tools (pasting a route, the map, Try a path)…'));
    }
    var sv = S.flow.server;
    var what;
    if (sv.state === 'ready') {
      what = h('p', { text: 'Pasting a route still works: Check, Use this route and the table buttons ask Google instead, so they take a few seconds longer. ' +
        'The Map, Try a path and the route badges need the route tools in this window, so they are switched off for now. Everything else works. ' +
        'Press Try again. If this keeps happening, tell whoever set up the Sheet (apps-script/README.md).' });
    } else if (sv.state === 'checking' || !sv.state) {
      what = h('p', null, h('span', { class: 'spinner is-small' }), ' Checking whether pasting a route can work through Google instead… The Map and Try a path are switched off for now.');
    } else {
      what = h('p', { text: 'Pasting a route, the Map and Try a path need them, so they are switched off for now. Everything else works. ' +
        'Press Try again. If this keeps happening, ask whoever set up the Sheet to paste the latest Flow.gs into the Apps Script project (apps-script/README.md).' +
        (sv.state === 'failed' && sv.error && sv.error !== S.flow.error ? ' (Google could not check a pasted table either: ' + sv.error + ')' : '') });
    }
    return h('div', { class: 'callout is-warn small', style: 'margin-bottom:14px', test: 'flow-unavailable-note', 'data-server': sv.state || 'none' },
      h('p', { text: 'The route tools could not start: ' + S.flow.error }),
      what,
      h('p', null, btn('Try again', 'flow-retry', retryFlowCode, { small: true })));
  }

  /* Asks the server for the route code once more (after it failed). */
  function retryFlowCode() {
    S.flow.error = '';
    S.flow.lib = null;
    S.flow.server = { state: '', error: '' };
    loadFlowCode();
    renderMain(true);
  }

  /* A target code in words: 'question 9 (“…”)', 'question 4 (Area ratings)' or 'the ending “…”'. */
  function targetName(id) {
    var i = screenPos(id);
    if (i === -1) return quote(id) + ' (no question has this code)';
    var s = M().screens[i];
    var t = typeInfo(s.type);
    if (s.type === 'thank_you') return (i === mainEndIndex() ? 'the thank-you screen' : 'the ending ' + quote(shorten(screenEnglish(s), 40))) + ' (question ' + (i + 1) + ')';
    return 'question ' + (i + 1) + ' (' + (t.builtin ? t.label : quote(shorten(screenEnglish(s) || t.label, 40))) + ')';
  }
  function targetShort(id) {
    var i = screenPos(id);
    if (i === -1) return quote(id);
    return M().screens[i].type === 'thank_you' ? (i === mainEndIndex() ? 'the thank-you screen' : 'the ending ' + quote(shorten(screenEnglish(M().screens[i]), 28))) : 'question ' + (i + 1);
  }

  /* A rule in a few words, for badges: '“How likely…” ≥ 9 and the round = 2026-R1'. */
  function shortRule(rule) {
    var p = parseRule(rule);
    if (p.mode !== 'rules') return ruleSentence(rule) || '(no condition)';
    return joinWith(p.conds.map(function (c) {
      var ans = describeAnswer(c.answer);
      var who = ans ? (ans.fact ? ans.subject : quote(shorten(ans.label, 26))) : quote(c.answer);
      var v = function (x) { return valueLabel(ans, x); };
      switch (c.test) {
        case 'equals': return who + ' = ' + v(c.value);
        case 'not_equals': return who + ' ≠ ' + v(c.value);
        case 'at_most': return who + ' ≤ ' + v(c.value);
        case 'at_least': return who + ' ≥ ' + v(c.value);
        case 'in': return who + ' is ' + joinWith(arr(c.value).map(v), 'or');
        case 'answered': return who + ' answered';
        case 'not_answered': return who + ' not answered';
      }
      return who;
    }), p.combine === 'any' ? 'or' : 'and');
  }

  /* The route as a numbered list (the Map's fallback), from the graph: each
     screen, when it is shown, and where it goes. The rules are written by
     the checker's own words: PP.flowCheck.sentenceFor(survey) knows each
     answer's kind, so a pick-several rule reads "areas includes load", as on
     the Map (30 Oct 2026); an older Flow.gs without it keeps "==". */
  function routeOutline(survey, strings) {
    var lib = S.flow.lib, F = lib.flow, C = lib.flowCheck;
    var g = F.load(survey);
    var say = typeof C.sentenceFor === 'function' ? C.sentenceFor(survey) : function (rule) { return C.sentence(rule); };
    var DEFAULT_TEXT = { language_picker: 'lang.title', whats_changed: 'wc.title', function_rating: 'q.fn_rating', function_deep_dive: 'q.deep_dive', thank_you: 'thanks.title' };
    var KIND = { function_rating: 'function_ratings', function_deep_dive: 'function_deep_dives' };
    function english(key) {
      var v = strings && typeof strings === 'object' ? strings[key] : null;
      return v && typeof v === 'object' && v.en ? String(v.en) : '';
    }
    function title(n) {
      if (n.type === 'group') return 'For each area' + (n.repeat_for && n.repeat_for.where ? ' where ' + say(n.repeat_for.where) : '') + ':';
      var kind = n.type === 'thank_you' ? 'Ending' : typeInfo(KIND[n.type] || n.type).label;
      var key = typeof n.text === 'string' ? n.text : DEFAULT_TEXT[n.type];
      var words = key && key.indexOf('{') === -1 ? english(key) : '';
      return kind + (words ? ': ' + quote(shorten(words, 80)) : '') + ' (code ' + (n.store_as || n.id) + ')';
    }
    function name(id, list) {
      if (id === '@next_item') return 'the next area';
      var n = list && list.byId && list.byId[id] ? list.byId[id] : (g.byId ? g.byId[id] : null);
      if (!n) return quote(id) + ' (missing)';
      var at = arr(g.nodes).indexOf(n);
      return (n.type === 'thank_you' ? 'the ending "' + id + '"' : '"' + id + '"') + (at === -1 ? '' : ' (number ' + (at + 1) + ' here)');
    }
    function lines(n, list) {
      var out = [];
      if (n.show_if !== undefined) out.push('Only if ' + say(n.show_if) + '.');
      if (n.repeat_for && n.type !== 'group') out.push('Asked for each ' + n.repeat_for.each + (n.repeat_for.where ? ' where ' + say(n.repeat_for.where) : '') + '.');
      if (n.type === 'thank_you' && n.show_if === undefined) out.push('Ends the survey: the answers are sent.');
      else if (typeof n.next === 'string') out.push('Then: ' + name(n.next, list) + '.');
      else if (Array.isArray(n.next)) {
        n.next.forEach(function (x) {
          if (!x || typeof x !== 'object') return;
          if (Object.prototype.hasOwnProperty.call(x, 'default')) out.push('Otherwise: ' + name(x['default'], list) + '.');
          else out.push('If ' + say(x.when) + ': ' + name(x['goto'], list) + '.');
        });
      }
      return out;
    }
    function item(n, list) {
      var kids = [h('strong', { text: title(n) })];
      lines(n, list).forEach(function (t) { kids.push(h('span', { class: 'why', text: t })); });
      if (n.type === 'group' && n.body) kids.push(h('ol', null, arr(n.body.nodes).map(function (b) { return item(b, n.body); })));
      return h('li', null, kids);
    }
    return h('ol', { class: 'outline', test: 'map-outline' }, arr(g.nodes).map(function (n) { return item(n, g); }));
  }

  /* The Map's frame: a whole little page, given to a sandboxed iframe as its
     "srcdoc". Its only script loads the pinned Mermaid (with Subresource
     Integrity), draws the code and tells this page "drawn" or "failed"
     through postMessage, carrying a random token. */
  function scriptString(text) {
    return JSON.stringify(String(text)).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  }
  function mapDocument(code, token) {
    var js = '(function () {' +
      'var code = ' + scriptString(code) + ', token = ' + scriptString(token) + ';' +
      'var box = document.getElementById("m");' +
      'function tell(kind, why) { parent.postMessage({ pp: "map", kind: kind, token: token, why: why || "", height: box.getBoundingClientRect().height }, "*"); }' +
      'var s = document.createElement("script");' +
      's.src = ' + scriptString(MERMAID_URL) + '; s.integrity = ' + scriptString(MERMAID_SRI) + '; s.crossOrigin = "anonymous";' +
      's.onerror = function () { tell("failed", "the drawing library could not be loaded"); };' +
      's.onload = function () {' +
      '  try {' +
      '    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "default" });' +
      '    window.mermaid.render("ppmap", code).then(function (r) { box.innerHTML = r.svg; tell("drawn"); },' +
      '      function (e) { tell("failed", String((e && e.message) || e)); });' +
      '  } catch (e) { tell("failed", String((e && e.message) || e)); }' +
      '};' +
      'document.head.appendChild(s);' +
      '})();';
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Map</title>' +
      '<style>html,body{margin:0;background:#fff;font:13px system-ui,sans-serif}#m{padding:8px}#m svg{max-width:100%;height:auto}</style></head>' +
      '<body><div id="m"></div><script>' + js + '<\/script></body></html>';
  }

  /* The same code opened on mermaid.live (its "#base64:" address keeps the
     whole diagram in the link; only the questionnaire's wording and codes). */
  function mermaidLiveUrl(code) {
    var state = JSON.stringify({ code: code, mermaid: JSON.stringify({ theme: 'default' }), autoSync: true, updateDiagram: true });
    var bytes = new TextEncoder().encode(state), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return 'https://mermaid.live/edit#base64:' + btoa(bin);
  }

  var mapFrame = { el: null, token: '', timer: null, slowTimer: null, onMessage: null };
  function stopMapFrame() {
    clearTimeout(mapFrame.timer);
    clearTimeout(mapFrame.slowTimer);
    mapFrame = { el: null, token: '', timer: null, slowTimer: null, onMessage: null };
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!mapFrame.el || !d || typeof d !== 'object' || d.pp !== 'map' || d.token !== mapFrame.token) return;
    if (e.source !== mapFrame.el.contentWindow || !mapFrame.onMessage) return;
    mapFrame.onMessage(d);
  });

  /* Meesho-only mode (21 Oct 2026): the web app is open only to people signed

  function meeshoOnlyNote(test) {

  function saveWebAppUrl(value, prefix) {

  /* ---- Round numbers (loaded only when needed, they can take a few seconds) -- */

  function countsView(id) {

  }

  function fillCounts(box, id) {
    var c = S.ui.counts[id];
    box.textContent = '';
    if (!S.savedRoundIds[id]) {   // the server doesn't know this round until it is saved
      appendKids(box, [h('span', { class: 'small muted', text: 'Save first to see numbers.' })]);

    }

    if (c.loading) { appendKids(box, [h('span', { class: 'spinner is-small' }), h('span', { class: 'muted', text: 'Counting…' })]); return; }
    if (c.error) {
      appendKids(box, [h('span', { class: 'field-error', text: c.error }), btn('Try again', 'counts-load-' + id, function () { loadCounts(id); }, { small: true, kind: 'ghost' })]);

    var d = obj(c.data);

    var parts = [

    var langs = Object.keys(obj(d.by_lang)).filter(function (k) { return d.by_lang[k]; });
    var extra = [];
    if (langs.length) extra.push(langs.map(function (k) { return englishName(k) + ' ' + fmtNum(d.by_lang[k]); }).join(', '));

  /* ==========================================================================
     PART 8. QUESTIONS: "Paste a route", the route as a read-only list, the
     Map and Try a path
     --------------------------------------------------------------------------
     Since 27 Oct 2026 (Pranav's decision, docs/spec.md section 4) questions
     and their route are no longer made one by one in this window. The whole
     route is ONE TABLE, one row per screen (format pp-route-table/1; the
     form's own route code makes and reads it: PP.flowPanel.toTable and
     fromTable in web/js/flow-panel.js, docs/flow-engine.md section 9):
       1. "Copy the current route" puts today's route on the clipboard as that
          table. "Download the Excel template" gives the same table as a CSV
          file. "Copy the instruction for Claude/ChatGPT" gives the text to
          paste into an AI before notes, an Excel sheet or a flowchart picture.
       2. The owner changes the table in Excel or Google Sheets (or lets the
          AI write it) and pastes it into "Paste a route".
       3. Check reads the table and checks it with the same checker Publish
          uses. Problems name the table's row (the header row is row 1, as
          Excel shows it) and column. Nothing changes yet: a clean table can
          first be looked at on the Map and in Try a path, and "Compared
          with your draft" lists every text that would change (old → new;
          it opens by itself when a translation would change, because only
          a person may write those).
       4. "Use this route" replaces the draft's questions (the Screens rows)
          and their texts. Everything else stays as it is: areas, problems,
          support questions, other texts, settings, rounds. Undo puts the
          draft back. Then Save, Preview and Publish work as before.
     Check gives the table's checker what partners already answered (the
     live codes and, since 27 Oct 2026, their kinds: a question partners
     answered keeps its kind) and the draft's rounds (a rule on a round
     that does not exist is a warning).
     When this window can't run the route code, the table's tools run on the
     server instead (runTableTool -> PanelServer.gs panelRouteTable, the same
     code from Flow.gs, with the same request: tableRequest), with a busy
     box; only the Map and Try a path are then off.
     The list under the paste box is read only: every screen in order, with
     its badges (rules, jumps, repeats, endings, hidden, and what the
     checker found wrong). Codes partners already answered can't leave the
     table: the check says so (write "no" in its "show" column to hide it).
     ========================================================================== */

  var QUESTIONS_HELP = 'To change the questions: Copy the current route, edit it in Excel (or ask Claude/ChatGPT with the instruction), paste it back here, Check, Use this route, then Save, Preview and Publish.';
  /* The name of the downloaded template (the table as a CSV file). */
  var ROUTE_TEMPLATE_FILE = 'partner-pulse-route.csv';
  /* The Screens fields a row of the table sets (Model.gs PP_mdlNormalizeScreen_),
     to tell what "Use this route" would change. */
  var SCREEN_FIELDS = ['id', 'type', 'text', 'required', 'show_if', 'skip_if', 'options', 'low_label', 'high_label', 'scale_hint', 'body', 'active', 'next', 'jumps', 'repeat'];

  VIEWS.questions = function () {
    if (S.ui.qview === 'map' && S.flow.lib) return mapView();
    if (S.ui.qview === 'try' && S.flow.lib) return tryView();
    S.ui.qview = 'list';
    var screens = M().screens;
    var end = mainEndIndex();
    var mainRows = end === -1 ? screens : screens.slice(0, end + 1);
    var noTools = S.flow.loading || (!S.flow.error && !S.flow.lib) ? 'The route tools are still loading. Try again in a moment.'
      : 'The route tools could not start: see the note below the title.';
    return [
      sectionHead('Questions', 'Every screen partners go through, in order. Changes reach partners after you save and publish.', [
        S.flow.lib ? btn('Map', 'open-map', function () { openRouteView('map', null); }, { small: true, title: 'See the whole route as a diagram' })
          : lockedBtn('Map', 'open-map', noTools),
        S.flow.lib ? btn('Try a path', 'open-try', function () { openRouteView('try', null); }, { small: true, title: 'Pick answers and see the screens a partner gets' })
          : lockedBtn('Try a path', 'open-try', noTools)]),
      h('div', { class: 'callout is-info small', style: 'margin-bottom:14px', test: 'questions-help' }, h('p', { text: QUESTIONS_HELP })),
      codesNote(),
      routeNote(),
      tableToolsCard(),
      pasteCard(),
      h('section', { test: 'route-now' },
        h('div', { class: 'qsection-head' }, h('h2', { text: 'The route now' }), badge('Read only', null, 'route-read-only')),
        h('p', { class: 'qsection-help', text: 'Your draft, screen by screen (unsaved changes included). To change it, use the table above. The row number in the table is shown on each card.' }),
        screens.length
          ? h('div', { class: 'qlist', test: 'main-route' }, mainRows.map(function (s2, i) { return screenCard(s2, i); }))
          : emptyState('No questions yet', 'First copy the questionnaire stored in GitHub (Settings > Import from GitHub): it also brings the languages, areas, support questions and texts. Then change the route here with the table.',
            btn('Go to Settings', 'questions-empty-import', function () { go('settings', { test: 'import-go' }); }, { kind: 'primary' }))),

  /* Opens the Map or Try a path. which = 'draft', 'pasted' (the route of the

  function openRouteView(view, which) {

  /* Rows after the main thank-you screen: other routes and endings, which
     partners reach only through a jump (docs/flow-engine.md 9.1). */
  function otherRoutes(screens, end) {
    var rows = screens.slice(end + 1);
    if (!rows.length) return null;
    return h('section', { test: 'other-routes' },
      h('div', { class: 'qsection-head' }, h('h2', { text: 'Other routes and endings' })),
      h('p', { class: 'qsection-help', text: 'These screens come after the main thank-you screen, so partners reach them only through a jump (the table’s “jumps” or “then go to” column of an earlier row). Every ending sends the answers.' }),
      h('div', { class: 'qlist' }, rows.map(function (s, k) { return screenCard(s, end + 1 + k); })));

  /* The route badges of a card: where the screen goes, repeats, endings,
     and what the form's own checker found wrong with its arrows. The
     checker's words go into notes too (shown under the badges). */
  function routeBadges(s, i, notes) {
    var out = [];
    if (!S.flow.lib) return out;
    if (s.type === 'thank_you') {
      out.push(badge('Ends the survey', 'end', 'screen-end-' + s.id, 'Partners stop here and their answers are sent.'));
    } else {
      jumpsOf(s).forEach(function (j, k) {
        if (!j || typeof j !== 'object' || !j['goto']) return;
        out.push(badge('↪ goes to ' + targetShort(j['goto']) + ' when ' + shortRule(j.when), 'route', 'screen-jump-' + s.id + '-' + k,
          'If ' + ruleSentence(j.when) + ', partners go to ' + targetName(j['goto']) + '.'));
      });
      if (s.next) out.push(badge('↪ then goes to ' + targetShort(s.next), 'route', 'screen-next-' + s.id, 'Partners who answer it then go to ' + targetName(s.next) + ' (its “then go to” in the route table).'));
      if (s.repeat && REPEAT_LABELS[s.repeat] && canRepeat(s.type)) {
        out.push(badge(s.repeat === 'each_low_area' ? 'Repeats for each area rated low' : 'Repeats for each area', 'req', 'screen-repeat-' + s.id,
          'Asked once for each area' + (s.repeat === 'each_low_area' ? ' rated at or below its limit' : '') + ', with the area’s name above it.'));
      }
    }
    var rp = routeProblems(s, i);
    var jumpMsgs = [];
    Object.keys(rp.jumps).forEach(function (k) { jumpMsgs = jumpMsgs.concat(rp.jumps[k]); });
    if (Object.keys(rp.dropped).length) jumpMsgs.unshift('A jump of this question is not used by the form: its target is missing, above it or hidden, or its condition is incomplete.');
    if (Object.keys(rp.dropped).length || jumpMsgs.length) {
      out.push(badge('⚠ this jump can never happen', 'error', 'screen-jump-problem-' + s.id, jumpMsgs.concat(rp.row).join(' ')));
    } else if (rp.row.length) {
      out.push(badge('⚠ ' + (jumpsUnreadable(s) ? 'the jumps can’t be read' : rp.rowError ? 'route problem: see below' : 'route note: see below'),
        rp.rowError ? 'error' : 'warn', 'screen-route-problem-' + s.id, rp.row.join(' ')));
    }
    if (rp.unreached) out.push(badge('⚠ nothing leads here', 'error', 'screen-unreached-' + s.id, rp.unreached));
    if (notes) {
      jumpMsgs.concat(rp.row).forEach(function (m) { if (m && notes.indexOf(m) === -1) notes.push(m); });
      if (rp.unreached && notes.indexOf(rp.unreached) === -1) notes.push(rp.unreached);
    }
    return out;
  }

  /* One screen of the read-only list. */
  function screenCard(s, i) {
    var t = typeInfo(s.type);
    var end = mainEndIndex();
    var extraEnd = s.type === 'thank_you' && i !== end;
    var second = secondLang();
    var english = cardEnglish(s, t);
    var secondText = s.text && second && !isTodo(textValue(s.text, second.code)) ? textValue(s.text, second.code) : '';
    var problems = s.type === 'thank_you' ? [] : ruleProblems(s, i);
    var notes = [];

    var badges = [];
    if (t.builtin && !extraEnd) badges.push(badge('Built-in', null, null, 'Part of every questionnaire: it can be hidden (no in the table’s “show” column) but not removed.'));
    if (hasRequired(s)) badges.push(effectiveRequired(s) ? badge('Required', 'req') : badge('Optional (Skip button)', null));
    if (s.show_if) badges.push(badge('Only if ' + ruleSentence(s.show_if), 'rule', 'screen-rule-' + s.id));
    if (problems.length) {
      badges.push(badge('⚠ The rule tests a later or hidden answer', 'error', 'screen-rule-problem-' + s.id, problemText(problems[0])));
      notes.push(problemText(problems[0]));
    }
    if (s.skip_if === 'lang_in_url') badges.push(badge('Skipped when the link already says the language', null));
    if (s.skip_if === 'empty') badges.push(badge('Skipped when there is nothing to show', null));
    badges = badges.concat(routeBadges(s, i, notes));
    if (!s.active) badges.push(badge('Hidden: partners don’t see it', 'hidden', 'screen-hidden-' + s.id));

    return h('article', { class: 'qcard is-readonly' + (s.active ? '' : ' is-hidden'), test: 'screen-card-' + s.id },
      h('div', { class: 'qnum', text: String(i + 1) }),
      h('div', { class: 'qicon', 'aria-hidden': 'true', text: t.icon }),
      h('div', { class: 'qbody' },
        h('div', { class: 'qtitle-row' }, h('span', { class: 'qtype', text: extraEnd ? 'Another ending' : t.label }), codeChip(s.id, isLive.screen(s.id), 'this screen'),
          h('span', { class: 'qrow', test: 'screen-row-' + s.id, title: 'Its row in the route table (the header is row 1)', text: 'row ' + (i + 2) + ' in the table' })),
        english ? h('div', { class: 'qtext', text: english }) : null,
        secondText ? h('div', { class: 'qtext-2', lang: second.code, text: secondText }) : null,
        h('div', { class: 'badges' }, badges),
        notes.length ? h('ul', { class: 'route-list qnotes', test: 'screen-notes-' + s.id }, notes.map(function (n) { return h('li', { text: n }); })) : null,
        fixNoteFor(s)));
  }

  /* After Publish's "Go there": a note in the question's card naming the row
     and column of the route table to change, with Close. */
  function fixNoteFor(s) {
    var f = S.ui.fixNote;
    if (!f || f.id !== s.id) return null;
    return h('div', { class: 'callout is-warn small', style: 'margin-top:10px', test: 'screen-fix-note-' + s.id },
      h('p', { text: f.text }),
      h('p', null, btn('Close', 'screen-fix-note-close-' + s.id, function () { S.ui.fixNote = null; renderMain(true); }, { small: true })));
  }

  function cardEnglish(s, t) {
    if (s.type === 'function_ratings') {
      var names = M().areas.filter(function (a) { return a.active; }).map(function (a) { return areaName(a.id); });
      return 'One rating screen per area: ' + (names.length ? names.join(', ') : 'no areas shown yet') + '.';
    }
    if (s.type === 'function_deep_dives') return '“' + (en('q.deep_dive') || 'What is the main problem?') + '” for each area rated ' + standardThreshold() + ' or lower.';
    if (s.type === 'language_picker') return en('lang.title') || t.description;
    if (s.type === 'whats_changed') return (en('wc.title') || 'What changed') + ' (bullets per round are in Rounds)';
    if (s.type === 'thank_you') return (s.text && en(s.text)) || en('thanks.title') || 'Thank you!';
    if (s.text && en(s.text)) return en(s.text);
    if (t.needs_text) return '(no English text yet)';
    return t.description;
  }

  /* ---- The table tools: copy the route, the template, the AI instruction --- */

  /* The longest pasted text Check sends to the server, in characters (about
     300 KB: PanelServer.gs PP_ROUTE_TABLE_MAX_CHARS_ is the same). */
  var ROUTE_TABLE_MAX_CHARS = 300000;
  var OLD_FLOW_TABLES = 'The route code in this Sheet (the Apps Script file Flow) is older than this control panel, so it can’t read or write a route table. ' +
    'Ask whoever set up the Sheet to paste the latest Flow.gs into the Apps Script project (apps-script/README.md), then open the panel again.';

  /* Does a copy of the route code have the four tools of the route table? */
  function hasTableTools(P) {
    return !!P && typeof P.fromTable === 'function' && typeof P.toTable === 'function' && typeof P.templateCsv === 'function' &&
      typeof P.aiInstruction === 'function';
  }

  /* Where the route table's tools run: 'window' (this window's route code),
     'server' (this window can't run the route code, but the server can:
     PanelServer.gs panelRouteTable, the same code from Flow.gs) or ''
     (neither, for now: tableToolsProblem says why). */
  function tableToolsWhere() {
    if (S.flow.lib) return hasTableTools(S.flow.lib.flowPanel) ? 'window' : '';
    return !S.flow.loading && S.flow.error && S.flow.server.state === 'ready' ? 'server' : '';
  }

  /* Can the route table be read and written? '' when it can (in this window
     or on the server), else why not, in plain words. A Flow.gs from before
     27 Oct 2026 has the route tools but not the table. */
  function tableToolsProblem() {
    if (tableToolsWhere()) return '';
    if (S.flow.lib) return OLD_FLOW_TABLES;
    if (S.flow.loading || !S.flow.error) return 'The route tools are still loading. Try again in a moment.';
    var sv = S.flow.server;
    if (sv.state === 'old') return OLD_FLOW_TABLES;
    if (sv.state === 'checking' || !sv.state) return 'Checking whether pasting a route can work through Google instead. Try again in a moment.';
    return 'Pasting a route needs the route tools, which could not start. Press Try again in the note at the top of Questions.';
  }

  /* The draft's round ids: the table's check warns about a rule on another
     round, and the AI instruction's example rule uses the first. */
  function roundIds() {
    return M().rounds.map(function (r) { return str(r.id).trim(); }).filter(Boolean);
  }

  /* What one tool of the route table gets: the draft as it is now (saved or
     not). The same request goes to the server when this window can't run
     the route code (PanelServer.gs panelRouteTable), so both give the same
     answer. tool: 'fromTable' (Check), 'toTable' (Copy the current route),
     'templateCsv' (the Excel template) or 'aiInstruction' (the instruction
     for Claude/ChatGPT). */
  function tableRequest(tool, text) {
    var req = { tool: tool, survey: draftSurvey(), strings: M().texts, rows: M().screens };
    if (tool === 'fromTable') {
      req.text = str(text);
      req.live_codes = liveCodeList();
      req.live_kinds = clone(S.liveIds.kinds);
    }
    if (tool === 'fromTable' || tool === 'aiInstruction') req.rounds = roundIds();
    return req;
  }

  /* The tool's arguments, from a request: exactly the lists PanelServer.gs
     (PP_routeTableArgs_) makes from it on the server. */
  function tableArgs(req) {
    if (req.tool === 'fromTable') return [req.text, req.survey, req.strings, { rows: req.rows, liveCodes: req.live_codes, liveKinds: req.live_kinds, rounds: req.rounds }];
    if (req.tool === 'toTable') return [req.rows, req.strings, req.survey];
    if (req.tool === 'templateCsv') return [req.survey, req.strings, { rows: req.rows }];
    return [req.survey, req.strings, { rows: req.rows, rounds: req.rounds }];
  }

  /* What the busy box says while the server works on the table. */
  var TABLE_BUSY = {
    fromTable: 'Google is checking the table…', toTable: 'Google is making the table…',
    templateCsv: 'Google is making the template…', aiInstruction: 'Google is making the instruction…'
  };

  /* The message for a pasted text longer than the server checks (PanelServer.gs PP_routeTableTooLong_ words it the same). */
  function tooLongText(length) {
    return 'The pasted text is too long to check: about ' + Math.ceil(length / 1000) + ' KB, and the control panel checks at most ' +
      (ROUTE_TABLE_MAX_CHARS / 1000) + ' KB. Paste only the route table, header row first (not a whole workbook or a long chat).';
  }

  /* Runs one tool of the route table, then done(its answer), or fail(error).
     In this window when its route code runs (at once); otherwise on the
     server (panelRouteTable: a few seconds, with the busy box). */
  function runTableTool(req, done, fail, busyText) {
    if (S.flow.lib) {
      var out;
      try {
        teachKinds(S.flow.lib);   // kinds added in web/js/types/ are kinds of the table too
        out = S.flow.lib.flowPanel[req.tool].apply(null, tableArgs(req));
      } catch (e) {
        fail(e);
        return;
      }
      done(out);
      return;
    }
    if (req.tool === 'fromTable' && str(req.text).length > ROUTE_TABLE_MAX_CHARS) {
      fail(new Error(tooLongText(str(req.text).length)));
      return;
    }
    withBusy(busyText || TABLE_BUSY[req.tool], function () { return call('panelRouteTable', req); }).then(function (res) {
      res = obj(res);
      if (res.ok !== true) throw new Error('Google sent back no answer this time. Please try again.');
      done(res.result);
    }).then(null, fail);
  }

  function tableToolsCard() {

    function tool(label, test, run, o) { return why ? lockedBtn(label, test, why, o) : btn(label, test, run, o); }
    return card({ title: '1. Get the route as a table', sub: 'One row per screen, in the order partners see them. Change it in Excel or Google Sheets, or let Claude or ChatGPT write it, then paste it into “Paste a route”.', test: 'route-table-card' },
      h('ul', { class: 'step-list tool-list' },

  /* ---- "Paste a route" ------------------------------------------------------- */

  /* The codes partners already answered under, as the table checker wants
     them: "nps", and "option:<question>/<answer>" for answers of pick-one

  function liveCodeList() {
    var out = S.liveIds.screens.slice();

      arr(S.liveIds.options[q]).forEach(function (o) { out.push('option:' + q + '/' + o); });

  /* Reads and checks the pasted table against the draft as it is now
     (fromTable, with the codes and kinds partners answered and the draft's
     rounds; in this window, or on the server when this window can't run the
     route code). Changes nothing in the draft. Then done(result): fromTable's
     result ({ ok, rows, texts, problems, warnings, survey }), also kept in
     S.ui.paste. In this window that happens at once. When the server could
     not answer, a message says so (with Try again) and done is not called. */
  function checkPastedTable(done, busyText) {
    var P = S.ui.paste;
    if (P.checking) return;   // the server is still checking (Ctrl+Enter again in the box): one check at a time
    var seq = S.changeSeq;
    var text = P.text;
    P.checking = !S.flow.lib;
    runTableTool(tableRequest('fromTable', text), function (raw) {
      P.checking = false;
      done(adoptPasteCheck(raw, seq, text));
    }, function (e) {
      P.checking = false;
      if (S.flow.lib) {   // this window's own code failed on the table: a problem of the table
        done(adoptPasteCheck({ ok: false, rows: [], texts: {}, warnings: [], survey: null,
          problems: [{ row: null, column: null, code: null, message: 'The table could not be read (' + ((e && e.message) || e) + '). Check that it is the whole table, header row first.' }] }, seq, text));
        return;
      }
      showError('The table could not be checked', e, function () { checkPastedTable(done, busyText); });
    }, busyText);
  }

  /* Keeps the answer of a check in S.ui.paste and returns it, tidied. seq and
     text: the draft's change number and the box's text it was checked with
     (while the server works they could change: the result is then stale). */
  function adoptPasteCheck(raw, seq, text) {
    var P = S.ui.paste;
    raw = obj(raw);
    var res = { ok: !!raw.ok, format: str(raw.format), rows: arr(raw.rows), texts: obj(raw.texts), problems: arr(raw.problems), warnings: arr(raw.warnings), survey: raw.survey || null };
    if (res.ok && !res.survey) {
      res.ok = false;
      res.problems = [{ row: null, column: null, code: null, message: 'The route could not be checked here, so it can’t be used yet. Close the panel, open it again and press Check once more.' }];
    }
    P.result = res;
    P.model = res.ok ? pastedModel(res) : null;
    P.seq = seq;
    P.stale = P.text !== text;
    P.used = '';
    P.usedWarnings = [];
    P.last = res.ok ? { survey: res.survey } : P.last;
    return res;
  }

  /* The draft as it would be with the pasted route: the same questionnaire,
     with the table's rows and its texts. */
  function pastedModel(res) {
    var m = clone(M());
    m.screens = res.rows.map(normaliseScreen);
    Object.keys(res.texts).forEach(function (k) { m.texts[k] = Object.assign({}, obj(m.texts[k]), obj(res.texts[k])); });
    return m;
  }

  /* The pasted route for the Map and Try a path: { survey, model } after a
     clean Check of the table as it is now, else null. */
  function pastedPreview() {
    var P = S.ui.paste;
    if (!P.result || !P.result.ok || !P.model || P.stale || P.seq !== S.changeSeq) return null;
    return { survey: P.result.survey, model: P.model };
  }

  function pasteCard() {
    var P = S.ui.paste;
    var why = tableToolsProblem();
    var box = h('textarea', { rows: 9, class: 'paste-box', test: 'paste-box', spellcheck: 'false', value: P.text,
      placeholder: 'Paste the whole table here, header row first: rows copied from Excel or Google Sheets, the text of a CSV file, or the table Claude or ChatGPT wrote.',
      'aria-label': 'The route table to check' });
    var result = h('div', { test: 'paste-result', 'aria-live': 'polite' });
    box.addEventListener('input', function () {
      P.text = box.value;
      if (P.result && !P.stale) { P.stale = true; redraw(result, pasteResult); }
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !why) { e.preventDefault(); runPasteCheck(); }
    });
    appendKids(result, [pasteResult()]);
    return card({ title: '2. Paste a route', sub: 'Check shows any problems, with their row and column, and lets you see the pasted route on the Map and in Try a path. Nothing changes until you press Use this route.', test: 'paste-card' },
      why === OLD_FLOW_TABLES ? h('div', { class: 'callout is-warn small', style: 'margin-bottom:10px', test: 'paste-old-tools' }, h('p', { text: why })) : null,
      box,
      h('div', { class: 'row', style: 'margin-top:10px' },
        why ? lockedBtn('Check', 'paste-check', why, { kind: 'primary' }) : btn('Check', 'paste-check', runPasteCheck, { kind: 'primary', title: 'Ctrl+Enter in the box does the same' }),
        P.text || P.result || P.used ? btn('Clear', 'paste-clear', function () {
          P.text = ''; P.result = null; P.model = null; P.stale = false; P.used = ''; P.usedWarnings = [];
          renderMain(true);
        }, { small: true, kind: 'ghost' }) : null,
        h('span', { class: 'help', text: 'Tab-separated rows from Excel or Google Sheets, a CSV file, or a Markdown table from an AI: all work.' })),

  }

  function runPasteCheck() {
    var P = S.ui.paste;
    if (!P.text.trim()) {
      toast('Paste the table into the box first (with its header row), then press Check.', { kind: 'info' });
      var b = byTest('paste-box');
      if (b) b.focus();
      return;
    }
    checkPastedTable(function () {
      S.ui.pendingFocus = { test: 'paste-result', flash: false };
      renderMain(true);
    });
  }

  /* What the last Check found, or what "Use this route" did. */
  function pasteResult() {
    var P = S.ui.paste;
    var res = P.result;
    if (!res) {
      if (!P.used) return null;
      return [h('div', { class: 'callout is-ok small', style: 'margin-top:12px', test: 'paste-used' }, h('p', { text: P.used })),
        P.usedWarnings.length ? pasteWarnings(P.usedWarnings) : null];
    }
    var out = [];
    var stale = P.stale || P.seq !== S.changeSeq;
    if (stale) {
      out.push(h('div', { class: 'callout is-warn small', style: 'margin-top:12px', test: 'paste-stale' },
        h('p', { text: P.stale ? 'The table in the box changed since this check: press Check again.' : 'Your draft changed since this check: press Check again.' })));
    }
    if (res.problems.length) {
      out.push(h('div', { class: 'callout is-error', style: 'margin-top:12px', test: 'paste-problems-head' },
        h('p', null, h('strong', { text: plural(res.problems.length, 'problem') + ' to fix' }), ' before this route can be used. Nothing has changed in your draft. Fix them in your table (or ask the AI to), paste it again and press Check.')));
      out.push(h('div', { style: 'margin-top:8px', test: 'paste-problems' }, res.problems.map(function (p, i) { return tableIssue(p, 'error', i); })));
    } else {
      out.push(pasteOk(res, stale));
    }
    if (res.warnings.length) out.push(pasteWarnings(res.warnings));
    return out;
  }

  /* The warnings of a check (shown after "Use this route" too): worth
     reading, nothing blocks. */
  function pasteWarnings(list) {
    return h('details', { style: 'margin-top:10px', open: list.length <= 6 ? true : null, test: 'paste-warnings' },
      h('summary', { class: 'field-label', style: 'cursor:pointer', test: 'paste-warnings-toggle' }, plural(list.length, 'warning') + ': worth reading, they don’t stop you'),
      h('div', { style: 'margin-top:8px' }, list.map(function (w, i) { return tableIssue(w, 'warn', i); })));
  }

  /* One problem or warning of a pasted table: where (row and column; the
     header row is row 1) and the plain-English message. */
  function tableIssue(it, kind, i) {
    it = obj(it);
    var where = it.row ? 'Row ' + it.row + (it.column ? ' · ' + it.column : '') : (it.column ? 'Column “' + it.column + '”' : 'The whole table');
    return h('div', { class: 'issue is-' + kind, test: 'paste-' + (kind === 'error' ? 'problem' : 'warning') + '-' + i,
      'data-row': it.row ? String(it.row) : null, 'data-column': it.column ? String(it.column) : null },
      h('span', { class: 'where', test: 'paste-' + (kind === 'error' ? 'problem' : 'warning') + '-where-' + i, text: where }),
      h('span', { class: 'msg', text: str(it.message) }));
  }

  /* After a clean Check: what would change, the preview and "Use this route". */
  function pasteOk(res, stale) {
    var ch = routeChanges(res);
    var shown = res.rows.filter(function (r) { return r.active !== false; }).length;
    var lines = [];
    if (ch.same) lines.push('This is the same route as your draft: using it changes nothing.');
    else {
      var parts = [];
      if (ch.added.length) parts.push(plural(ch.added.length, 'screen') + ' added (' + ch.added.join(', ') + ')');
      if (ch.removed.length) parts.push(plural(ch.removed.length, 'screen') + ' removed (' + ch.removed.join(', ') + ')');
      if (ch.changed.length) parts.push(plural(ch.changed.length, 'screen') + ' changed (' + ch.changed.join(', ') + ')');
      if (ch.moved) parts.push('the order changed');
      if (ch.texts) parts.push(plural(ch.texts, 'text') + ' new or reworded');
      lines.push('Compared with your draft: ' + joinWith(parts, 'and') + '.');
    }
    var locked = stale ? 'Press Check again first: the table or your draft changed since this check.' : '';
    function act(label, test, run, o) { return locked ? lockedBtn(label, test, locked, o) : btn(label, test, run, o); }
    /* The Map and Try a path need the route code in this window (when the server checked the table, they can't show it). */
    var noPreview = S.flow.lib ? '' : 'The Map and Try a path need the route tools in this window, which could not start (see the note at the top of Questions). You can still use this route.';
    function preview(label, test, run) { return noPreview && !locked ? lockedBtn(label, test, noPreview, { small: true }) : act(label, test, run, { small: true }); }
    return h('div', { class: 'callout is-ok', style: 'margin-top:12px', test: 'paste-ok' },
      h('p', null, h('strong', { text: '✔ No problems.' }), ' The route has ' + plural(res.rows.length, 'screen') + (shown !== res.rows.length ? ' (' + shown + ' shown)' : '') + '. Nothing has changed in your draft yet.'),
      h('p', { test: 'paste-changes', text: lines.join(' ') }),
      textChangesBox(textChanges(res)),
      h('div', { class: 'row', style: 'margin-top:10px' },
        preview('Map of the pasted route', 'paste-preview-map', function () { openRouteView('map', 'pasted'); }),
        preview('Try a path on it', 'paste-preview-try', function () { openRouteView('try', 'pasted'); }),
        h('span', { class: 'spacer' }),
        act('Use this route', 'paste-use', usePastedRoute, { kind: 'primary' })));
  }

  /* The texts "Use this route" would add or change, one line per text and
     language, in the table's order: { key, lang, old, now, isNew, person }
     (old and now: '' for "still to translate"). A language that only gets
     the "[TRANSLATE]" mark, before and after, is left out: nobody wrote it.
     person: a translation would get new words or lose its words. Only a
     person may write those (never an AI: the project never machine-
     translates), so the list then opens by itself. */
  function textChanges(res) {
    var out = [];
    var order = M().languages.map(function (l) { return l.code; });
    Object.keys(res.texts).forEach(function (key) {
      var now = obj(res.texts[key]);
      var had = Object.prototype.hasOwnProperty.call(M().texts, key);
      var old = had ? obj(M().texts[key]) : {};
      var codes = order.filter(function (c) { return Object.prototype.hasOwnProperty.call(now, c); });
      Object.keys(now).forEach(function (c) { if (c.charAt(0) !== '_' && codes.indexOf(c) === -1) codes.push(c); });
      codes.forEach(function (c) {
        var a = str(old[c]), b = str(now[c]);
        if (a === b) return;
        var english = c === 'en';
        if (!english && isTodo(a) && isTodo(b)) return;
        out.push({ key: key, lang: c, old: english || !isTodo(a) ? a : '', now: english || !isTodo(b) ? b : '', isNew: !had, person: !english });
      });
    });
    return out;
  }

  /* The fold-out under "Compared with your draft": every text that would
     change, old → new. Open by itself when a translation would change. */
  function textChangesBox(list) {
    if (!list.length) return null;
    var person = list.some(function (x) { return x.person; });
    function words(v, lang) { return v ? quote(shorten(v, 70)) : (lang === 'en' ? '(empty)' : '(to be translated)'); }
    return h('details', { class: 'text-changes', style: 'margin-top:8px', open: person ? true : null, test: 'paste-texts' },
      h('summary', { class: 'field-label', style: 'cursor:pointer', test: 'paste-texts-toggle' },
        'The texts that would change (' + list.length + ')' + (person ? ', translations too: check them' : '')),
      person ? h('p', { class: 'help', test: 'paste-texts-note', text: 'Keep a translation only if a person wrote it: an AI must never translate. To keep today’s words, leave that cell empty in your table.' }) : null,
      h('ul', { class: 'route-list', test: 'paste-texts-list' }, list.map(function (x, i) {
        return h('li', { test: 'paste-text-' + i, 'data-key': x.key, 'data-lang': x.lang },
          h('strong', { text: x.key }), ' · ' + englishName(x.lang) + (x.isNew ? ' (new): ' : ': '),
          x.isNew ? '' : words(x.old, x.lang) + ' → ', words(x.now, x.lang));
      })));
  }

  /* What "Use this route" would change: screens added, removed or changed,
     the order, and the number of texts that are new or reworded. */
  function routeChanges(res) {
    var before = M().screens;
    var after = res.rows.map(normaliseScreen);
    var old = {};
    before.forEach(function (s) { old['#' + s.id] = s; });
    var now = {};
    var out = { added: [], removed: [], changed: [], moved: false, texts: Object.keys(res.texts).length, same: false };
    function fields(s) { var o = {}; SCREEN_FIELDS.forEach(function (f) { o[f] = s[f] === undefined ? null : s[f]; }); return canonJson(o); }
    after.forEach(function (s) {
      now['#' + s.id] = true;
      if (!old['#' + s.id]) out.added.push(s.id);
      else if (fields(old['#' + s.id]) !== fields(s)) out.changed.push(s.id);
    });
    before.forEach(function (s) { if (!now['#' + s.id]) out.removed.push(s.id); });
    var a = after.filter(function (s) { return old['#' + s.id]; }).map(function (s) { return s.id; });
    var b = before.filter(function (s) { return now['#' + s.id]; }).map(function (s) { return s.id; });
    out.moved = a.join('\n') !== b.join('\n');
    out.same = !out.added.length && !out.removed.length && !out.changed.length && !out.moved && !out.texts;
    return out;
  }

  /* The texts a row uses: its own text boxes and its answers' labels. */
  function ownTextKeys(s) {
    var keys = ['text', 'low_label', 'high_label', 'scale_hint', 'body'].map(function (f) { return str(s[f]); }).filter(Boolean);
    arr(s.options).forEach(function (o) { keys.push('choice.' + s.id + '.' + o); });
    return keys;
  }
  /* Is this text named after the row's own code (q.<code>, q.<code>.…,
     choice.<code>.…, end.<code>.…)? Only such texts go when the row or the
     answer goes; a built-in screen's standard texts always stay. */
  function namedAfter(key, id) {
    return key === 'q.' + id || ['q.', 'choice.', 'end.'].some(function (p) { return key.indexOf(p + id + '.') === 0; });
  }

  /* Where a new text goes in the Texts tab: after the texts that start the
     same way (choice.<code>. first, then choice.), so the tab stays tidy. */
  function nearPrefixOf(key) {
    var parts = key.split('.');
    var keys = Object.keys(M().texts);
    for (var n = parts.length - 1; n >= 1; n--) {
      var prefix = parts.slice(0, n).join('.') + '.';
      if (keys.some(function (k) { return k.indexOf(prefix) === 0; })) return prefix;
    }
    return undefined;
  }

  /* "Use this route": checks the table once more against the draft as it is
     now (in this window, or on the server when this window can't run the
     route code), then replaces the draft's screens with its rows and adds or
     rewords its texts. Texts named after a removed row (or a removed answer)
     that nothing else uses are removed too, as deleting a question did
     before. Everything else stays. Undo puts the whole draft back. */
  function usePastedRoute() {
    checkPastedTable(function (res) {
      if (!res.ok) {
        renderMain(true);
        toast('The table was checked once more and now has problems (see the list), so nothing was changed.', { kind: 'error', timeout: 8000 });
        return;
      }
      if (S.ui.paste.stale || S.ui.paste.seq !== S.changeSeq) {   // only while the server was checking
        renderMain(true);
        toast('The table or your draft changed while the table was being checked, so nothing was changed. Press Check again.', { kind: 'error', timeout: 8000 });
        return;
      }
      applyPastedRoute(res);
    }, 'Google is checking the table once more…');
  }

  /* The second half of "Use this route": res is a clean check of the table
     against the draft as it is now. */
  function applyPastedRoute(res) {
    var P = S.ui.paste;
    var before = M().screens;
    var snap = snapshot();
    var ch = routeChanges(res);
    M().screens = res.rows.map(normaliseScreen);
    Object.keys(res.texts).forEach(function (k) { addTextKey(k, clone(res.texts[k]), nearPrefixOf(k)); });
    var keep = {};
    M().screens.forEach(function (s) { ownTextKeys(s).forEach(function (k) { keep[k] = true; }); });
    var need = neededTextKeys();
    var gone = [];
    before.forEach(function (s) {
      ownTextKeys(s).forEach(function (k) {
        if (!keep[k] && !need[k] && namedAfter(k, s.id) && M().texts[k] && gone.indexOf(k) === -1) gone.push(k);
      });
    });
    gone.forEach(removeTextKey);
    P.result = null;
    P.model = null;
    S.ui.fixNote = null;
    P.usedWarnings = res.warnings;
    P.used = 'This route is now your draft (' + plural(M().screens.length, 'screen') + '). It is not saved yet: press Save, then Preview and Publish as usual.' +
      (gone.length ? ' ' + plural(gone.length, 'text') + ' that only the removed screens or answers used ' + (gone.length === 1 ? 'was' : 'were') + ' removed too.' : '');
    S.ui.qview = 'list';
    changed();
    S.ui.pendingFocus = { test: 'paste-used', flash: false };
    renderMain(true);
    offerUndo(snap, ch.same ? 'Route used: nothing changed.' : 'Route used: your questions were replaced.', function () { P.used = ''; P.usedWarnings = []; });
  }

  /* ---- Questions > Map ----------------------------------------------------- */

  function backToList() {
    return btn('← All questions', 'qview-back', function () {
      var fromPaste = (S.ui.qview === 'map' ? S.ui.map.which : S.ui.tryPath.which) === 'pasted';

  /* The choice "Your draft / The pasted route / The live version" above the Map and Try a path. */
  function whichRoute(st, name, withLive) {
    var pasted = pastedPreview();

    return h('div', { class: 'radio-cards', role: 'radiogroup', 'aria-label': 'Which route' },
      choiceCard(name, 'draft', st.which === 'draft', 'Your draft (unsaved changes included)', name + '-draft', function () { st.which = 'draft'; renderMain(true); }),
      pasted ? choiceCard(name, 'pasted', st.which === 'pasted', 'The pasted route (not used yet)', name + '-pasted', function () { st.which = 'pasted'; renderMain(true); }) : null,

  /* One choice of a set of radio cards (the cards look like buttons). */
  function choiceCard(name, value, on, label, test, onPick) {

  function mapView() {
    var st = S.ui.map;
    var box = h('div', { test: 'map-box', 'data-state': 'starting', style: 'margin-top:12px' });

      sectionHead('Map of the route', 'Every screen partners can get and every arrow between them, worked out by the form’s own route code.', backToList()),

  }

  function fillMap(box) {
    stopMapFrame();
    var st = S.ui.map, lib = S.flow.lib;
    function say(cls, text, test, extra) {
      box.setAttribute('data-state', 'message');
      redraw(box, function () { return h('div', { class: 'callout' + (cls ? ' ' + cls : ''), test: test }, h('p', { text: text }), extra || null); });
    }
    var survey, strings, label = 'Your draft';
    if (st.which === 'live') {
      if (!st.live && !st.liveError) {
        say('', 'Loading the live version…', 'map-live-loading');
        if (!st.liveLoading) {
          st.liveLoading = true;
          call('panelLiveSurvey').then(function (res) { st.live = obj(res); }, function (e) { st.liveError = e.message; }).then(function () {
            st.liveLoading = false;
            if (document.body.contains(box)) fillMap(box);
          });
        }
        return;
      }
      if (st.liveError) {
        say('is-error', 'The live version could not be loaded: ' + st.liveError, 'map-live-error',
          h('p', null, btn('Try again', 'map-live-retry', function () { st.liveError = ''; st.live = null; fillMap(box); }, { small: true })));
        return;
      }
      if (!st.live.live) { say('', 'Nothing is published yet, so partners get the questionnaire stored in GitHub. Switch to your draft to see its map.', 'map-live-none'); return; }
      survey = st.live.survey;
      strings = st.live.strings;
      label = 'Version ' + str(st.live.live.version);
    } else if (st.which === 'pasted' && pastedPreview()) {
      survey = pastedPreview().survey;
      strings = pastedPreview().model.texts;
      label = 'The pasted route';
    } else {
      var info = flowInfo();
      if (!info || !info.ok) { say('is-warn', 'The route could not be worked out: ' + (info ? info.error : 'the route tools are not loaded') + '.', 'map-error'); return; }
      survey = info.survey;
      strings = M().texts;
    }
    var code;
    try { code = lib.flowCheck.toMermaid(survey, strings); } catch (e) {
      say('is-error', 'The map could not be made: ' + ((e && e.message) || e), 'map-error');
      return;
    }
    drawMapFrame(box, code, survey, strings, label);
  }

  /* The Map: the route as a text outline straight away (with the
     mermaid.live link), and the drawing in a sandboxed frame below it, out of
     sight until the frame says "drawn"; then the drawing replaces the
     outline. After MAP_SLOW_MS a note says it is still loading; after
     MAP_WAIT_MS (or when the frame says "failed") the panel stops waiting
     and keeps the outline. */
  function drawMapFrame(box, code, survey, strings, label) {
    var token = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    var frame = h('iframe', { class: 'map-frame is-loading', sandbox: 'allow-scripts', title: 'Map of the route: ' + label, test: 'map-frame', tabindex: '-1' });
    frame.setAttribute('srcdoc', mapDocument(code, token));
    var status = h('p', { class: 'help', test: 'map-status' }, h('span', { class: 'spinner is-small' }),
      ' Drawing the map of ' + label.toLowerCase() + '… Meanwhile, here is the same route as a list.');
    var link = h('p', { class: 'help', test: 'map-link' },
      h('a', { href: mermaidLiveUrl(code), target: '_blank', rel: 'noopener noreferrer', test: 'map-mermaid-live' }, 'Open in mermaid.live ↗'),
      ' draws it in a new browser tab. The link holds only the questionnaire’s wording and codes, no partner data.');
    var outline = h('div', { test: 'map-text' }, routeOutline(survey, strings));
    box.textContent = '';
    box.setAttribute('data-state', 'drawing');
    appendKids(box, [status, link, outline, frame]);
    mapFrame = { el: frame, token: token, timer: null, slowTimer: null, onMessage: null };
    function fallback(why) {
      if (mapFrame.el !== frame) return;
      stopMapFrame();
      if (!document.body.contains(box)) return;
      box.setAttribute('data-state', 'fallback');
      frame.remove();
      status.remove();
      box.insertBefore(h('div', { class: 'callout is-warn', test: 'map-fallback' },
        h('p', { text: 'The diagram could not be drawn here (' + why + '). Below is the same route as a list; the link opens the drawing in a new tab.' })), box.firstChild);
    }
    mapFrame.onMessage = function (d) {
      if (d.kind === 'drawn') {
        clearTimeout(mapFrame.timer);
        clearTimeout(mapFrame.slowTimer);
        mapFrame.timer = null;
        mapFrame.slowTimer = null;
        box.setAttribute('data-state', 'drawn');
        status.remove();
        outline.remove();
        frame.classList.remove('is-loading');
        frame.removeAttribute('tabindex');
        frame.style.height = Math.max(200, Math.min(9000, Math.round(Number(d.height) || 460) + 24)) + 'px';
      } else if (d.kind === 'failed') {
        fallback(str(d.why) || 'the drawing failed');
      }
    };
    mapFrame.slowTimer = setTimeout(function () {
      if (mapFrame.el !== frame || !document.body.contains(box)) return;
      box.setAttribute('data-state', 'slow');
      redraw(status, function () {
        return [h('span', { class: 'spinner is-small' }), ' The drawing is still loading (its library is large, so this can take a while on a slow connection). The list below shows the same route.'];
      });
    }, MAP_SLOW_MS);
    mapFrame.timer = setTimeout(function () { fallback('it did not finish within ' + (MAP_WAIT_MS / 1000) + ' seconds'); }, MAP_WAIT_MS);
  }

  /* ---- Questions > Try a path -------------------------------------------------
     Drop-downs for every answer a rule, jump or "for each area rated low"
     tests, plus the language, "the link says the language" and the number of
     "what changed" items. PP.flowCheck.simulate (the form's own engine)
     shows the screens, why the others are skipped, where Next would be
     blocked and what would be sent. Nothing is sent or saved. After a clean
     Check of a pasted table it can also run on that route, before it is
     used (inModel). */

  function testedInputs(info) {
    var F = S.flow.lib.flow;
    var keys = [], facts = {};
    var areas = F.items(info.graph, info.survey, 'areas');
    function add(k) { if (keys.indexOf(k) === -1) keys.push(k); }
    function cond(c) {
      if (!c || typeof c !== 'object') return;
      if (Array.isArray(c.all)) c.all.forEach(cond);
      if (Array.isArray(c.any)) c.any.forEach(cond);
      if (c.not) cond(c.not);
      if (typeof c.fact === 'string') facts[c.fact] = true;
      if (typeof c.answer === 'string') {
        if (/\{area(\.[a-z_]+)?\}/.test(c.answer)) areas.forEach(function (a) { add(F.fill(c.answer, { area: a })); });
        else add(c.answer);
      }
    }
    function node(n) {
      if (!n || typeof n !== 'object') return;
      cond(n.show_if);
      if (n.repeat_for && n.repeat_for.where) cond(n.repeat_for.where);
      if (Array.isArray(n.next)) n.next.forEach(function (x) { if (x && typeof x === 'object') cond(x.when); });
      if (n.type === 'group' && n.body) arr(n.body.nodes).forEach(node);
    }
    arr(info.graph.nodes).forEach(node);
    var all = catalogAnswers(null) || [];
    var known = {};
    all.forEach(function (d) { known[d.ref] = true; });
    return { answers: all.filter(function (d) { return keys.indexOf(d.ref) !== -1; }), unknown: keys.filter(function (k) { return !known[k]; }), round: !!facts.round };
  }

  /* Runs fn with M() = model (the questionnaire with the pasted route, for
     its preview in Try a path), then puts the draft back, also when fn
     fails. Only for building parts of the page: nothing in fn may change or
     save the model. The route worked out for the preview (flowInfo) is kept
     apart from the draft's. model = null: just fn(). */
  var previewCache = null;
  function inModel(model, fn) {
    if (!model || model === S.model) return fn();
    var keepModel = S.model, keepCache = flowCache;
    S.model = model;
    flowCache = previewCache;
    try {
      return fn();
    } finally {
      previewCache = flowCache;
      flowCache = keepCache;
      S.model = keepModel;
    }
  }

  function tryView() {

  }
