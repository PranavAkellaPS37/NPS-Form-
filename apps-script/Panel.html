    controls.push(h('div', { style: 'margin-top:10px' }, field('“What changed” items for the round', selectCtl(['0', '1', '2', '3'].map(function (n) { return { value: n, label: n }; }), st.wc, 'try-wc',
      function (v) { st.wc = v; run(); }, { aria: 'What changed items' }))));
    if (tested.round) {
      var rounds = [{ value: '', label: '(a round no rule names)' }].concat(M().rounds.map(function (r) { return { value: r.id, label: r.id }; }));
      if (st.round && !M().rounds.some(function (r) { return r.id === st.round; })) st.round = '';
      controls.push(h('div', { style: 'margin-top:10px' }, field('Round', selectCtl(rounds, st.round, 'try-round', function (v) { st.round = v; run(); }, { aria: 'Round' }))));
    }
    controls.push(h('div', { class: 'group-label', style: 'margin-top:16px', text: tested.answers.length ? 'Answers that rules and jumps test' : 'No rule or jump tests an answer yet.' }));
    tested.answers.forEach(function (d) {
      if (d.multi) {   // pick several: one tick box per answer; the answer is the list ticked, in the list's order
        var box = h('div', { class: 'try-ticks', test: 'try-answer-' + d.ref, role: 'group', 'aria-label': d.label });
        var now = Array.isArray(st.answers[d.ref]) ? st.answers[d.ref] : [];
        d.values.forEach(function (v) {
          var tick = h('input', { type: 'checkbox', test: 'try-tick-' + d.ref + '-' + v.v, checked: now.indexOf(v.v) !== -1 });
          tick.addEventListener('change', function () {
            var cur = Array.isArray(st.answers[d.ref]) ? st.answers[d.ref].slice() : [];
            var at = cur.indexOf(v.v);
            if (tick.checked && at === -1) cur.push(v.v);
            if (!tick.checked && at !== -1) cur.splice(at, 1);
            var order = d.values.map(function (x) { return x.v; });
            cur.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
            if (cur.length) st.answers[d.ref] = cur; else delete st.answers[d.ref];
            run();
          });
          box.appendChild(h('label', { style: 'display:flex;gap:8px;align-items:flex-start;margin-top:4px;cursor:pointer' }, tick, h('span', { text: v.label })));
        });
        controls.push(h('div', { style: 'margin-top:8px' }, field(d.label + ' (tick any)', box)));
        return;
      }
      var opts = [{ value: '', label: '(not answered)' }];
      if (d.kind === 'text') opts.push({ value: 'text:typed answer', label: 'Typed an answer' }, { value: 'voice', label: 'Recorded a voice note' });
      else d.values.forEach(function (v) { opts.push({ value: String(v.v), label: v.label }); });
      var cur = st.answers[d.ref] === undefined ? '' : String(st.answers[d.ref]);
      if (!opts.some(function (o) { return o.value === cur; })) cur = '';
      controls.push(h('div', { style: 'margin-top:8px' }, field(d.label, selectCtl(opts, cur, 'try-answer-' + d.ref, function (v) {
        if (v === '') { delete st.answers[d.ref]; } else {
          var hit = null;
          d.values.forEach(function (x) { if (String(x.v) === v) hit = x.v; });
          st.answers[d.ref] = hit === null ? v : hit;
        }
        run();
      }, { aria: d.label }))));
    });

      card({ title: 'Answers and the link', test: 'try-inputs' }, controls),
      card({ title: model ? 'What this partner gets on the pasted route' : 'What this partner gets', test: 'try-output' }, result))];
  }

  function stepName(info, node, item) {
    var i = info.rowOfNode['#' + node];
    if (i === undefined) { var p = screenPos(node); if (p !== -1) i = p; }
    var place = i === undefined ? (node === 'thanks' ? 'The form’s own thank-you screen' : quote(node)) : 'Question ' + (i + 1);

  }

  function tryResult(info, st) {

    Object.keys(st.answers).forEach(function (k) { if (st.answers[k] !== '' && st.answers[k] !== undefined) answers[k] = st.answers[k]; });
    var facts = { lang: st.lang || defaultLang(), lang_in_url: !!st.langInUrl, whats_changed_count: Number(st.wc) || 0 };
    if (st.round) facts.round = st.round;
    var sim;
    try { sim = lib.flowCheck.simulate(info.survey, answers, facts, { strings: M().texts }); } catch (e) {
      return h('div', { class: 'callout is-error', test: 'try-error' }, h('p', { text: 'Try a path could not run: ' + ((e && e.message) || e) }));
    }
    var sub = obj(sim.submission);
    var sent = { answers: obj(sub.answers), ratings: arr(sub.ratings), free_text: arr(sub.free_text) };
    var out = [];
    out.push(h('p', { test: 'try-summary', style: 'margin:0 0 6px' }, h('strong', { text: plural(sim.steps.length, 'screen') }),
      sim.blocked.length ? ' · Next needs an answer on ' + plural(sim.blocked.length, 'screen') + ' (⏸): only the answers that rules test are asked here.' : ''));
    out.push(h('ol', { class: 'try-steps', test: 'try-steps' }, sim.steps.map(function (row) {

        h('strong', { text: stepName(info, row.node, row.label_en ? null : row.item) }), row.label_en ? ': ' + shorten(row.label_en, 80) : '',

  function secondName(id) {

  function areaBody(a) {

  function langFields(keyRef, o) {

  function langField(ref, L, o, refreshAll) {

    var key = ref.get();

      var k = ref.get();
      var english = k ? textValue(k, 'en') : '';

  /* ==========================================================================
     PART 17. LOADING, SAVING, PREVIEWING AND PUBLISHING
     ========================================================================== */

  function adoptLoad(res, keepSection) {
    res = obj(res);
    S.revision = res.revision;
    S.model = normaliseModel(res.model);
    var cat = obj(res.catalog);
    S.catalog = { settings_schema: arr(cat.settings_schema), screen_types: arr(cat.screen_types), form_text_keys: arr(cat.form_text_keys),
      newer_texts: obj(cat.newer_texts) };
    S.live = res.live && typeof res.live === 'object' ? res.live : null;
    /* codes_locked is false until the first real round opens: nothing is
       locked yet. (A server without codes_locked locks whatever is live.) */
    S.codesLocked = res.codes_locked !== false;
    S.liveIdsUnknown = S.codesLocked && !!res.live_ids_unknown;
    S.liveIds = normaliseLiveIds(S.codesLocked ? (S.liveIdsUnknown ? idsOfModel(S.model) : res.live_ids) : null);
    S.draftDiffers = !!res.draft_differs_from_live;
    S.savedKey = contentKey(S.model);
    rememberLiveBullets();
    S.user = str(res.user);
    S.urls = { sheet: str(res.spreadsheet_url), folder: str(res.folder_url), webApp: str(res.web_app_url) };
    /* The web app address counts only once someone recorded it (a server
       without web_app_url_recorded sends an address only when it knows it). */
    S.webAppRecorded = !!S.urls.webApp && res.web_app_url_recorded !== false;
    S.webAppAccess = S.webAppRecorded ? (str(res.web_app_access) === 'domain' ? 'domain' : 'anyone') : '';
    S.dcCount = Number(res.dc_count) || 0;
    S.activeDcCount = Number(res.active_dc_count) || 0;
    S.savedRoundIds = {};
    S.model.rounds.forEach(function (r) { S.savedRoundIds[r.id] = true; });
    S.dirty = false;
    if (S.undo && S.undo.remove) S.undo.remove();
    S.undo = null;
    addNewerTexts();
    if (!keepSection && res.open_section) {
      var hint = String(res.open_section).toLowerCase().replace(/[^a-z]/g, '');
      SECTIONS.forEach(function (sec) { if (hint === sec.id || hint.indexOf(sec.id) === 0) S.section = sec.id; });
      if (hint.indexOf('link') !== -1) S.section = 'links';
      if (hint.indexOf('publish') !== -1) S.section = 'publish';
    }
  }

  /* Loads can overlap (a background refresh after Save, then a reload after
     opening a round). Only the most recently requested one may be used, so an
     older, slower answer never overwrites a newer one. Resolves null for an
     outdated answer. */
  var loadSeq = 0;
  function loadLatest() {
    var mine = ++loadSeq;
    return call('panelLoad').then(function (res) { return mine === loadSeq ? res : null; });
  }

  function reloadQuiet() {
    return loadLatest().then(function (res) { if (res) { adoptLoad(res, true); forgetUnsaved(); renderAll(); } });
  }

  function save(o) {
    o = o || {};
    if (S.saving) return S.savingPromise;
    if (!S.dirty && !o.force) return Promise.resolve(true);
    S.saving = true;
    updateChrome();
    var seq = S.changeSeq;
    var roundIds = M().rounds.map(function (r) { return r.id; });
    var sentKey = contentKey(M());
    S.savingPromise = call('panelSave', S.revision, M()).then(function (res) {
      res = obj(res);
      S.saving = false;
      if (res.ok) {
        S.revision = res.revision;
        S.draftDiffers = !!res.draft_differs_from_live;
        S.savedKey = sentKey;
        S.savedRoundIds = {};
        roundIds.forEach(function (id) { S.savedRoundIds[id] = true; });
        if (S.changeSeq === seq) { S.dirty = false; forgetUnsaved(); rememberLiveBullets(); }
        updateChrome();
        savedMessage(o);
        refreshAfterSave(seq);
        return true;
      }
      updateChrome();
      if (res.conflict) return resolveConflict(res, o);
      throw new Error('The Sheet gave an unexpected answer while saving. Please try again.');
    }).catch(function (e) {
      S.saving = false;
      updateChrome();
      showError('Your changes were not saved', e, function () { save(o); });
      return false;
    });
    return S.savingPromise;
  }

  /* The message after a save. After "Keep mine and overwrite" it always says
     whose changes were replaced; a plain Save also mentions mistyped colours
     (they block publishing). Saves made on the way to something else (quiet)
     say nothing else. */
  function savedMessage(o) {
    if (o.replaced) {
      toast('Saved. You replaced the changes ' + o.replaced.who + ' saved ' + whenText(o.replaced.at) + '.', { kind: 'ok', timeout: 9000 });
      return;
    }
    if (o.quiet) return;
    var bad = badColorNames();
    if (bad.length) {
      var one = bad.length === 1;
      toast('Saved. ' + (one ? 'The colour code of ' + bad[0] + ' is' : 'The colour codes of ' + joinWith(bad, 'and') + ' are') +
        ' not valid yet (Look & feel): ' + COLOR_HINT + '. Publishing waits until ' + (one ? 'it is' : 'they are') + ' fixed.', { timeout: 9000 });
      return;
    }
    toast('Saved. Partners don’t see it until you publish.', { kind: 'ok' });
  }

  /* The server tidies texts while saving (fills "[TRANSLATE]", adds notes for
     translators). Fetch its version, unless the person kept typing. */
  function refreshAfterSave(seq) {
    loadLatest().then(function (res) {
      if (!res || S.changeSeq !== seq || S.dirty || S.saving) return;
      adoptLoad(res, true);
      updateChrome();
      renderMain(true);
    }, function () { /* the save itself worked; a later load will catch up */ });
  }

  /* Saves until nothing is left unsaved (edits made while a save was running
     need a second save). Resolves true when everything is in the Sheet. */
  function saveAll() {
    var tries = 0;
    function step() {
      if (!S.dirty && !S.saving) return Promise.resolve(true);
      if (tries++ > 3) return Promise.resolve(!S.dirty);
      return save({ quiet: true }).then(function (ok) { return ok ? step() : false; });
    }
    return step();
  }

  function resolveConflict(res, o) {
    return new Promise(function (resolve) {
      var who = str(res.saved_by) || 'Someone else';
      var when = res.saved_at ? fmtDate(res.saved_at, true) : 'a moment ago';
      openModal({
        title: 'Someone else saved changes', test: 'conflict', dismissible: false,
        body: [h('p', null, h('strong', { text: who }), ' saved the draft (' + when + ') after you opened the control panel. Their changes and yours can’t be combined automatically.'),
          h('ul', { style: 'margin:0 0 6px;padding-left:18px' },
            h('li', null, h('strong', { text: 'Reload the latest version: ' }), 'you get their version, and your unsaved changes are lost.'),
            h('li', null, h('strong', { text: 'Keep mine and overwrite: ' }), 'your version replaces theirs.'))],
        /* Reloading is the safe choice, so it is the main button; overwriting
           throws away someone else's work, so it looks like a warning. */
        buttons: [
          { label: 'Cancel', test: 'conflict-cancel', onClick: function (c) { c(); resolve(false); } },
          { label: 'Keep mine and overwrite', kind: 'warn', test: 'conflict-overwrite', onClick: function (c) {
            c();
            S.revision = res.revision;
            S.dirty = true;
            save(Object.assign({}, o, { force: true, replaced: { who: str(res.saved_by) || 'someone else', at: res.saved_at } })).then(resolve);
          } },
          { label: 'Reload the latest version', kind: 'primary', test: 'conflict-reload', onClick: function (c) {
            c();
            withBusy('Loading the latest version…', reloadQuiet).then(function () { toast('You now have the latest version.', { kind: 'ok' }); resolve(false); },
              function (e) { showError('The latest version could not be loaded', e); resolve(false); });
          } }
        ]
      });
    });
  }

  function discardFlow() {
    confirmBox({ title: 'Discard your unsaved changes?', test: 'confirm-discard', body: [h('p', { text: 'The panel goes back to the last saved draft. This can’t be undone.' })], ok: 'Discard changes', danger: true })
      .then(function (ok) {
        if (!ok) return;
        withBusy('Loading the saved draft…', reloadQuiet).then(function () { toast('Changes discarded.', { kind: 'ok' }); },
          function (e) { showError('The saved draft could not be loaded', e); });
      });
  }

  function runCheck() {
    return withBusy('Checking for problems…', function () { return call('panelValidate', M()); }).then(function (res) {
      res = obj(res);
      S.ui.check = { errors: arr(res.errors), warnings: arr(res.warnings), summary: res.summary || null, seq: S.changeSeq, at: new Date() };
      S.ui.fixNote = null;   // the note "Go there" left in a question's card belongs to the previous check
      if (S.section === 'publish') renderMain(true);
      updateChrome();
      return S.ui.check;

  }

  function publishFlow() {
    if (S.section !== 'publish') go('publish');
    var before = saveAll();
    return before.then(function (ok) {
      if (!ok) return null;
      return runCheck();
    }).then(function (check) {
      if (!check) return;

          .then(function (res) { return afterPublish(obj(res), note); });

        body: [same ? h('div', { class: 'callout is-warn', style: 'margin-bottom:10px', test: 'publish-same-as-live' }, h('p', { text: sameAsLiveText() + ' Publish anyway?' })) : null,
          h('p', { text: 'This makes your saved draft live for every partner straight away. Partners who already started get this version the next time they open their link: their answers are kept, and they carry on where they stopped (a question you added before that point is skipped for them).' }),
          check.warnings.length ? h('div', { class: 'callout is-warn', style: 'margin-bottom:10px' }, h('p', { text: 'There ' + (check.warnings.length === 1 ? 'is 1 warning' : 'are ' + check.warnings.length + ' warnings') + '. They don’t block publishing, but have a look first.' })) : null,

  function afterPublish(res, note) {
    if (res.ok) {
      S.ui.publishNote = '';
      S.ui.history = null;
      S.ui.historyFailed = false;
      S.ui.map.live = null;          // the Map's live version is a new one now
      S.ui.map.liveError = '';
      return reloadQuiet().then(function () {
        loadHistory();
        /* After "Publish first" (Rounds): offer to open that round now. */
        var waiting = M().rounds.filter(function (r) { return r.id === S.ui.openAfterPublish && r.status !== 'open'; })[0] || null;
        S.ui.openAfterPublish = null;
        var buttons = [{ label: waiting ? 'Not now' : 'OK', kind: waiting ? null : 'primary', test: 'published-ok', onClick: function (c) { c(); } }];
        if (waiting) buttons.push({ label: (waiting.status === 'closed' ? 'Re-open round ' : 'Open round ') + waiting.id + ' now', kind: 'primary', test: 'published-open-round',
          onClick: function (c) { c(); roundStatusFlow(waiting, 'open'); } });
        /* What Publish wants looked at (for example: the form on GitHub could not be
           checked, or the list of protected codes is nearly full) is shown here,
           never only in the server's log (26 Oct 2026, review finding 3). */
        var warnings = arr(res.warnings).map(str).filter(Boolean);
        openModal({
          title: 'Version ' + res.version + ' is live', test: 'published-modal',
          body: [h('p', { text: 'Partners get it the next time they open their link. Version code: ' + str(res.config_version) + '.' }),
            warnings.length ? h('div', { class: 'callout is-warn', style: 'margin-bottom:10px', test: 'published-warnings' },
              h('p', null, h('strong', { text: warnings.length === 1 ? 'Please check one thing:' : 'Please check ' + warnings.length + ' things:' })),
              warnings.map(function (w) { return h('p', { text: w }); })) : null,
            waiting ? h('p', { test: 'published-next-round', text: 'Next: open round ' + waiting.id + ', so partners with its links can answer this version.' }) : null,
            h('p', { class: 'help', text: 'Tip: download the files for the GitHub copy (step 4 below), so the backup matches what partners see.' })],
          buttons: buttons
        });
      });
    }
    if (res.conflict) {
      return resolveConflict(res, { quiet: true }).then(function (ok) { if (ok) return publishFlow(); });
    }
    if (res.errors) {
      S.ui.check = { errors: arr(res.errors), warnings: [], summary: null, seq: S.changeSeq, at: new Date() };
      renderMain(true);
      updateChrome();
      toast('Not published: the saved draft has problems. Fix them and try again.', { kind: 'error' });
      return;
    }
    throw new Error('The Sheet gave an unexpected answer while publishing. Check Published versions below before trying again.');
  }

  function previewFlow() {
    var before = saveAll();
    before.then(function (ok) {
      if (!ok) return;

      if (!rounds.length) {

          body: [h('p', { text: 'The preview needs a round, so it can show that round’s “What changed” screen. Create one in Rounds (it can stay “not open yet”), save, then preview.' })],

        return;

      var linkBox = h('div', { test: 'preview-link-box' });
      var hint = h('div', { class: 'help', test: 'preview-round-hint', text: previewHint(pick) });
      function loadUrl(id) {

        call('panelPreviewUrl', id).then(function (res) {
          var url = str(obj(res).url);
          redraw(linkBox, function () {
            return [h('div', { class: 'link-box' }, textInput(url, 'preview-url', null, { readonly: true, aria: 'Preview link' }), btn('Copy', 'preview-copy', function () { copyText(url, 'Preview link'); }, { small: true })),
              h('p', { style: 'margin-top:12px' }, h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', class: 'btn btn-primary', test: 'preview-open' }, 'Open the preview ↗'))];
          });
        }, function (e) { redraw(linkBox, function () { return h('p', { class: 'field-error', text: e.message }); }); });
      }
      openModal({
        title: 'Preview the draft', test: 'preview-modal',
        body: [h('p', { text: 'The preview shows your saved draft exactly as partners would see it. Nothing you answer is stored. Works on a phone too: copy the link.' }),
          field('Round', selectCtl(rounds.map(function (r) { return { value: r.id, label: r.id }; }), pick, 'preview-round', function (v) { hint.textContent = previewHint(v); loadUrl(v); }), null, hint),
          h('div', { style: 'margin-top:12px' }, linkBox),
          h('div', { class: 'callout is-warn', style: 'margin-top:12px', test: 'preview-share-warning' },
            h('p', { text: 'Share only with colleagues: anyone with this link can see your unpublished draft.' }))],
        buttons: [{ label: 'Close', test: 'modal-cancel', onClick: function (c) { c(); } }]
      });
      loadUrl(pick);
    });
  }

  /* What the preview of a round shows on its "What changed" screen. */
  function previewHint(id) {
    var screen = firstOfType('whats_changed');
    if (!screen) return 'Your draft has no “What changed” screen, so no bullets are shown.';
    if (!screen.active) return 'The “What changed” screen is hidden in your draft, so no bullets are shown.';
    var n = arr(M().whats_changed[id]).length;
    if (n) return n === 1 ? '1 “What changed” bullet is shown.' : n + ' “What changed” bullets are shown.';
    return id + ' has no “What changed” bullets: ' + (screen.skip_if === 'empty' ? 'that screen is skipped.' : 'that screen shows no news.');
  }

  /* ==========================================================================
     PART 18. POP-UPS, BUSY MESSAGE AND SHORT MESSAGES ("toasts")
     ========================================================================== */

  var modalCount = 0;

  /* o = { title, body, buttons: [{ label, kind, test, onClick(close) }], test, wide, dismissible, onClose } */
  function openModal(o) {
    var prev = document.activeElement;
    var id = 'm' + (++modalCount);
    var actions = h('div', { class: 'modal-actions' });
    var box = h('div', { class: 'modal' + (o.wide ? ' is-wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': id + '-t', test: o.test || 'modal' },
      h('h2', { id: id + '-t', text: o.title }), h('div', { class: 'modal-body' }, o.body), actions);
    var backdrop = h('div', { class: 'backdrop' }, box);
    var closed = false;
    function close(result) {
      if (closed) return;
      closed = true;
      backdrop.remove();
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.focus && document.body.contains(prev)) prev.focus({ preventScroll: true });
      if (o.onClose) o.onClose(result);
    }
    function onKey(e) {
      if (!document.body.contains(backdrop)) return;
      var top = $('#modal-root').lastElementChild;
      if (top !== backdrop) return;
      if (e.key === 'Escape' && o.dismissible !== false) { e.preventDefault(); e.stopPropagation(); close(null); }
      if (e.key === 'Tab') trapTab(e, box);
    }
    arr(o.buttons).forEach(function (b) {
      actions.appendChild(h('button', { type: 'button', class: 'btn' + (b.kind ? ' btn-' + b.kind : ''), test: b.test, onClick: function () { b.onClick(close); } }, b.label));
    });
    document.addEventListener('keydown', onKey, true);
    $('#modal-root').appendChild(backdrop);
    /* Focus the first box to fill in; otherwise the main button, except for
       risky actions (red button), where Cancel gets the focus so a stray
       Enter key never deletes anything. */
    setTimeout(function () {
      var first = box.querySelector('input:not([type=hidden]):not([readonly]):not([type=checkbox]), textarea:not([readonly]), select') ||
        actions.querySelector('.btn-primary') || actions.firstElementChild;
      if (first) first.focus();
    }, 20);
    return { close: close, box: box };
  }

  /* Is a pop-up open? openModal puts each one (its backdrop) in #modal-root
     and takes it out when it closes. */
  function dialogOpen() {
    var root = $('#modal-root');
    return Boolean(root && root.firstElementChild);
  }

  function trapTab(e, box) {
    var items = Array.prototype.filter.call(box.querySelectorAll('button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])'), function (el) { return !el.disabled && el.offsetParent !== null; });
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  /* Asks a yes/no question. Resolves true for OK, false otherwise. */
  function confirmBox(o) {
    return new Promise(function (resolve) {
      var answered = false;
      openModal({
        title: o.title, test: o.test || 'confirm', body: o.body, onClose: function (r) { if (!answered) resolve(r === true); },
        buttons: [
          { label: o.cancel || 'Cancel', test: 'modal-cancel', onClick: function (c) { c(false); } },
          { label: o.ok || 'OK', kind: o.danger ? 'danger-solid' : 'primary', test: 'modal-confirm', onClick: function (c) { answered = true; c(true); resolve(true); } }
        ]
      });
    });
  }

  /* Asks for an English name and shows the code it becomes. Resolves
     { text, code } or null. */
  function askName(o) {
    return new Promise(function (resolve) {
      var input = textInput('', o.inputTest, null, { placeholder: o.placeholder });
      var preview = h('div', { class: 'help', test: o.inputTest + '-code' });
      function upd() { preview.textContent = 'Code in the data: ' + slug(input.value, o.taken(), o.fallback) + ' (' + codeChangeHint() + ')'; }
      input.addEventListener('input', upd);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      upd();
      var result = null, modal;
      function submit() {
        if (!input.value.trim()) { input.classList.add('is-invalid'); input.focus(); return; }
        result = { text: input.value.trim(), code: slug(input.value, o.taken(), o.fallback) };
        modal.close('ok');
      }
      modal = openModal({
        title: o.title, test: o.test, onClose: function () { resolve(result); },
        body: [field(o.label, input, o.help || null, preview)],
        buttons: [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }, { label: o.okLabel || 'Add', kind: 'primary', test: o.okTest, onClick: submit }]
      });
    });
  }

  /* Asks for a new code (only for things that are not live yet). */
  function askCode(o) {
    return new Promise(function (resolve) {
      var input = textInput(o.current, 'code-new', null, { spellcheck: false, maxlength: 60 });
      var err = h('div', { class: 'field-error' });
      var result = null, modal;
      function submit() {
        var v = input.value.trim();
        var problem = !ID_RE.test(v) ? 'Use lower-case letters, digits and _, starting with a letter.'
          : (v !== o.current && o.taken[v]) ? 'This code is already used. Pick another one.' : '';
        if (problem) { err.textContent = problem; input.classList.add('is-invalid'); input.focus(); return; }
        result = v === o.current ? null : v;
        modal.close('ok');
      }
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      modal = openModal({
        title: o.title, test: 'code-modal', onClose: function () { resolve(result); },
        body: [h('p', { class: 'help', text: 'The code is how answers are stored. ' +
          (S.codesLocked ? 'Once a code is published it is locked, so rounds stay comparable.' : 'Codes lock when the first real round opens (not a SMOKE, DEMO or TEST round), so rounds stay comparable.') +
          ' Texts and rules that use it are updated too.' }),
          field('New code', input, null, err)],
        buttons: [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }, { label: 'Change code', kind: 'primary', test: 'code-confirm', onClick: submit }]
      });
    });
  }

  function showError(title, err, retry) {
    var buttons = [{ label: retry ? 'Close' : 'OK', kind: retry ? null : 'primary', test: 'error-close', onClick: function (c) { c(); } }];
    if (retry) buttons.push({ label: 'Try again', kind: 'primary', test: 'error-retry', onClick: function (c) { c(); retry(); } });
    openModal({ title: title, test: 'error-modal', body: [h('p', { text: (err && err.message) || String(err) })], buttons: buttons });
  }

  function busy(message) {
    var el = h('div', { class: 'busy', role: 'alert', 'aria-busy': 'true', test: 'busy' }, h('div', { class: 'busy-box' }, h('div', { class: 'spinner' }), h('div', { text: message })));
    document.body.appendChild(el);
    return function () { el.remove(); };
  }

  function withBusy(message, fn) {
    var done = busy(message);
    var p;
    try { p = Promise.resolve(fn()); } catch (e) { p = Promise.reject(e); }
    return p.then(function (v) { done(); return v; }, function (e) { done(); throw e; });
  }

  function toast(message, o) {
    o = o || {};
    var timer;
    var el = h('div', { class: 'toast' + (o.kind && o.kind !== 'info' ? ' is-' + o.kind : ''), role: 'status', test: 'toast' },
      h('span', { class: 'toast-text', text: message }),
      h('button', { type: 'button', class: 'toast-close', test: 'toast-close', 'aria-label': 'Close this message', onClick: function () { remove(); } }, '×'),
      o.action ? h('button', { type: 'button', class: 'toast-action', test: o.action.test || 'toast-action', onClick: function () { remove(); o.action.onClick(); } }, o.action.label) : null);
    function remove() { clearTimeout(timer); el.remove(); }
    var box = $('#toasts');
    box.appendChild(el);
    while (box.children.length > 2) box.removeChild(box.firstElementChild);
    timer = setTimeout(remove, o.timeout || (o.action ? 9000 : 4500));
    return remove;
  }

  /* ==========================================================================
     PART 19. START-UP
     ========================================================================== */

  function start() {
    loadFlowCode();   // the route tools, in parallel (PART 5b)
    loadLatest().then(function (res) {
      adoptLoad(res, false);
      S.loaded = true;
      renderAll();
      offerRecovery();
      if (S.section === 'publish' && !S.dirty) runCheck();
      if (!S.flowStatus) loadFlowStatus();
    }, function (e) {
      var boot = $('#boot');
      boot.textContent = '';
      /* Messages about Drive access, a passing Drive problem or permissions
         already say what to do; set-up would not help with those. */
      var ownAdvice = hasOwnAdvice(e.message);
      boot.appendChild(h('div', { class: 'boot-error card', test: 'load-error' },
        h('h2', { text: 'The control panel could not open' }),
        h('p', { text: e.message }),
        ownAdvice ? null : h('p', { class: 'help', test: 'load-error-setup-hint', text: 'If this keeps happening, run Partner Pulse > Set up or repair from the Sheet’s menu, then open the panel again.' }),
        btn('Try again', 'load-retry', function () {
          boot.textContent = '';
          appendKids(boot, [h('div', { class: 'spinner' }), h('div', { text: 'Loading the control panel…' })]);
          start();
        }, { kind: 'primary' })));
    });
  }

  /* Text boxes grow with their text, so long questions are never cut off. */
  function autosize(el) {
    if (!el || el.tagName !== 'TEXTAREA' || !el.isConnected) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }
  function autosizeAll(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('textarea'), autosize);
  }
  document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('is-invalid')) e.target.classList.remove('is-invalid');
    autosize(e.target);
  }, true);
  /* Size only the boxes that just appeared (cheap, even in the long Texts list). */
  new MutationObserver(function (records) {
    var added = [];
    records.forEach(function (r) {
      Array.prototype.forEach.call(r.addedNodes, function (n) { if (n.nodeType === 1) added.push(n); });
    });
    if (!added.length) return;
    requestAnimationFrame(function () {
      added.forEach(function (n) { if (n.tagName === 'TEXTAREA') autosize(n); else autosizeAll(n); });
    });
  }).observe(document.body, { childList: true, subtree: true });

  /* Ctrl+S / Cmd+S saves; a warning if the window is closed with unsaved changes.
     Not while a pop-up is open (review of 30 Oct 2026): it asks something
     first, and a save then could answer for the person. For example, under
     "Bring back your unsaved changes?" a save went through (the saved draft
     had just been given the form's newer texts) and threw away the very
     copy the question was about. The key still never opens the browser's
     own "Save page as". */
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      if (S.loaded && !dialogOpen()) save();
    }
  });
  window.addEventListener('beforeunload', function (e) {
    if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  /* Small laptop screens: the Sheet opens the panel at 1100 × 760, which can be
     taller or wider than the screen (then its buttons are out of reach). Google
     lets the window resize itself, so it shrinks to fit: at most 760 high and
     1100 wide, leaving room around it. Every section scrolls inside the window.
     Outside Google (the local test bench) there is nothing to resize. */
  function fitToScreen() {
    var g = window.google;
    var host = g && g.script && g.script.host;
    var scr = window.screen;
    if (!host || !scr) return;
    try {
      if (typeof host.setHeight === 'function' && scr.availHeight) host.setHeight(Math.max(420, Math.min(760, scr.availHeight - 200)));
      if (typeof host.setWidth === 'function' && scr.availWidth) host.setWidth(Math.max(720, Math.min(1100, scr.availWidth - 80)));
    } catch (e) { /* the window keeps the size the Sheet gave it */ }
  }

  /* For the local test bench only (tests/panel): its stand-in for Google sets
     window.__ppTest before this page runs, and gets read-only views of this
     window's route here: whether the route code runs, the draft's route,
     the route of the last clean Check of "Paste a route" (also after it was
     used), what a table tool would be given (tableRequest: the same request
     the server gets when this window can't run the route code), where the
     table tools run ('window', 'server' or ''), and the last Check's result.
     Google's real page never sets it. */
  if (window.__ppTest && typeof window.__ppTest === 'object') {
    window.__ppTest.flowReady = function () { return !!S.flow.lib; };
    window.__ppTest.flowSurvey = function () { var i = flowInfo(); return i && i.ok ? clone(i.survey) : null; };
    window.__ppTest.pastedSurvey = function () { var p = S.ui.paste.last; return p && p.survey ? clone(p.survey) : null; };
    window.__ppTest.tableRequest = function (tool, text) { return S.model ? clone(tableRequest(tool, text)) : null; };
    window.__ppTest.tableToolsWhere = function () { return tableToolsWhere(); };
    window.__ppTest.pasteResult = function () { return S.ui.paste.result ? clone(S.ui.paste.result) : null; };
  }

  fitToScreen();
  start();
})();
</script>
