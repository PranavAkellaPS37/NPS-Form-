<!--
==============================================================================
  Panel.html: THE PARTNER PULSE CONTROL PANEL
==============================================================================

WHAT THIS IS
  The window that opens from the Google Sheet "Valmo Partner Pulse - Control"
  (menu Partner Pulse > Open control panel). Anyone the Sheet is shared with as
  Editor can use it to change the whole questionnaire without touching code:
  questions, areas and their problem lists, support questions, every text in
  every language, colours, rounds, partner links, and publishing.

HOW TO INSTALL IT
  In the Apps Script editor this is the HTML file named "Panel" (paste this
  whole file into it). Its server half is PanelServer.gs (a Script file; see
  apps-script/README.md for the exact names).

HOW TO USE IT (short version; the full guide is docs/control-panel.md)
  1. Make changes in any section on the left. The top bar then says
     "Unsaved changes" (with "Discard" to go back to the last save).
  2. Press Save (or Ctrl+S, Cmd+S on a Mac). Your changes go into the Sheet's
     tabs as the DRAFT. Partners never see the draft.
  3. Press Preview to try the draft form yourself. Nothing you answer is stored.
  4. Press Publish. The panel checks for problems, asks for a short note, then
     makes the draft live for every partner straight away.
  Opening or closing a round (in Rounds) works straight away, without Publish.

WHAT IT READS AND WRITES
  This page never touches the Sheet, Google Drive or partners itself. It asks
  the script behind the Sheet (PanelServer.gs) to do the work, through Google's
  "google.script.run". These steps run as you:
    panelLoad, panelSave, panelValidate, panelPublish, panelHistory,
    panelRestore, panelSetRoundStatus, panelRoundCounts, panelGenerateLinks,
    panelPreviewUrl, panelNewPreviewKey, panelGetSecret, panelImport, panelExport,
    panelSetWebAppUrl.
  While you edit, the whole questionnaire is held in this window (the "model",
  described in docs/control-panel-design.md, section 4). Save sends it back
  in one piece.

SAFETY
  - Nothing is saved until you press Save. Nothing reaches partners until you
    Publish. The one exception is opening or closing a round, and the panel
    asks you to confirm that first.
  - If someone else saved in the meantime, Save stops and asks what to do, so
    nobody overwrites another person's work by accident.
  - Deleting always asks first, and a short message offers "Undo" right after.
    Once the first real round has opened, anything already live (its code is
    stored in partners' answers) can only be hidden, not deleted, so rounds
    stay comparable on the dashboard. Test rounds (names starting with
    SMOKE, DEMO or TEST) never lock anything, and the panel says so when
    you open one.
  - Opening a round publishes nothing. When partners would get something
    other than the draft, the panel says which version they get and offers
    "Publish first".
  - If the window is closed before saving, the unsaved changes are kept in
    this browser (questionnaire only, no partner data). The next time the
    panel opens it offers to bring them back, but only if nobody saved the
    draft in the meantime.
  - The link secret is shown only after you type SHOW. Never paste it into
    chats or emails.
  - No partner data is kept in this file. The DC list stays in the DCs tab.

FOR WHOEVER MAINTAINS THIS FILE
  - One self-contained file: the page, then the look (the "style" section),
    then the behaviour (the "script" section). No external libraries and no
    Apps Script template tags, so it also runs in a normal browser with a test
    stand-in for google.script.run (the local test bench).
  - The script is split into numbered parts. Search for "PART" to jump:
      1 talking to the server      2 what the panel remembers
      3 small helpers              4 questionnaire helpers (and the recovery copy)
      5 "show this question only if" rules
      6 the frame (top bar, menu, banner)
      7 Home          8 Questions          9 Areas & problems   10 Support
      11 the text boxes for every language, used by all the editors
      12 Texts & translations    13 Look & feel    14 Rounds    15 Links
      16 Publish and Settings    17 loading, saving, previewing, publishing
      18 pop-ups and messages    19 start-up
  - The server's catalogue (Model.gs: PP_SETTINGS_SCHEMA, PP_SCREEN_TYPES)
    gives the names, help texts and fields shown here. To reword a setting's
    name or help, change it there, not in this file.
  - Every button, box and switch has a data-test="..." name so automatic tests
    can find it. Keep these names when you change things.
  - On a small laptop screen the window shrinks itself to fit (Google's
    google.script.host.setHeight / setWidth, used only when Google provides
    them); every section then scrolls inside the window.
  - Codes (of questions, areas, problems...) lock only once the first real
    round has opened (panelLoad's codes_locked). Before that, anything can
    still be deleted or renamed. Test rounds (SMOKE..., DEMO..., TEST...)
    never lock them: isTestRound, the same rule as Code.gs PP_isTestRound_.
  - Wording rule: plain English for non-technical colleagues. Say what
    happened and what to do next. No technical words.
==============================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Pulse control panel</title>
<style>
/* ---------------------------------------------------------------------------
   LOOK. Colours are the form's own palette, so the panel feels like the form.
   --------------------------------------------------------------------------- */
:root {
  --primary: #4B2E83;
  --primary-dark: #3A2366;
  --primary-soft: #EDE7F6;
  --surface: #F3F0F8;
  --border: #D9D4E3;
  --border-strong: #BDB5CC;
  --text: #1B1B1F;
  --muted: #5F5E6B;
  --bg: #FFFFFF;
  --page: #FAF9FC;
  --error: #B3261E;
  --error-soft: #FDECEA;
  --warn: #7A4F00;
  --warn-soft: #FFF4D6;
  --warn-border: #EED48A;
  --success: #1B7F3B;
  --success-soft: #E6F4EA;
  --info: #1A4FA0;
  --info-soft: #E8F0FE;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(27, 27, 31, 0.05), 0 2px 10px rgba(75, 46, 131, 0.06);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari",
    "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Kannada", "Noto Sans Malayalam", "Nirmala UI", Arial, sans-serif;
}
[hidden] { display: none !important; }
a { color: var(--primary); }
h1, h2, h3 { line-height: 1.25; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Frame: top bar, banner, menu, main area ------------------------------ */
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
  min-width: 0;
}
.brandbox { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--primary); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.02em;
}
.brand-title { font-weight: 800; font-size: 15px; white-space: nowrap; }
.brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.status {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  padding: 4px 10px; border-radius: 999px; background: var(--success-soft); color: var(--success);
  font-weight: 600; font-size: 12.5px; white-space: nowrap;
}
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.is-dirty { background: var(--warn-soft); color: var(--warn); }
.status.is-saving { background: var(--info-soft); color: var(--info); }
.status .link-btn { font-size: 12.5px; }
.live-badge {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  font-size: 12.5px; color: var(--text); overflow: hidden;
}
.live-badge span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex: none; }
.live-badge.is-none .dot { background: var(--border-strong); }
.top-actions { display: flex; gap: 8px; flex: none; }

.banner {
  display: flex; align-items: center; gap: 12px;
  min-height: 45px; padding: 6px 16px; border-bottom: 1px solid var(--warn-border); background: var(--warn-soft); color: var(--warn);
  font-size: 13px;
}
.banner.is-info { background: var(--info-soft); color: var(--info); border-bottom-color: #C6D6F5; }
.banner .btn { flex: none; }

.layout { display: grid; grid-template-columns: 196px minmax(0, 1fr); min-height: 0; }
.nav {
  overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border);
  padding: 12px 8px; display: flex; flex-direction: column; gap: 2px;
}
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
  font-weight: 600; text-align: left; cursor: pointer; color: var(--text);
}
.nav-btn:hover { background: rgba(75, 46, 131, 0.08); }
.nav-btn[aria-current="page"] { background: var(--primary); color: #fff; }
.nav-icon { width: 22px; text-align: center; flex: none; font-size: 15px; }
.nav-badge {
  margin-left: auto; min-width: 18px; padding: 0 6px; border-radius: 999px;
  background: var(--error); color: #fff; font-size: 11px; line-height: 18px; text-align: center;
}
.nav-badge.is-dot { min-width: 9px; width: 9px; height: 9px; padding: 0; background: #E39B00; }
.nav-foot { margin-top: auto; padding: 10px 10px 2px; font-size: 11.5px; color: var(--muted); }

.main { overflow-y: auto; padding: 20px 24px 60px; min-width: 0; outline: none; scroll-behavior: auto; }
.main-inner { max-width: 980px; margin: 0 auto; }

/* ---- Section heading ------------------------------------------------------ */
.section-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.section-head h1 { font-size: 21px; margin: 0; }
.section-head .intro { margin: 4px 0 0; color: var(--muted); max-width: 660px; }
.head-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }

/* ---- Cards ---------------------------------------------------------------- */
.card {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.card-head h2 { font-size: 15.5px; margin: 0; }
.card-head .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.card-head .card-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-2 > .card { margin-bottom: 0; }
.grid-2 + .card, .grid-2 + .grid-2 { margin-top: 14px; }
.callout {
  padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border);
  font-size: 13px;
}
.callout.is-warn { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }
.callout.is-error { background: var(--error-soft); border-color: #F1C0BB; color: var(--error); }
.callout.is-ok { background: var(--success-soft); border-color: #B9DEC4; color: var(--success); }
.callout.is-info { background: var(--info-soft); border-color: #C6D6F5; color: var(--info); }
.callout p { margin: 0; }
.callout p + p { margin-top: 6px; }
.empty {
  padding: 28px 18px; text-align: center; color: var(--muted);
  border: 1.5px dashed var(--border-strong); border-radius: var(--radius); background: var(--bg);
}
.empty h3 { margin: 0 0 6px; color: var(--text); font-size: 15px; }
.empty p { margin: 0 0 12px; }

/* ---- Buttons -------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: var(--bg); color: var(--text);
  font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { color: var(--error); border-color: #E3AFA9; }
.btn-danger:hover { background: var(--error-soft); }
.btn-danger-solid { background: var(--error); border-color: var(--error); color: #fff; }
.btn-danger-solid:hover { background: #8F1E18; }
/* "Be careful" buttons that are not deletions (for example "Keep mine and overwrite"). */
.btn-warn { background: var(--warn-soft); border-color: #D9A300; color: #6B4500; }
.btn-warn:hover { background: #FBE7B0; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-small { min-height: 28px; padding: 3px 10px; font-size: 12.5px; border-radius: 7px; }
.btn-icon { min-width: 28px; padding: 3px 6px; }
.btn:disabled, .btn.is-locked { opacity: 0.42; cursor: not-allowed; }
.btn .bi { font-size: 1.05em; line-height: 1; }
.link-btn {
  border: 0; background: none; padding: 0; color: var(--primary); text-decoration: underline;
  cursor: pointer; font-weight: 600;
}
.btn-group { display: inline-flex; gap: 4px; flex-wrap: wrap; }

/* ---- Inputs ----------------------------------------------------------------- */
input[type="text"], input[type="url"], input[type="number"], input[type="search"], input[type="date"],
select, textarea {
  width: 100%; min-height: 34px; padding: 6px 10px;
  border: 1px solid var(--border-strong); border-radius: 8px; background: #fff;
}
textarea { resize: vertical; min-height: 58px; line-height: 1.4; overflow-y: hidden; }
select.inline { width: auto; max-width: 100%; }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(75, 46, 131, 0.16);
}
input::placeholder, textarea::placeholder { color: #8E8A99; }
input[readonly] { background: var(--surface); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field + .field { margin-top: 12px; }
.field-label { font-weight: 650; font-size: 13px; }
.help { color: var(--muted); font-size: 12.5px; }
.field-error { color: var(--error); font-size: 12.5px; }
.field-warn { color: var(--warn); font-size: 12.5px; }
.is-invalid { border-color: var(--error) !important; }
.inline-fields { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.inline-fields > .field { flex: 0 1 380px; margin-top: 0; }
.round-grid > .field, .lang-grid > .field, .color-grid .field { margin-top: 0; }

/* On/off switches (a real checkbox underneath, so keyboards and tests work). */
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 28px; }
.switch input {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1;
}
.switch .track {
  position: relative; flex: none; width: 36px; height: 20px; border-radius: 10px;
  background: #C9C3D4; transition: background 0.15s;
}
.switch .thumb {
  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: left 0.15s;
}
.switch input:checked + .track { background: var(--primary); }
.switch input:checked + .track .thumb { left: 18px; }
.switch input:focus-visible + .track { outline: 2px solid var(--primary); outline-offset: 2px; }
.switch-label { font-weight: 600; }
.switch-text { font-size: 12.5px; color: var(--muted); }
.switch.is-disabled { opacity: 0.5; cursor: not-allowed; }

/* ---- Badges and codes ----------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--surface); color: var(--muted); border: 1px solid transparent;
}
.badge-req { background: var(--primary-soft); color: var(--primary); }
.badge-rule { background: var(--info-soft); color: var(--info); }
.badge-hidden { background: #F1F1F3; color: #55545E; border: 1px dashed #A9A6B3; }
.badge-live { background: var(--success-soft); color: var(--success); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-error { background: var(--error-soft); color: var(--error); }
.badge-open { background: var(--success-soft); color: var(--success); }
.badge-draft { background: #EFEFF2; color: #4E4D57; }
.badge-closed { background: #ECE7F3; color: #4B2E83; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.code {
  display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; white-space: nowrap;
}
.code.is-live { background: var(--success-soft); border-color: #B9DEC4; color: #155F2D; }

/* ---- Text boxes for every language ---------------------------------------- */
.lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 12px; }
.lang-grid.compact { gap: 8px 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.lang-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lang-label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; }
.lang-label .muted { font-weight: 500; }
.lang-label .badge { padding: 0 7px; font-size: 11px; }
.ph { background: #FFE9A8; border-radius: 4px; padding: 0 3px; font-weight: 700; color: #6B4A00; }
.group-label { font-weight: 700; font-size: 13px; margin: 14px 0 6px; }
.group-label:first-child { margin-top: 0; }

/* ---- Questions list ------------------------------------------------------- */
.qlist { display: flex; flex-direction: column; gap: 10px; }
.qcard {
  display: grid; grid-template-columns: 28px 38px minmax(0, 1fr) auto; gap: 10px; align-items: start;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; box-shadow: var(--shadow);
}
.qcard.is-hidden { background: #FBFBFC; border-style: dashed; }
.qcard.is-hidden .qbody { opacity: 0.7; }
.qnum { color: var(--muted); font-weight: 700; font-size: 12.5px; padding-top: 9px; text-align: right; }
.qicon {
  width: 38px; height: 38px; border-radius: 10px; background: var(--surface);
  display: flex; align-items: center; justify-content: center; font-size: 19px;
}
.qtitle-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qtype { font-weight: 700; }
.qtext { margin-top: 3px; font-size: 14px; }
.qtext-2 { margin-top: 1px; font-size: 13px; color: var(--muted); }
.qactions { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.flash { animation: pp-flash 2.2s ease-out; }
@keyframes pp-flash { 0%, 30% { box-shadow: 0 0 0 4px rgba(227, 155, 0, 0.6); } 100% { box-shadow: 0 0 0 0 rgba(227, 155, 0, 0); } }

/* ---- Question editor ------------------------------------------------------ */
.editor-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.editor-head h1 { font-size: 20px; margin: 0; }
.editor-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.editor-foot { display: flex; gap: 8px; margin-top: 6px; }
.option-row, .chip-row, .item-row, .bullet-row {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: #FDFCFE;
}
.option-row + .option-row, .chip-row + .chip-row, .item-row + .item-row, .bullet-row + .bullet-row { margin-top: 8px; }
.row-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.row-head .name { font-weight: 700; }
.row-head .btn-group { margin-left: auto; }
.chip-row.is-off, .item-row.is-off { background: #F7F7F8; border-style: dashed; }
.fixed-chip { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface); margin-top: 8px; font-size: 13px; }

/* ---- Rule builder --------------------------------------------------------- */
.radio-cards { display: flex; gap: 10px; flex-wrap: wrap; }
.radio-card {
  position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 8px 14px; border: 1.5px solid var(--border-strong); border-radius: 10px; background: #fff; font-weight: 600;
}
.radio-card input { margin: 0; accent-color: var(--primary); }
.radio-card.is-on { border-color: var(--primary); background: var(--primary-soft); }
.cond {
  display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 0.9fr) minmax(0, 1.3fr) 34px; gap: 8px; align-items: start;
  padding: 10px; border-radius: 10px; background: var(--surface); margin-top: 8px;
}
.cond .cond-problem { grid-column: 1 / -1; }
/* The remove button stays a small square at every width (never stretched). */
.cond .cond-remove { width: 34px; height: 34px; min-width: 34px; padding: 0; justify-self: end; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  position: relative; display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 600;
}
.pill input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.pill.is-on { background: var(--primary); border-color: var(--primary); color: #fff; }
.pill:focus-within { outline: 2px solid var(--primary); outline-offset: 2px; }
.sentence {
  margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--info-soft); color: #173E7A;
  border: 1px solid #C6D6F5; font-size: 13.5px;
}
.sentence strong { color: #0F2F5F; }

/* ---- Type picker ---------------------------------------------------------- */
.type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.type-opt {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; cursor: pointer;
  padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff;
}
.type-opt:hover { border-color: var(--border-strong); background: #FDFCFE; }
.type-opt.is-on { border-color: var(--primary); background: var(--primary-soft); }
.type-opt .qicon { width: 34px; height: 34px; font-size: 17px; flex: none; }
.type-opt strong { display: block; }
.type-opt span.desc { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }

/* ---- Areas ---------------------------------------------------------------- */
.area-card.is-off { background: #FBFBFC; border-style: dashed; }
.area-top { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.area-title { font-size: 15.5px; font-weight: 750; margin: 0; }
.area-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
.area-tools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.area-body { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.chip-list-inline { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
.chip-list-inline .badge { font-weight: 500; color: var(--text); background: var(--surface); }
.chip-list-inline .badge.off { text-decoration: line-through; color: var(--muted); }

/* ---- Texts table ---------------------------------------------------------- */
.progress-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px 18px; }
.progress-item .row { justify-content: space-between; flex-wrap: nowrap; font-size: 13px; white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; margin-top: 4px; border: 1px solid var(--border); }
.bar > div { height: 100%; background: var(--primary); width: 0; transition: width 0.2s; }
.bar.is-done > div { background: var(--success); }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.filters input[type="search"] { flex: 1 1 220px; width: auto; }
.filters select { width: auto; min-width: 170px; }
.tgroup { margin-top: 18px; }
.tgroup h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
.trow { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
.trow + .trow { margin-top: 6px; }
.trow-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.trow-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.trow-fields.one { grid-template-columns: minmax(0, 1fr); }
.note-box {
  display: flex; gap: 10px; align-items: center; margin-top: 8px; padding: 6px 10px; border-radius: 8px;
  background: var(--warn-soft); color: var(--warn); font-size: 12.5px;
}
.note-box .btn { margin-left: auto; }
.explain summary { cursor: pointer; font-weight: 650; }
.explain ul { margin: 8px 0 0; padding-left: 18px; }
.explain li + li { margin-top: 4px; }

/* ---- Look & feel ---------------------------------------------------------- */
.look-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.look-preview { position: sticky; top: 0; }
.color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px 14px; }
.color-row { display: grid; grid-template-columns: 40px 96px minmax(0, 1fr); gap: 8px; align-items: center; }
.color-row input[type="color"] { width: 40px; height: 34px; padding: 2px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; cursor: pointer; }
.color-row .field-label { font-size: 12.5px; }
.color-row .help { font-size: 11.5px; line-height: 1.3; }
.color-row .color-msg { grid-column: 1 / -1; }
.color-msg:empty { display: none; }
.faces-row { display: flex; gap: 10px; flex-wrap: wrap; }
.face-box { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 74px; }
.face-box input { text-align: center; font-size: 22px; padding: 2px; min-height: 40px; }
.face-box span { font-size: 11.5px; color: var(--muted); text-align: center; }
.phone {
  width: 100%; border: 1px solid; border-radius: 22px; padding: 12px 12px 10px; overflow: hidden;
  box-shadow: 0 8px 24px rgba(27, 27, 31, 0.12);
}
.ph-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 800; font-size: 13px; }
.ph-top img { max-height: 22px; max-width: 120px; }
.ph-lang { font-size: 11px; font-weight: 500; border: 1px solid; border-radius: 999px; padding: 2px 8px; }
.ph-progress { height: 4px; border-radius: 2px; margin: 8px 0 12px; overflow: hidden; }
.ph-progress > div { height: 100%; }
.ph-title { font-weight: 700; font-size: 14px; line-height: 1.3; margin-bottom: 10px; }
.ph-nps { display: grid; gap: 5px; margin-bottom: 5px; }
.ph-nps.a { grid-template-columns: repeat(6, 1fr); }
.ph-nps.b { grid-template-columns: repeat(5, 1fr); }
.ph-chip { border: 1.5px solid; border-radius: 8px; text-align: center; font-weight: 700; font-size: 12px; padding: 6px 0; }
.ph-ends { display: flex; justify-content: space-between; font-size: 10.5px; margin-top: 2px; gap: 8px; }
.ph-ends span:last-child { text-align: right; }
.ph-sub { font-weight: 700; font-size: 12.5px; margin: 12px 0 6px; }
.ph-faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.ph-face { border: 1.5px solid; border-radius: 8px; text-align: center; padding: 4px 0 3px; font-size: 18px; line-height: 1.2; }
.ph-face small { display: block; font-size: 8.5px; line-height: 1.1; margin-top: 2px; }
.ph-msg { font-size: 11px; margin-top: 8px; }
.ph-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid; }
.ph-btn { border: 1.5px solid; border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 12px; }

/* ---- Rounds, links, publish ----------------------------------------------- */
.round-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #fff; }
.round-card + .round-card { margin-top: 10px; }
.round-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.round-id { font-weight: 800; font-size: 15px; }
.round-grid { display: grid; grid-template-columns: 150px 150px minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.counts { display: inline-flex; flex: 1 1 0; min-width: 220px; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.counts .num { font-weight: 750; }
.counts .sep { color: var(--border-strong); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 650; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.result-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.result-grid.is-four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { padding: 10px 12px; border-radius: 10px; background: var(--surface); }
.stat .big { font-size: 22px; font-weight: 800; }
.stat .lbl { font-size: 12.5px; color: var(--muted); }
.issue { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 9px; }
.issue + .issue { margin-top: 6px; }
.issue.is-error { background: var(--error-soft); }
.issue.is-warn { background: var(--warn-soft); }
.issue .where { font-size: 12px; font-weight: 700; white-space: nowrap; }
.issue .msg { flex: 1; min-width: 0; }
.issue.is-error .where { color: var(--error); }
.issue.is-warn .where { color: var(--warn); }
.hist-row td:first-child { white-space: nowrap; }
.link-box { display: flex; gap: 8px; align-items: center; }
.link-box input { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.step-list { list-style: none; margin: 0; padding: 0; }
.step-list li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); }
.step-list li:first-child { border-top: 0; padding-top: 0; }
.step-list .ico { flex: none; width: 22px; text-align: center; }
.step-list .txt { flex: 1; min-width: 0; }
.quick-links { display: flex; flex-wrap: wrap; gap: 8px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
details.group { border: 1px solid var(--border); border-radius: var(--radius); background: #fff; margin-bottom: 12px; box-shadow: var(--shadow); }
details.group > summary { cursor: pointer; padding: 12px 16px; font-weight: 750; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::before { content: "\25B8"; color: var(--muted); transition: transform 0.15s; }
details.group[open] > summary::before { transform: rotate(90deg); }
details.group > .group-body { padding: 0 16px 14px; }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 18px; padding: 12px 0; border-top: 1px solid var(--border); }
.setting:first-child { border-top: 0; }
.setting .field-label { font-size: 13.5px; }
.setting .control { display: flex; flex-direction: column; gap: 4px; }
.lang-table input { min-height: 30px; padding: 4px 8px; }

/* ---- Pop-ups, busy overlay, toasts ---------------------------------------- */
.backdrop {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(27, 27, 31, 0.45); padding: 20px;
}
.modal {
  width: 560px; max-width: 100%; max-height: calc(100vh - 40px); overflow: auto;
  background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); padding: 20px 22px;
}
.modal.is-wide { width: 760px; }
.modal h2 { margin: 0 0 10px; font-size: 18px; }
.modal-body p { margin: 0 0 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.busy {
  position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.72);
}
.busy-box {
  display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 12px; background: #fff;
  border: 1px solid var(--border); box-shadow: var(--shadow); font-weight: 600; max-width: 420px;
}
.spinner {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  border: 3px solid var(--border); border-top-color: var(--primary); animation: pp-spin 0.9s linear infinite;
}
.spinner.is-small { width: 14px; height: 14px; border-width: 2px; display: inline-block; vertical-align: -2px; }
@keyframes pp-spin { to { transform: rotate(360deg); } }
.toasts {
  /* Messages appear at the bottom of the left menu: they never cover a button
     in the main area, where people are working. */
  position: fixed; left: 8px; bottom: 8px; z-index: 90; width: 180px;
  display: flex; flex-direction: column; gap: 6px;
}
.toast {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 6px; align-items: start;
  padding: 9px 8px 9px 11px; border-radius: 10px;
  background: #23212A; color: #fff; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); font-size: 12.5px; line-height: 1.35;
}
.toast-text { overflow-wrap: anywhere; }
.toast-action { grid-column: 1 / -1; justify-self: start; }
.toast.is-ok { background: #17361F; }
.toast.is-error { background: #5E1612; }
.toast-action { border: 0; background: none; color: #D7C8FF; font-weight: 800; cursor: pointer; text-decoration: underline; padding: 0; }
.toast-close { border: 0; background: none; color: #fff; opacity: 0.7; cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; }
.boot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 100vh; color: var(--muted); }
.boot .spinner { width: 34px; height: 34px; border-width: 4px; }
.boot-error { max-width: 520px; margin: 12vh auto 0; color: var(--text); }

/* Narrower windows (the panel also works in a normal browser tab >= 900 px). */
@media (max-width: 1040px) {
  .brand-sub { display: none; }
}
@media (max-width: 860px) {
  .look-layout { grid-template-columns: minmax(0, 1fr); }
  .look-preview { position: static; max-width: 320px; }
}
@media (max-width: 960px) {
  /* Small laptops: the PP mark alone, so the save status and buttons keep their room. */
  .brandbox .brand-title { display: none; }
  .layout { grid-template-columns: 172px minmax(0, 1fr); }
  .main { padding: 16px 16px 60px; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .type-grid { grid-template-columns: minmax(0, 1fr); }
  .setting { grid-template-columns: minmax(0, 1fr); }
  .round-grid { grid-template-columns: 1fr 1fr; }
  .round-grid > .field:last-child { grid-column: 1 / -1; }
  .toasts { width: 156px; }
  /* Two rows: the answer (with the remove square at its right), then the test and the value. */
  .cond { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; grid-template-areas: "answer answer remove" "test value value"; }
  .cond > .cond-answer { grid-area: answer; }
  .cond > .cond-test { grid-area: test; }
  .cond > .cond-value { grid-area: value; }
  .cond > .cond-remove { grid-area: remove; }
}
/* Short windows (small laptops): a tighter menu, so every section's button
   stays in view without scrolling the menu. */
@media (max-height: 640px) {
  .nav { padding: 8px 6px; gap: 1px; }
  .nav-btn { padding: 5px 10px; }
  .nav-foot { display: none; }
  .banner { min-height: 40px; }
  .main { padding-top: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app" class="app" hidden>
  <header class="topbar" id="topbar"></header>
  <div id="banner"></div>
  <div class="layout">
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<div id="boot" class="boot" role="status">
  <div class="spinner"></div>
  <div>Loading the control panel&hellip;</div>
</div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ==========================================================================
     PART 1. TALKING TO THE SERVER (the functions in PanelServer.gs)
     --------------------------------------------------------------------------
     Every server step goes through call(), which turns Google's
     google.script.run into a promise and turns Google's error texts into
     plain English. The server itself throws plain-English errors.
     ========================================================================== */

  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var g = window.google;
      if (!g || !g.script || !g.script.run) {
        reject(new Error('This page only works inside the Google Sheet. Open it from the menu Partner Pulse > Open control panel.'));
        return;
      }
      var runner = g.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(friendlyError(err)); });
      if (typeof runner[name] !== 'function') {
        reject(new Error('The script behind this Sheet has no step called "' + name + '". Ask whoever set it up to paste in the latest PanelServer.gs, then open the panel again.'));
        return;
      }
      runner[name].apply(runner, args);
    });
  }

  /* Google's own error texts can be technical. Keep the server's plain-English
     message (it ends with "(Google said: ...)"), and translate the few
     technical ones people actually meet.
     "PERMISSION_DENIED", "reading from storage" and "unable to open the file"
     almost always mean that several Google accounts are signed in and Google
     picked the wrong one. "Specified permissions are not sufficient" means a
     permission was left unticked on Google's permission screen.
     "Authorization is required" can be either: one message gives both, the
     likely one first, in exactly the server's words (Code.gs,
     PP_MSG_AUTHORIZATION_; Pranav's decision, 21 Oct 2026). */
  var MSG_OTHER_ACCOUNT = 'Google may be using another of your accounts. Open the Sheet in a Chrome profile (or an Incognito window) signed in only with your company account, then open the panel again.';
  var MSG_PERMISSIONS = 'Google needs all of Partner Pulse’s permissions: use the Partner Pulse menu again and tick Select all on Google’s permission screen.';
  var MSG_AUTHORIZATION = 'Google says Partner Pulse needs authorization. Usually Google is using another of your Google accounts: open the Sheet in a Chrome profile (or an Incognito window) signed in only with your company account, then try again. If that does not help, a permission was probably left unticked: use the Partner Pulse menu again and tick Select all on Google’s permission screen.';

  /* A message that already says what to do: the panel's own advice above, or
     one the server explained ("(Google said: …)", such as the Drive-access
     and passing-problem messages). Running set-up would not help with those. */
  function hasOwnAdvice(message) {
    var m = String(message || '');
    return /\(Google said: /.test(m) || m === MSG_OTHER_ACCOUNT || m === MSG_PERMISSIONS || m === MSG_AUTHORIZATION ||
      /^Google (could not be reached|needs you to sign in again|took too long)/.test(m);
  }

  function friendlyError(err) {
    var msg = '';
    if (err && typeof err === 'object' && err.message) msg = String(err.message);
    else if (err) msg = String(err);
    msg = msg.replace(/^(Exception|Error|ScriptError|TypeError):\s*/i, '').trim();
    if (!msg) msg = 'Something went wrong on Google’s side. Please try again.';
    if (/\(Google said: /.test(msg)) {
      /* already explained by the server: keep its words */
    } else if (/Specified permissions are not sufficient/i.test(msg)) {
      msg = MSG_PERMISSIONS;
    } else if (/Authori[sz]ation is required/i.test(msg)) {
      msg = MSG_AUTHORIZATION;
    } else if (/PERMISSION_DENIED|reading from storage|unable to open the file/i.test(msg)) {
      msg = MSG_OTHER_ACCOUNT;
    } else if (/NetworkError|HTTP 0|Failed to fetch|network connection|connection failure/i.test(msg)) {
      msg = 'Google could not be reached. Check your internet connection, then try again.';
    } else if (/login required/i.test(msg)) {
      msg = 'Google needs you to sign in again. Close this window, reload the Sheet, then open the control panel again.';
    } else if (/Service invoked too many times|Exceeded maximum execution time|timed out/i.test(msg)) {
      msg = 'Google took too long or is busy right now. Wait a minute, then try again. (Google said: ' + msg + ')';
    }
    return new Error(msg);
  }

  /* ==========================================================================
     PART 2. WHAT THE PANEL REMEMBERS WHILE IT IS OPEN
     ========================================================================== */

  var SECTIONS = [
    { id: 'home', label: 'Home', icon: '🏠' },
    { id: 'questions', label: 'Questions', icon: '📝' },
    { id: 'areas', label: 'Areas & problems', icon: '🧩' },
    { id: 'support', label: 'Support questions', icon: '🎧' },
    { id: 'texts', label: 'Texts & translations', icon: '🌐' },
    { id: 'look', label: 'Look & feel', icon: '🎨' },
    { id: 'rounds', label: 'Rounds', icon: '📅' },
    { id: 'links', label: 'Links', icon: '🔗' },
    { id: 'publish', label: 'Publish', icon: '🚀' },
    { id: 'settings', label: 'Settings', icon: '⚙️' }
  ];

  var S = {
    loaded: false,
    section: 'home',
    revision: null,            // draft revision the panel's copy is based on
    model: null,               // the whole questionnaire (design doc section 4)
    catalog: { settings_schema: [], screen_types: [], form_text_keys: [] },
    live: null,                // { version, config_version, published_at, published_by, note } or null
    liveIds: { screens: [], areas: [], chips: {}, support: [], options: {} },
    codesLocked: true,         // false until the first real round opens: then nothing is locked yet
    draftDiffers: false,       // saved draft differs from the live version
    savedKey: '',              // the questionnaire's content as last saved (contentKey), to spot unsaved content changes
    liveBullets: null,         // { version, keys: { round: bulletsKey } } the live "What changed" bullets, when known
    user: '',
    urls: { sheet: '', folder: '', webApp: '' },
    webAppRecorded: false,     // has someone recorded the web app address (panelSetWebAppUrl)?
    webAppAccess: '',          // 'anyone', or 'domain' (Meesho-only: open only to signed-in colleagues), '' = none
    liveIdsUnknown: false,     // codes are locked but the live version couldn't be read: keep every code locked
    dcCount: 0,
    activeDcCount: 0,
    savedRoundIds: {},         // rounds that exist in the Sheet (not only in this window)
    dirty: false,              // unsaved changes?
    saving: false,
    savingPromise: null,
    changeSeq: 0,              // goes up on every edit
    undo: null,                // { snapshot, seq } for the "Undo" button after a delete
    ui: {
      editing: null,           // Questions: code of the question open in the editor
      openArea: null,          // Areas: code of the area that is open
      texts: { q: '', lang: null, onlyTodo: false },
      lookLang: 'en',
      wcRound: null,           // Rounds: which round's "What changed" is shown
      recentRound: null,       // the round created or opened most recently in this window
      openAfterPublish: null,  // round to offer to open once the draft is published ("Publish first")
      webApp: { editing: false, value: '', error: '' },   // the web app address box (Home, Settings)
      links: { round: null, onlyMissing: true, result: null, search: '' },
      check: null,             // last "Check for problems" result
      history: null,           // published versions, newest first
      historyLoading: false,
      historyFailed: false,
      exportFiles: null,
      counts: {},              // round id -> { loading, data, error }
      publishNote: '',
      lastRule: {},            // screen code -> rule, kept when "Always show it" is picked
      pendingFocus: null       // { test, flash } to show after the next render
    }
  };

  /* ==========================================================================
     PART 3. SMALL HELPERS (building the page, text, dates, downloads)
     ========================================================================== */

  var uid = 0;

  /* h('div', { class: 'x', test: 'name', onClick: fn }, child, child...)
     builds a page element. Text is always added as text (never as HTML), so
     anything typed in the Sheet is shown safely. */
  function h(tag, props) {
    var el = document.createElement(tag);
    var kids = Array.prototype.slice.call(arguments, 2);
    var selectValue;
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === undefined || v === null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'test') el.setAttribute('data-test', v);
        else if (k === 'value' && tag === 'select') selectValue = v;
        else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v === true ? '' : String(v));

    return { screens: arr(x.screens), areas: arr(x.areas), chips: obj(x.chips), support: arr(x.support), options: obj(x.options) };
  }

  var isLive = {
    screen: function (id) { return S.liveIds.screens.indexOf(id) !== -1; },
    area: function (id) { return S.liveIds.areas.indexOf(id) !== -1; },
    chip: function (area, code) { return arr(S.liveIds.chips[area]).indexOf(code) !== -1; },
    support: function (code) { return S.liveIds.support.indexOf(code) !== -1; },
    option: function (screen, code) { return arr(S.liveIds.options[screen]).indexOf(code) !== -1; }
  };

  /* Codes lock only once the first real round has opened (panelLoad's
     codes_locked): from then on partners' answers are stored under them.
     Until then nothing is locked, and a short note in Questions and
     Areas & problems says so. */
  function codesNote() {
    if (S.liveIdsUnknown && !S.live) {
      return h('div', { class: 'callout is-warn small', style: 'margin-bottom:14px', test: 'codes-unpublished-note' },
        h('p', { text: 'A real round has been opened, but nothing has been published yet, so partners get the form’s own copy of the questions, whose codes the panel can’t see. Until you publish, nothing that already exists can be deleted or given a new code.' }));
    }
    if (S.liveIdsUnknown) {
      return h('div', { class: 'callout is-warn small', style: 'margin-bottom:14px', test: 'codes-unknown-note' },
        h('p', { text: 'Google Drive had a passing problem reading the live version, so for now nothing that already exists can be deleted or given a new code. Close the panel and open it again in a minute.' }));
    }
    if (S.codesLocked) return null;
    return h('div', { class: 'callout is-info small', style: 'margin-bottom:14px', test: 'codes-unlocked-note' },
      h('p', { text: 'Codes lock when the first real round opens, so rounds stay comparable. Until then you can delete or rename anything. Test rounds (names starting with SMOKE, DEMO or TEST) never lock them.' }));
  }
  /* Until when a new code can still be changed (shown under "Code in the data"). */
  function codeChangeHint() {
    return S.codesLocked ? 'you can change it until you publish' : 'you can change it until the first real round opens';
  }
  /* Test rounds (id starting with SMOKE, DEMO or TEST, in capitals or not)
     never lock the codes: the same rule as the server (Code.gs, PP_isTestRound_). */
  function isTestRound(id) { return /^(SMOKE|DEMO|TEST)/i.test(String(id || '')); }

  /* Two questions fill their own columns of every round's answers sheet:
     their codes never change and they can't be deleted, only hidden
     (Pranav's decision, 21 Oct 2026; Model.gs PP_mdlCheckDataColumns_ warns
     if one goes missing anyway). */
  var DATA_COLUMN_SCREENS = { nps: 'nps', support_gate: 'support_contacted' };
  function isDataColumnScreen(id) { return Object.prototype.hasOwnProperty.call(DATA_COLUMN_SCREENS, id); }

  /* Every code of a questionnaire, shaped like panelLoad's live_ids. Used to
     keep everything locked while the live version can't be read
     (panelLoad's live_ids_unknown). */
  function idsOfModel(m) {
    var out = { screens: [], areas: [], chips: {}, support: [], options: {} };
    arr(m.screens).forEach(function (s) { out.screens.push(s.id); if (arr(s.options).length) out.options[s.id] = arr(s.options).slice(); });
    arr(m.areas).forEach(function (a) { out.areas.push(a.id); });
    arr(m.chips).forEach(function (c) { (out.chips[c.area] = out.chips[c.area] || []).push(c.code); });
    arr(m.support).forEach(function (s) { out.support.push(s.code); });
    return out;
  }

  /* ---- Settings ------------------------------------------------------------ */

  function schemaFor(key) {
    var list = S.catalog.settings_schema;
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return null;
  }
  function settingRaw(key) {
    var v = M().settings[key];
    if (v === undefined || v === null) { var sc = schemaFor(key); return sc ? sc.default : v; }
    return v;
  }
  function settingNum(key, fallback) {
    var v = Number(settingRaw(key));
    return isNaN(v) || settingRaw(key) === '' ? fallback : v;
  }
  function settingBool(key) { return settingRaw(key) === true; }
  function setSetting(key, value) { M().settings[key] = value; changed(); }
  function settingLabel(key) {
    var sc = schemaFor(key);
    if (sc && sc.label) return String(sc.label);   // the catalogue's own wording
    if (SETTING_LABELS[key]) return SETTING_LABELS[key];
    var last = key.split('.').pop().replace(/_/g, ' ');
    return last.charAt(0).toUpperCase() + last.slice(1);
  }
  function listText(v) { return Array.isArray(v) ? v.join(', ') : str(v); }

  function facesList() {
    var v = settingRaw('rating.faces');
    var list = Array.isArray(v) ? v.map(str) : str(v).trim().split(/\s+/);
    while (list.length < 5) list.push('');
    return list.slice(0, 5);
  }
  function setFaces(list) {
    var orig = M().settings['rating.faces'];
    var clean = list.map(function (f) { return str(f).trim(); });
    M().settings['rating.faces'] = Array.isArray(orig) ? clean : clean.join(' ');
    changed();
  }

  /* ---- Languages ------------------------------------------------------------ */

  function activeLangs() { return M().languages.filter(function (l) { return l.active && l.code; }); }
  function englishName(code) { return LANGUAGE_NAMES[code] || code; }
  function langLabel(L) {
    var en = englishName(L.code);
    if (!L.native_name || L.native_name === en) return en;
    return L.native_name + ' · ' + en;
  }
  function langByCode(code) {
    var all = M().languages;
    for (var i = 0; i < all.length; i++) if (all[i].code === code) return all[i];
    return null;
  }
  function fallbackLang() { return str(settingRaw('fallback_language')) || 'en'; }
  function defaultLang() { return str(settingRaw('default_language')) || 'en'; }
  function secondLang() {
    var langs = activeLangs();
    var hi = langs.filter(function (l) { return l.code === 'hi'; })[0];
    return hi || langs.filter(function (l) { return l.code !== 'en'; })[0] || null;
  }

  /* ---- Texts ----------------------------------------------------------------- */

  function textValue(key, code) {
    var row = M().texts[key];
    return row && row[code] !== undefined && row[code] !== null ? String(row[code]) : '';
  }
  function isTodo(v) { v = str(v).trim(); return !v || v.indexOf(TRANSLATE_TAG) === 0; }
  function en(key) { return textValue(key, 'en'); }
  /* What partners see in a language: the translation, or the English. */
  function shown(key, code) { var v = textValue(key, code); return isTodo(v) ? en(key) : v; }
  function placeholders(text) { return (str(text).match(PLACEHOLDER_RE) || []).slice().sort().join(' '); }

  function setText(key, code, value) {
    if (!M().texts[key]) addTextKey(key, {});
    M().texts[key][code] = value;
  }

  /* Adds a text, placed after the last text with the same beginning, so the
     Texts tab in the Sheet stays tidy. */
  function addTextKey(key, values, nearPrefix) {
    var texts = M().texts;
    if (texts[key]) { Object.assign(texts[key], values || {}); return; }
    var row = {};
    M().languages.forEach(function (l) { row[l.code] = ''; });
    Object.assign(row, values || {});
    var keys = Object.keys(texts);
    var after = -1;
    var prefix = nearPrefix || key.replace(/\.[^.]*$/, '.');
    keys.forEach(function (k, i) { if (k.indexOf(prefix) === 0) after = i; });
    if (after === -1 || after === keys.length - 1) {
      texts[key] = row;
    } else {
      var rebuilt = {};
      keys.forEach(function (k, i) { rebuilt[k] = texts[k]; if (i === after) rebuilt[key] = row; });
      M().texts = rebuilt;
    }
    if (M().text_notes[key] === undefined) M().text_notes[key] = '';
  }

  function removeTextKey(key) {
    delete M().texts[key];
    delete M().text_notes[key];
    delete M().clips[key];
  }

  /* Renames a text everywhere it is stored (keeping its place in the list). */
  function renameTextKey(oldKey, newKey) {
    if (oldKey === newKey || !M().texts[oldKey] || M().texts[newKey]) return false;
    ['texts', 'text_notes', 'clips'].forEach(function (part) {
      var src = M()[part];
      if (!(oldKey in src)) return;
      var rebuilt = {};
      Object.keys(src).forEach(function (k) { rebuilt[k === oldKey ? newKey : k] = src[k]; });
      M()[part] = rebuilt;
    });
    return true;
  }

  /* All the texts the settings and questionnaire need (design doc section 6). */
  function neededTextKeys() {
    var m = M(), need = {};
    m.areas.forEach(function (a) {
      if (!a.active) return;
      need['fn.' + a.id + '.name'] = true; need['fn.' + a.id + '.help'] = true;
    });
    m.chips.forEach(function (c) { if (c.active) need['issue.' + c.area + '.' + c.code] = true; });
    m.support.forEach(function (s) { if (s.active) need['support.' + s.code] = true; });
    if (settingBool('support.allow_not_applicable')) need['support.not_applicable'] = true;
    if (settingBool('support.allow_comment') && settingRaw('support.comment_text')) need[str(settingRaw('support.comment_text'))] = true;
    m.screens.forEach(function (s) {
      if (!s.active) return;
      ['text', 'low_label', 'high_label', 'scale_hint', 'body'].forEach(function (f) { if (s[f]) need[s[f]] = true; });
      if (s.type === 'single_choice') s.options.forEach(function (o) { need['choice.' + s.id + '.' + o] = true; });
    });
    arr(S.catalog.form_text_keys).forEach(function (k) { need[k] = true; });
    return need;
  }

  /* ---- New codes ("slug" rule, design doc section 6) ------------------------ */

  /* Turns English words into a code: lower case, anything else becomes "_",
     at most 40 characters, a letter in front if it starts with a digit, and
     _2, _3 ... added when the code is already taken. */
  function slug(text, taken, fallback) {
    var s = str(text).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    s = s.slice(0, 40).replace(/_+$/, '');
    if (/^[0-9]/.test(s)) s = 'n' + s;
    if (!s) s = fallback || 'item';
    var out = s, n = 2;
    while (taken[out]) { out = s + '_' + n; n++; }
    return out;
  }
  function takenSet(list) { var t = {}; list.forEach(function (x) { t[x] = true; }); return t; }
  function takenScreenIds() {
    var t = takenSet(M().screens.map(function (s) { return s.id; }));
    t.support_comment = true;   // reserved: it means "the comment under the support ratings"
    Object.keys(M().texts).forEach(function (k) {
      var m = /^q\.([a-z0-9_]+)(\.|$)/.exec(k) || /^choice\.([a-z0-9_]+)\./.exec(k);
      if (m) t[m[1]] = true;    // q.<code> or choice.<code>.* already used by another text
    });
    return t;
  }
  function takenAreaIds() {
    var t = takenSet(M().areas.map(function (a) { return a.id; }));
    Object.keys(M().texts).forEach(function (k) { var m = /^(fn|issue)\.([a-z0-9_]+)\./.exec(k); if (m) t[m[2]] = true; });
    return t;
  }
  function takenChipCodes(area) {
    var t = takenSet(M().chips.filter(function (c) { return c.area === area; }).map(function (c) { return c.code; }));
    t.other = true;   // "Other" is added by the form itself
    Object.keys(M().texts).forEach(function (k) { if (k.indexOf('issue.' + area + '.') === 0) t[k.slice(('issue.' + area + '.').length)] = true; });
    return t;
  }
  function takenSupportCodes() {
    var t = takenSet(M().support.map(function (s) { return s.code; }));
    t.not_applicable = true;  // support.not_applicable is the "Doesn't apply" label
    Object.keys(M().texts).forEach(function (k) { if (k.indexOf('support.') === 0) t[k.slice(8)] = true; });
    return t;
  }
  function takenOptionCodes(s) {
    var t = takenSet(s.options);
    Object.keys(M().texts).forEach(function (k) { if (k.indexOf('choice.' + s.id + '.') === 0) t[k.slice(('choice.' + s.id + '.').length)] = true; });
    return t;
  }

  /* ---- Screens, areas, chips, support ---------------------------------------- */

  function typeInfo(type) {
    var list = arr(S.catalog.screen_types), found = null;
    for (var i = 0; i < list.length; i++) if (list[i].type === type) found = list[i];
    var fb = TYPE_FALLBACK[type] || { label: type || 'Unknown screen', description: '', builtin: false, needs_text: true, fields: [] };
    var out = Object.assign({}, fb, found || {});
    out.fields = arr(found && found.fields ? found.fields : fb.fields);
    out.icon = TYPE_ICON[type] || '❓';
    return out;
  }
  function allTypes() {
    var seen = {}, out = [];
    arr(S.catalog.screen_types).forEach(function (t) { if (!seen[t.type]) { seen[t.type] = true; out.push(t.type); } });
    TYPE_ORDER.forEach(function (t) { if (!seen[t]) { seen[t] = true; out.push(t); } });
    out.sort(function (a, b) {
      var ia = TYPE_ORDER.indexOf(a), ib = TYPE_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    return out;
  }
  function findScreen(id) { return M().screens.filter(function (s) { return s.id === id; })[0] || null; }
  function screenPos(id) {
    var list = M().screens;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return i;
    return -1;
  }
  function firstOfType(type) { return M().screens.filter(function (s) { return s.type === type; })[0] || null; }
  function hasRequired(s) { return typeInfo(s.type).fields.indexOf('required') !== -1; }
  /* Blank "required" means the type's standard: the catalogue's required_default,
     or (if it has none) free text optional and everything else required. */
  function effectiveRequired(s) {
    if (typeof s.required === 'boolean') return s.required;
    var std = typeInfo(s.type).required_default;
    return typeof std === 'boolean' ? std : s.type !== 'free_text';
  }

  function areaById(id) { return M().areas.filter(function (a) { return a.id === id; })[0] || null; }
  function areaName(id) { return en('fn.' + id + '.name') || id; }
  function chipsOf(area) { return M().chips.filter(function (c) { return c.area === area; }); }
  function activeChips(area) { return chipsOf(area).filter(function (c) { return c.active; }); }
  function chipLabel(area, code) { return code === 'other' ? (en('issue.other') || 'Other') : (en('issue.' + area + '.' + code) || code); }
  function supportLabel(code) { return en('support.' + code) || code; }
  function optionLabel(screen, code) { return en('choice.' + screen + '.' + code) || code; }
  function faceLabel(n) { return en('rating.' + n); }
  function standardThreshold() { return settingNum('deep_dive.threshold', 3); }

  /* What a question says in English (or a plain description for built-ins). */
  function screenEnglish(s) {
    if (s.text && en(s.text)) return en(s.text);
    if (s.type === 'thank_you') return en('thanks.title') || 'Thank you!';
    if (s.type === 'language_picker') return en('lang.title') || 'Choose your language';
    if (s.type === 'whats_changed') return en('wc.title') || 'What changed';
    if (s.type === 'function_ratings') return en('q.fn_rating') || 'Rating of each area';
    if (s.type === 'function_deep_dives') return en('q.deep_dive') || 'What is the main problem?';
    return '';
  }

  /* Every place a rule ("show this question only if") tests an answer. */
  function forEachCondition(fn) {
    M().screens.forEach(function (s) { walkRule(s.show_if, fn); });
  }
  function walkRule(rule, fn) {
    if (!rule || typeof rule !== 'object') return;
    if (Array.isArray(rule.all)) rule.all.forEach(function (r) { walkRule(r, fn); });
    if (Array.isArray(rule.any)) rule.any.forEach(function (r) { walkRule(r, fn); });
    if (typeof rule.answer === 'string') fn(rule);
  }
  /* The questions whose rule tests an answer. short = numbers only (for messages). */
  function rulesUsing(match, short) {
    var names = [];
    M().screens.forEach(function (s, i) {
      var uses = false;
      walkRule(s.show_if, function (c) { if (match(c.answer)) uses = true; });
      if (uses) names.push(short ? 'question ' + (i + 1) : quote(shorten(screenEnglish(s) || typeInfo(s.type).label, 50)) + ' (question ' + (i + 1) + ')');
    });
    return names;
  }
  /* Changes answer values inside rules (used when a chip or option code changes). */
  function renameRuleValue(answer, oldCode, newCode) {
    forEachCondition(function (c) {
      if (c.answer !== answer) return;
      ['equals', 'not_equals'].forEach(function (t) { if (c[t] === oldCode) c[t] = newCode; });
      if (Array.isArray(c['in'])) c['in'] = c['in'].map(function (v) { return v === oldCode ? newCode : v; });
    });
  }

  /* ---- Changes and "Unsaved changes" ------------------------------------------- */

  function changed(o) {
    S.dirty = true;
    S.changeSeq++;
    rememberUnsaved();
    if (S.undo && S.undo.seq !== S.changeSeq) {   // another change: Undo no longer applies
      if (S.undo.remove) S.undo.remove();
      S.undo = null;
    }
    updateChrome();
    if (o && o.rerender) renderMain(true);
  }

  function snapshot() { return clone(M()); }

  /* After a delete: a message with an Undo button (until the next change). */
  function offerUndo(snap, message) {
    S.undo = { snapshot: snap, seq: S.changeSeq };
    S.undo.remove = toast(message, {
      action: {
        label: 'Undo', test: 'toast-undo', onClick: function () {
          if (!S.undo || S.undo.seq !== S.changeSeq) {
            toast('Undo is no longer possible: you changed other things since.', { kind: 'info' });
            return;
          }
          S.model = S.undo.snapshot;
          S.undo = null;
          changed({ rerender: true });
          toast('Undone.', { kind: 'ok' });
        }
      }
    });
  }

  /* ---- A recovery copy of unsaved changes (this computer only) ------------------
     Closing the panel window with its X can't be stopped, so unsaved changes
     are also kept in this browser. The next time the panel opens it offers to
     bring them back, but only if nobody saved the draft in the meantime
     (otherwise they could overwrite someone else's work). The copy holds the
     questionnaire only: no partner data. */

  var recoveryTimer = null;
  function recoveryKey() { return 'pp-unsaved:' + (S.urls.sheet || 'sheet'); }
  function rememberUnsaved() {
    clearTimeout(recoveryTimer);
    recoveryTimer = setTimeout(function () {
      if (!S.dirty || !S.model) return;
      try {
        localStorage.setItem(recoveryKey(), JSON.stringify({ revision: S.revision, at: new Date().toISOString(), model: S.model }));
      } catch (e) { /* storage may be blocked or full: the panel works without it */ }
    }, 800);
  }
  function forgetUnsaved() {
    clearTimeout(recoveryTimer);
    try { localStorage.removeItem(recoveryKey()); } catch (e) { /* nothing to forget */ }
  }
  function readUnsaved() {
    try {
      var raw = localStorage.getItem(recoveryKey());
      var copy = raw ? JSON.parse(raw) : null;
      return copy && copy.model ? copy : null;
    } catch (e) { return null; }
  }

  /* On start: offer to bring back unsaved changes from the last visit. */
  function offerRecovery() {
    var copy = readUnsaved();
    if (!copy) return;
    var model = normaliseModel(copy.model);
    if (JSON.stringify(model) === JSON.stringify(M())) { forgetUnsaved(); return; }   // nothing different
    if (copy.revision !== S.revision) {
      forgetUnsaved();
      toast('Your unsaved changes from last time were dropped, because someone saved the draft since.', { kind: 'info', timeout: 9000 });
      return;
    }
    openModal({
      title: 'Bring back your unsaved changes?', test: 'recovery-modal', dismissible: false,
      body: [h('p', { text: 'Last time (' + fmtDate(copy.at, true) + ') the control panel was closed before your changes were saved. They are still on this computer.' }),
        h('p', { class: 'help', text: 'Bring them back to continue where you left off, then press Save. Or throw them away to start from the saved draft.' })],
      buttons: [
        { label: 'Throw them away', test: 'recovery-discard', onClick: function (c) { c(); forgetUnsaved(); toast('Unsaved changes thrown away.', { kind: 'ok' }); } },
        { label: 'Bring them back', kind: 'primary', test: 'recovery-restore', onClick: function (c) {
          c();
          S.model = model;
          changed({ rerender: true });
          renderTopbar();
          toast('Your changes are back. Press Save to keep them.', { kind: 'ok', timeout: 7000 });
        } }
      ]
    });
  }

  /* ==========================================================================
     PART 5. "SHOW THIS QUESTION ONLY IF..." RULES
     --------------------------------------------------------------------------
     A rule tests earlier answers, for example
       { "answer": "support_gate", "equals": "yes" }
       { "any": [ { "answer": "nps", "at_most": 6 }, { "answer": "fn_rating:payments", "in": [1, 2] } ] }
     The panel shows each rule as a sentence and edits simple ones (one
     condition, or a list joined by "all of these" / "any of these").
     ========================================================================== */

  var TEST_LABELS = {
    equals: 'is', not_equals: 'is not', at_most: 'is at most', at_least: 'is at least',
    'in': 'is one of', answered: 'was answered', not_answered: 'was not answered'
  };
  var TESTS_FOR = {
    number: ['equals', 'not_equals', 'at_most', 'at_least', 'in', 'answered', 'not_answered'],
    choice: ['equals', 'not_equals', 'in', 'answered', 'not_answered'],
    text: ['answered', 'not_answered']
  };

  function numberAnswer(ref, label, subject, min, max, o) {
    o = o || {};
    var values = [];
    for (var n = min; n <= max; n++) {
      var lab = o.faces ? n + ' (' + (faceLabel(n) || n) + ')' : String(n);
      values.push({ v: n, label: lab });
    }
    if (o.na) values.push({ v: 'na', label: o.na });
    return { ref: ref, label: label, subject: subject, asked: subject, kind: 'number', values: values, min: min, max: max, group: o.group };
  }
  function choiceAnswer(ref, label, subject, values, group) {
    return { ref: ref, label: label, subject: subject, asked: subject, kind: 'choice', values: values, group: group };
  }
  function textAnswer(ref, label, asked, group) {
    return { ref: ref, label: label, subject: asked, asked: asked, kind: 'text', values: [], group: group };
  }

  /* The answer(s) a screen produces, whatever its position. */
  function answersOfScreen(s, includeDives) {
    var out = [];
    var q = shorten(screenEnglish(s) || s.id, 48);
    var naArea = settingBool('rating.allow_not_applicable') ? (en('rating.na') || 'I don’t handle this') : null;
    var naSupport = settingBool('support.allow_not_applicable') ? (en('support.not_applicable') || 'Doesn’t apply') : null;
    switch (s.type) {
      case 'nps_0_10':
        out.push(numberAnswer(s.id, q, 'the answer to ' + quote(q), 0, 10, { group: 'Questions' })); break;
      case 'rating_1_5':
        out.push(numberAnswer(s.id, q, 'the answer to ' + quote(q), 1, 5, { faces: true, group: 'Questions' })); break;
      case 'yes_no':
        out.push(choiceAnswer(s.id, q, 'the answer to ' + quote(q), [{ v: 'yes', label: en('ui.yes') || 'Yes' }, { v: 'no', label: en('ui.no') || 'No' }], 'Questions')); break;
      case 'single_choice':
        out.push(choiceAnswer(s.id, q, 'the answer to ' + quote(q), s.options.map(function (o) { return { v: o, label: optionLabel(s.id, o) }; }), 'Questions')); break;
      case 'free_text':
        out.push(textAnswer(s.id, q + ' (typed or recorded)', 'the question ' + quote(q), 'Questions')); break;
      case 'function_ratings':
        M().areas.forEach(function (a) {
          if (!a.active) return;
          out.push(numberAnswer('fn_rating:' + a.id, 'Rating of ' + areaName(a.id), 'the rating of ' + areaName(a.id), 1, 5, { faces: true, na: naArea, group: 'Area ratings' }));
        });
        if (includeDives) out = out.concat(diveAnswers());
        break;
      case 'function_deep_dives':
        if (includeDives) out = out.concat(diveAnswers());
        break;
      case 'support_block':
        M().support.forEach(function (it) {
          if (!it.active) return;
          out.push(numberAnswer('support:' + it.code, 'Support: ' + supportLabel(it.code), 'the support rating ' + quote(supportLabel(it.code)), 1, 5, { faces: true, na: naSupport, group: 'Support' }));
        });
        if (settingBool('support.allow_comment')) out.push(textAnswer('support_comment', 'Support comment (typed or recorded)', 'the support comment', 'Support'));
        break;
    }
    return out;
  }
  function diveAnswers() {
    return M().areas.filter(function (a) { return a.active; }).map(function (a) {
      var values = activeChips(a.id).map(function (c) { return { v: c.code, label: chipLabel(a.id, c.code) }; });
      values.push({ v: 'other', label: chipLabel(a.id, 'other') });
      return choiceAnswer('fn_deep_dive:' + a.id, 'Main problem in ' + areaName(a.id), 'the main problem picked in ' + areaName(a.id), values, 'Main problems');
    });
  }

  /* Answers a question at position idx may test: only earlier, switched-on
     screens (the same rule as the server's check). */
  function availableAnswers(idx) {
    var out = [], ratingsSeen = false;
    var immediate = settingRaw('deep_dive.when') === 'immediate';
    M().screens.slice(0, idx).forEach(function (s) {
      if (!s.active) return;
      if (s.type === 'function_ratings') {
        ratingsSeen = true;
        out = out.concat(answersOfScreen(s, immediate));
      } else if (s.type === 'function_deep_dives') {
        if (!immediate && ratingsSeen) out = out.concat(answersOfScreen(s, true));
      } else {
        out = out.concat(answersOfScreen(s, false));
      }
    });
    return out;
  }

  /* Describe any answer, even one that is not allowed where it is used. */
  function describeAnswer(ref) {
    var all = [];
    M().screens.forEach(function (s) { all = all.concat(answersOfScreen(s, s.type !== 'function_deep_dives' ? false : true)); });
    all = all.concat(diveAnswers());
    for (var i = 0; i < all.length; i++) if (all[i].ref === ref) return all[i];
    return null;
  }

  function valueLabel(ans, v) {
    if (ans) {
      for (var i = 0; i < ans.values.length; i++) if (String(ans.values[i].v) === String(v)) {
        return ans.kind === 'number' ? ans.values[i].label : quote(ans.values[i].label);
      }
    }
    return quote(str(v));
  }

  function simpleCondition(o) {
    if (!o || typeof o !== 'object' || Array.isArray(o) || typeof o.answer !== 'string') return null;
    var tests = Object.keys(o).filter(function (k) { return k !== 'answer'; });
    if (tests.length !== 1) return null;
    var t = tests[0];
    if (t === 'answered') return { answer: o.answer, test: o.answered === false ? 'not_answered' : 'answered', value: null };
    if (['equals', 'not_equals', 'at_most', 'at_least', 'in'].indexOf(t) === -1) return null;
    return { answer: o.answer, test: t, value: o[t] };
  }

  /* Turns a stored rule into what the builder edits. */
  function parseRule(rule) {
    if (!rule) return { mode: 'always', combine: 'all', conds: [] };
    var keys = Object.keys(rule);
    if ((Array.isArray(rule.all) || Array.isArray(rule.any)) && keys.length === 1) {
      var combine = Array.isArray(rule.all) ? 'all' : 'any';
      var conds = rule[combine].map(simpleCondition);
      if (!conds.length || conds.some(function (c) { return !c; })) return { mode: 'complex' };
      return { mode: 'rules', combine: combine, conds: conds };
    }
    var one = simpleCondition(rule);
    return one ? { mode: 'rules', combine: 'all', conds: [one] } : { mode: 'complex' };
  }

  function conditionObject(c) {
    var o = { answer: c.answer };
    if (c.test === 'answered') o.answered = true;
    else if (c.test === 'not_answered') o.answered = false;
    else o[c.test] = c.value;
    return o;
  }
  function buildRule(p) {
    if (p.mode !== 'rules' || !p.conds.length) return null;
    var list = p.conds.map(conditionObject);
    if (list.length === 1) return list[0];
    var r = {};
    r[p.combine] = list;
    return r;
  }

  function conditionSentence(c) {
    var ans = describeAnswer(c.answer);
    var subject = ans ? ans.subject : quote(c.answer);
    switch (c.test) {
      case 'equals': return subject + ' is ' + valueLabel(ans, c.value);
      case 'not_equals': return subject + ' is not ' + valueLabel(ans, c.value);
      case 'at_most': return subject + ' is ' + valueLabel(ans, c.value) + ' or lower';
      case 'at_least': return subject + ' is ' + valueLabel(ans, c.value) + ' or higher';
      case 'in': return subject + ' is ' + joinWith(arr(c.value).map(function (v) { return valueLabel(ans, v); }), 'or');
      case 'answered': return (ans ? ans.asked : subject) + ' was answered';
      case 'not_answered': return (ans ? ans.asked : subject) + ' was not answered';
    }
    return subject;
  }

  /* Any rule as a sentence (also the hand-written, nested ones). */
  function ruleSentence(rule) {
    if (!rule || typeof rule !== 'object') return '';
    if (rule.unreadable) return 'a rule that could not be read (' + shorten(rule.unreadable, 40) + ')';
    if (Array.isArray(rule.all) || Array.isArray(rule.any)) {
      var all = Array.isArray(rule.all);
      var parts = (all ? rule.all : rule.any).map(function (r) {
        var s = ruleSentence(r);
        return (Array.isArray(r.all) || Array.isArray(r.any)) ? '(' + s + ')' : s;
      });
      return joinWith(parts, all ? 'and' : 'or');
    }
    var c = simpleCondition(rule);
    return c ? conditionSentence(c) : 'a rule the form doesn’t understand';
  }

  /* Which answers in this screen's rule can't work where the screen is now. */
  function ruleProblems(s, idx) {
    if (!s.show_if) return [];
    var ok = {};
    availableAnswers(idx).forEach(function (a) { ok[a.ref] = true; });
    var bad = [];
    walkRule(s.show_if, function (c) { if (!ok[c.answer] && bad.indexOf(c.answer) === -1) bad.push(c.answer); });
    if (s.show_if.unreadable) bad.push('(unreadable rule)');
    return bad;
  }
  function problemText(ref, idx) {

    return 'It tests ' + ans.subject + ', which comes later or is hidden. Pick another answer, or move this question further down.';
  }
