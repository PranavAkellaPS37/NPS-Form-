    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveWebAppUrl(input.value, prefix); } });
    var err = h('div', { class: 'field-error', test: prefix + '-error', role: 'alert', text: st.error });
    return h('div', { class: 'field', test: prefix + '-field' }, label,
      h('div', { class: 'help', text: 'After deploying the web app, paste its address here. The GitHub copy of the questionnaire then points the form at it.' }),
      h('div', { class: 'link-box' }, input,
        btn('Check and save', prefix + '-save', function () { saveWebAppUrl(input.value, prefix); }, { small: true, kind: 'primary' }),
        st.editing ? btn('Cancel', prefix + '-cancel', function () { st.editing = false; st.value = ''; st.error = ''; renderMain(true); }, { small: true, kind: 'ghost' }) : null),
      err);
  }

  /* Meesho-only mode (21 Oct 2026): the web app is open only to people signed
     in with a company account, so it serves the survey itself (Code.gs,
     PP_formPage_) and links point at it (PanelServer.gs, PP_linkBaseUrl_). */
  function meeshoOnlyNote(test) {
    return h('div', { class: 'callout is-warn small', test: test }, h('p', { text: 'Meesho-only: the web app is open only to people signed in with a company account. Links and Preview open the survey through the web app, so colleagues can try it; partners can’t use it yet. (If colleagues can’t open it, check that “Who has access” is “Anyone within …” your company, not “Only myself”.) When “Who has access” becomes “Anyone” (Deploy > Manage deployments), click Change, then Check and save again: links go back to the form’s own address.' }));
  }

  function saveWebAppUrl(value, prefix) {
    var st = S.ui.webApp;
    var url = str(value).trim();
    st.value = url;
    var again = { test: prefix + '-field', focusTest: prefix + '-input', flash: false };
    if (!url) {
      st.error = 'Paste the web app address first. It starts with https:// and ends with /exec.';
      S.ui.pendingFocus = again;
      renderMain(true);
      return;
    }
    st.error = '';
    withBusy('Checking the web app address…', function () { return call('panelSetWebAppUrl', url); }).then(function (res) {
      S.urls.webApp = str(obj(res).web_app_url) || url;
      S.webAppRecorded = true;
      var wasAccess = S.webAppAccess;
      S.webAppAccess = str(obj(res).web_app_access) === 'domain' ? 'domain' : 'anyone';
      /* Files prepared for the GitHub copy before this carry the old address (or
         test mode): they must be prepared again (21 Oct review). */
      S.ui.exportFiles = null;
      S.ui.exportWarning = '';
      st.editing = false; st.value = ''; st.error = '';
      renderMain(true);
      if (S.webAppAccess === 'domain') {
        toast('Saved as Meesho-only: colleagues signed in with a company account can open the survey through the web app. Check that “Who has access” is “Anyone within …” your company, not “Only myself”. Make the links again (Links) so they point at it.', { kind: 'ok', timeout: 10000 });
      } else if (wasAccess === 'domain') {
        toast('Web app address saved: it is open to anyone now. Make the links again (Links) so they point at the form’s own address, and refresh the GitHub copy.', { kind: 'ok', timeout: 9000 });
      } else {
        toast('Web app address saved. The GitHub copy (Publish > Backup copy in GitHub) now uses it.', { kind: 'ok', timeout: 6000 });
      }
    }, function (e) {
      st.error = e.message;   // the server's plain-English reason, shown under the box
      S.ui.pendingFocus = again;
      renderMain(true);
    });
  }

  /* ---- Round numbers (loaded only when needed, they can take a few seconds) -- */

  function countsView(id) {
    var box = h('span', { class: 'counts', 'data-counts-for': id, test: 'counts-' + id });
    fillCounts(box, id);
    return box;
  }

  function fillCounts(box, id) {
    var c = S.ui.counts[id];
    box.textContent = '';
    if (!S.savedRoundIds[id]) {   // the server doesn't know this round until it is saved
      appendKids(box, [h('span', { class: 'small muted', text: 'Save first to see numbers.' })]);
      return;
    }
    if (!c) {
      appendKids(box, [btn('Show numbers', 'counts-load-' + id, function () { loadCounts(id); }, { small: true, kind: 'ghost' })]);
      return;
    }
    if (c.loading) { appendKids(box, [h('span', { class: 'spinner is-small' }), h('span', { class: 'muted', text: 'Counting…' })]); return; }
    if (c.error) {
      appendKids(box, [h('span', { class: 'field-error', text: c.error }), btn('Try again', 'counts-load-' + id, function () { loadCounts(id); }, { small: true, kind: 'ghost' })]);
      return;
    }
    var d = obj(c.data);
    var links = Number(d.links) || 0, sub = Number(d.submitted) || 0;
    var parts = [
      [fmtNum(links), plural(links, 'link').replace(/^\d+ /, '')],
      [fmtNum(d.opened), 'opened'], [fmtNum(d.started), 'started'], [fmtNum(sub), 'sent answers']
    ];
    parts.forEach(function (p, i) {
      if (i) box.appendChild(h('span', { class: 'sep', text: '·' }));
      box.appendChild(h('span', null, h('span', { class: 'num', text: p[0] }), ' ', p[1]));
    });
    if (links) box.appendChild(h('span', { class: 'badge badge-req', text: Math.round(100 * sub / links) + '% answered' }));
    var langs = Object.keys(obj(d.by_lang)).filter(function (k) { return d.by_lang[k]; });
    var extra = [];
    if (langs.length) extra.push(langs.map(function (k) { return englishName(k) + ' ' + fmtNum(d.by_lang[k]); }).join(', '));
    if (d.last_submission_at) extra.push('last answer ' + fmtDate(d.last_submission_at, true));
    box.appendChild(btn('Refresh', 'counts-load-' + id, function () { loadCounts(id); }, { small: true, kind: 'ghost' }));
    if (extra.length) box.appendChild(h('span', { class: 'small muted', style: 'flex-basis:100%', text: extra.join(' · ') }));
  }

  function loadCounts(id) {
    S.ui.counts[id] = { loading: true };
    updateCountsUI(id);
    call('panelRoundCounts', id).then(function (d) {
      S.ui.counts[id] = { data: d };
      updateCountsUI(id);
    }, function (e) {
      S.ui.counts[id] = { error: e.message };
      updateCountsUI(id);
    });
  }

  function updateCountsUI(id) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-counts-for]'), function (el) {
      if (el.getAttribute('data-counts-for') === id) fillCounts(el, id);
    });
  }

  /* Numbers for open rounds and the three newest ones load by themselves. */
  function autoLoadCounts() {
    var rounds = M().rounds;
    rounds.forEach(function (r, i) {
      if (S.ui.counts[r.id] || !S.savedRoundIds[r.id]) return;
      if (r.status === 'open' || i >= rounds.length - 3) loadCounts(r.id);
    });
  }

  /* ==========================================================================
     PART 8. QUESTIONS: the list, the editor and "Add a question"
     ========================================================================== */

  VIEWS.questions = function () {
    if (S.ui.editing !== null) {
      var s = findScreen(S.ui.editing);
      if (s) return screenEditor(s);
      S.ui.editing = null;
    }
    var screens = M().screens;
    return [
      sectionHead('Questions', 'Every screen partners go through, in order. Changes reach partners after you save and publish.',
        btn('Add a question', 'add-question', addQuestionFlow, { kind: 'primary', icon: '+' })),
      codesNote(),
      screens.length
        ? h('div', { class: 'qlist' }, screens.map(screenCard))
        : emptyState('No questions yet', 'Start from the questionnaire stored in GitHub (Settings > Import from GitHub), or add questions one by one.',
          btn('Add a question', 'add-question-empty', addQuestionFlow, { kind: 'primary' }))
    ];
  };

  function screenCard(s, i) {
    var t = typeInfo(s.type);
    var screens = M().screens;
    var isThanks = s.type === 'thank_you';
    var next = screens[i + 1];
    var canUp = !isThanks && i > 0;
    var canDown = !isThanks && i < screens.length - 1 && !(next && next.type === 'thank_you');
    var second = secondLang();
    var english = cardEnglish(s, t);
    var secondText = s.text && second && !isTodo(textValue(s.text, second.code)) ? textValue(s.text, second.code) : '';
    var problems = ruleProblems(s, i);

    var badges = [];
    if (t.builtin) badges.push(badge('Built-in', null, null, 'Part of every questionnaire: it can be hidden but not deleted.'));
    if (hasRequired(s)) badges.push(effectiveRequired(s) ? badge('Required', 'req') : badge('Optional (Skip button)', null));
    if (s.show_if) badges.push(badge('Only if ' + ruleSentence(s.show_if), 'rule', 'screen-rule-' + s.id));
    if (problems.length) badges.push(badge('⚠ The rule tests a later or hidden answer: edit it', 'error', 'screen-rule-problem-' + s.id, problemText(problems[0], i)));
    if (s.skip_if === 'lang_in_url') badges.push(badge('Skipped when the link already says the language', null));
    if (s.skip_if === 'empty') badges.push(badge('Skipped when there is nothing to show', null));
    if (!s.active) badges.push(badge('Hidden: partners don’t see it', 'hidden'));

    var actions = [
      canUp ? btn('', 'screen-up-' + s.id, function () { moveScreen(i, -1); }, { small: true, icon: '↑', aria: 'Move up', title: 'Move up' })
        : lockedBtn('↑', 'screen-up-' + s.id, isThanks ? 'The thank-you screen always stays last.' : 'This is already the first screen.'),
      canDown ? btn('', 'screen-down-' + s.id, function () { moveScreen(i, 1); }, { small: true, icon: '↓', aria: 'Move down', title: 'Move down' })
        : lockedBtn('↓', 'screen-down-' + s.id, isThanks ? 'The thank-you screen always stays last.' : 'Nothing can come after the thank-you screen.'),
      btn('Edit', 'screen-edit-' + s.id, function () { openEditor(s.id); }, { small: true }),
      isThanks ? lockedBtn('Hide', 'screen-toggle-' + s.id, 'The thank-you screen sends the answers, so it can’t be hidden.')
        : btn(s.active ? 'Hide' : 'Show', 'screen-toggle-' + s.id, function () { toggleScreen(s); }, { small: true }),
      t.builtin ? lockedBtn('Delete', 'screen-delete-' + s.id, 'Built-in screens can’t be deleted. Hide it instead.', { kind: 'danger' })
        : isDataColumnScreen(s.id) ? lockedBtn('Delete', 'screen-delete-' + s.id, 'This question fills the ' + DATA_COLUMN_SCREENS[s.id] + ' column of the answers sheet, so it can’t be deleted and its code never changes. Hide it instead.', { kind: 'danger' })
        : isLive.screen(s.id) ? lockedBtn('Delete', 'screen-delete-' + s.id, 'Live questions can’t be deleted (past answers use the code). Hide it instead.', { kind: 'danger' })
        : btn('Delete', 'screen-delete-' + s.id, function () { deleteScreenFlow(s); }, { small: true, kind: 'danger' })
    ];

    return h('article', { class: 'qcard' + (s.active ? '' : ' is-hidden'), test: 'screen-card-' + s.id },
      h('div', { class: 'qnum', text: String(i + 1) }),
      h('div', { class: 'qicon', 'aria-hidden': 'true', text: t.icon }),
      h('div', { class: 'qbody' },
        h('div', { class: 'qtitle-row' }, h('span', { class: 'qtype', text: t.label }), codeChip(s.id, isLive.screen(s.id), 'this screen')),
        english ? h('div', { class: 'qtext', text: english }) : null,
        secondText ? h('div', { class: 'qtext-2', lang: second.code, text: secondText }) : null,
        h('div', { class: 'badges' }, badges)),
      h('div', { class: 'qactions' }, actions));
  }

  function cardEnglish(s, t) {
    if (s.type === 'function_ratings') {
      var names = M().areas.filter(function (a) { return a.active; }).map(function (a) { return areaName(a.id); });
      return 'One rating screen per area: ' + (names.length ? names.join(', ') : 'no areas shown yet') + '.';
    }
    if (s.type === 'function_deep_dives') return '“' + (en('q.deep_dive') || 'What is the main problem?') + '” for each area rated ' + standardThreshold() + ' or lower.';
    if (s.type === 'language_picker') return en('lang.title') || t.description;
    if (s.type === 'whats_changed') return (en('wc.title') || 'What changed') + ' (bullets per round are in Rounds)';
    if (s.type === 'thank_you') return en('thanks.title') || 'Thank you!';
    if (s.text && en(s.text)) return en(s.text);
    if (t.needs_text) return '(no English text yet)';
    return t.description;
  }

  function moveScreen(i, delta) {
    moveItem(M().screens, i, i + delta);
    var s = M().screens[i + delta];
    changed();
    S.ui.pendingFocus = { test: 'screen-card-' + s.id, focusTest: 'screen-' + (delta < 0 ? 'up-' : 'down-') + s.id, flash: false };
    renderMain(true);
  }

  function toggleScreen(s) {
    s.active = !s.active;
    changed({ rerender: true });
    var users = rulesUsing(function (ref) { return ref === s.id; }, true);
    if (!s.active && users.length) toast('A rule on ' + users.join(', ') + ' tests this hidden question: change that rule too.', { kind: 'info', timeout: 8000 });
  }

  function openEditor(id) {
    S.ui.editing = id;
    go('questions');
    $('#main').scrollTop = 0;
  }

  function deleteScreenFlow(s) {
    var live = isLive.screen(s.id);
    var users = rulesUsing(function (ref) { return ref === s.id; });
    var body = [h('p', { text: 'This removes ' + quote(shorten(screenEnglish(s) || s.id, 70)) + ' and its texts in every language.' })];
    if (live) {
      // Live questions are never deleted: earlier rounds' answers use the code,
      // and the dashboard compares rounds with it. Hiding keeps the history intact.
      body = [h('div', { class: 'callout is-warn' }, h('p', { text: 'This question is live: answers from earlier rounds use its code, so the dashboard compares rounds with it. It can’t be deleted, but you can hide it: partners stop seeing it and its past answers stay readable.' }))];
      var liveButtons = [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }];
      if (s.active) liveButtons.push({ label: 'Hide it instead', kind: 'primary', test: 'modal-hide-instead', onClick: function (c) { c(); toggleScreen(s); } });
      openModal({ title: 'This question can’t be deleted', test: 'confirm-delete-screen', body: body, buttons: liveButtons });
      return;
    }
    if (users.length) body.push(h('p', { class: 'field-warn', text: 'The rule on ' + users.join(', ') + ' tests this question and will need a new rule.' }));
    var buttons = [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }];
    buttons.push({ label: 'Delete', kind: 'danger-solid', test: 'modal-confirm', onClick: function (c) { c(); deleteScreen(s); } });
    openModal({ title: 'Delete this question?', test: 'confirm-delete-screen', body: body, buttons: buttons });
  }

  function deleteScreen(s) {
    var snap = snapshot();
    var pos = screenPos(s.id);
    M().screens.splice(pos, 1);
    var own = ['text', 'low_label', 'high_label', 'scale_hint', 'body'].map(function (f) { return s[f]; })
      .concat(s.options.map(function (o) { return 'choice.' + s.id + '.' + o; }));
    removeUnusedTexts(own);
    if (S.ui.editing === s.id) S.ui.editing = null;
    changed();
    go('questions');
    offerUndo(snap, 'Question deleted.');
  }

  /* Removes texts that nothing else uses any more. */
  function removeUnusedTexts(keys) {
    var need = neededTextKeys();
    var stillUsed = {};
    M().screens.forEach(function (s) {
      ['text', 'low_label', 'high_label', 'scale_hint', 'body'].forEach(function (f) { if (s[f]) stillUsed[s[f]] = true; });
    });
    keys.forEach(function (k) { if (k && !need[k] && !stillUsed[k]) removeTextKey(k); });
  }

  /* ---- The editor --------------------------------------------------------- */

  function screenEditor(s) {
    var t = typeInfo(s.type);
    var idx = screenPos(s.id);
    var screens = M().screens;
    var prev = screens[idx - 1], next = screens[idx + 1];
    var out = [
      h('div', { class: 'editor-head' },
        btn('← All questions', 'editor-back', function () { S.ui.editing = null; S.ui.pendingFocus = { test: 'screen-card-' + s.id }; go('questions'); }, { small: true }),
        h('div', { class: 'editor-title' },
          h('span', { class: 'qicon', 'aria-hidden': 'true', text: t.icon }),
          h('h1', { text: 'Question ' + (idx + 1) + ': ' + t.label }),
          codeChip(s.id, isLive.screen(s.id), 'this screen'),
          !isLive.screen(s.id) && !t.builtin && !isDataColumnScreen(s.id) ? btn('Change code', 'screen-rename', function () { renameScreenFlow(s); }, { small: true, kind: 'ghost' }) : null,
          s.active ? null : badge('Hidden', 'hidden')))
    ];
    if (t.description) out.push(h('p', { class: 'muted', style: 'margin:-6px 0 14px', text: t.description }));
    if (t.needs_text) out.push(card({ title: s.type === 'info_card' ? 'Title of the card' : 'Question', sub: 'What partners read. English is needed; other languages show English until they are translated.', test: 'editor-text-card' },
      langFields(screenKeyRef(s, 'text', 'q.' + s.id), { test: 'editor-text', label: 'Question', multiline: true })));
    var answerCard = answerSettings(s, t);
    if (answerCard) out.push(answerCard);
    var builtinTexts = builtinTextsCard(s);
    if (builtinTexts) out.push(builtinTexts);
    var pointer = builtinPointer(s);
    if (pointer) out.push(pointer);
    if (s.type !== 'thank_you') out.push(ruleCard(s, idx));
    out.push(h('div', { class: 'editor-foot' },
      prev ? btn('← Previous question', 'editor-prev', function () { openEditor(prev.id); }, { small: true }) : null,
      next ? btn('Next question →', 'editor-next', function () { openEditor(next.id); }, { small: true }) : null,
      h('span', { class: 'spacer' }),
      s.type === 'thank_you' ? null : btn(s.active ? 'Hide this question' : 'Show this question', 'editor-toggle', function () { toggleScreen(s); }, { small: true }),
      t.builtin ? null : btn('Delete this question', 'editor-delete', function () { deleteScreenFlow(s); }, { small: true, kind: 'danger' })));
    return out;
  }

  /* A text that may not exist yet: it is created (with the standard name) the
     moment someone types into it. */
  function screenKeyRef(s, fieldName, defaultKey) {
    return {
      get: function () { return s[fieldName]; },
      create: function () {
        var key = defaultKey;
        var n = 2;
        while (M().texts[key] && !isOwnKey(s, key)) { key = defaultKey + '_' + n; n++; }
        s[fieldName] = key;
        addTextKey(key, {}, 'q.');
        return key;
      }
    };
  }
  function isOwnKey(s, key) { return ['text', 'low_label', 'high_label', 'scale_hint', 'body'].some(function (f) { return s[f] === key; }); }

  function answerSettings(s, t) {
    var parts = [];
    if (hasRequired(s)) {
      parts.push(h('div', { class: 'row' }, switchCtl({
        test: 'editor-required', checked: effectiveRequired(s), label: 'Partners must answer',
        onText: 'Yes, required', offText: 'No: a Skip button is shown',
        onChange: function (v) { s.required = v; changed({ rerender: true }); }
      }), typeof s.required !== 'boolean' ? h('span', { class: 'help', text: '(the standard for this kind of question)' }) : null));
    }
    if (t.fields.indexOf('options') !== -1) parts.push(optionsEditor(s));
    if (t.fields.indexOf('low_label') !== -1 || t.fields.indexOf('high_label') !== -1) {
      parts.push(h('div', { class: 'group-label', text: 'Words at the two ends of the scale' }));
      parts.push(h('div', { class: 'help', text: 'Left end (0):' }));
      parts.push(langFields(screenKeyRef(s, 'low_label', 'q.' + s.id + '.low'), { test: 'editor-low', label: 'Left end', compact: true }));
      parts.push(h('div', { class: 'help', style: 'margin-top:8px', text: 'Right end (10):' }));
      parts.push(langFields(screenKeyRef(s, 'high_label', 'q.' + s.id + '.high'), { test: 'editor-high', label: 'Right end', compact: true }));
    }
    if (t.fields.indexOf('scale_hint') !== -1) {
      parts.push(h('div', { class: 'group-label', text: 'Hint read aloud with the scale' }));
      parts.push(langFields(screenKeyRef(s, 'scale_hint', 'q.' + s.id + '.hint'), { test: 'editor-hint', label: 'Hint', compact: true }));
    }
    if (t.fields.indexOf('body') !== -1) parts.push(bodyEditor(s));
    if (t.fields.indexOf('skip_if') !== -1) parts.push(skipEditor(s));
    if (!parts.length) return null;
    return card({ title: s.type === 'info_card' ? 'Card text' : (t.fields.indexOf('skip_if') !== -1 ? 'When to skip it' : 'Answers'), test: 'editor-answers-card' }, parts);
  }

  function skipEditor(s) {
    var what = s.type === 'language_picker'
      ? ['lang_in_url', 'Skip this screen when the partner’s link already says the language']
      : ['empty', 'Skip this screen when the round has nothing to show'];
    return h('div', { class: 'row' }, switchCtl({
      test: 'editor-skip', checked: s.skip_if === what[0], label: what[1], onText: 'Yes', offText: 'No, always show it',
      onChange: function (v) { s.skip_if = v ? what[0] : ''; changed(); }
    }));
  }

  function bodyEditor(s) {
    var has = !!s.body;
    var box = h('div', null,
      h('div', { class: 'row' }, switchCtl({
        test: 'editor-body-toggle', checked: has, label: 'Add a longer explanation under the title', onText: 'Yes', offText: 'No',
        onChange: function (v) {
          if (v) { screenKeyRef(s, 'body', 'q.' + s.id + '.body').create(); }
          else { var k = s.body; s.body = ''; removeUnusedTexts([k]); }
          changed({ rerender: true });
        }
      })));
    if (has) box.appendChild(h('div', { style: 'margin-top:10px' }, langFields(s.body, { test: 'editor-body', label: 'Explanation', multiline: true })));
    return box;
  }

  function optionsEditor(s) {
    var wrap = h('div', { test: 'options-editor' }, h('div', { class: 'group-label', text: 'Answers partners can pick' }));
    if (!s.options.length) wrap.appendChild(h('div', { class: 'callout is-warn' }, h('p', { text: 'There are no answers yet. Add at least two.' })));
    s.options.forEach(function (code, i) {
      var live = isLive.option(s.id, code);
      wrap.appendChild(h('div', { class: 'option-row', test: 'option-' + code },
        h('div', { class: 'row-head' },
          h('span', { class: 'name', text: optionLabel(s.id, code) }), codeChip(code, live, 'this answer'),
          h('div', { class: 'btn-group' },
            i > 0 ? btn('', 'option-up-' + code, function () { moveItem(s.options, i, i - 1); changed({ rerender: true }); }, { small: true, icon: '↑', aria: 'Move up' }) : null,
            i < s.options.length - 1 ? btn('', 'option-down-' + code, function () { moveItem(s.options, i, i + 1); changed({ rerender: true }); }, { small: true, icon: '↓', aria: 'Move down' }) : null,
            live ? null : btn('Change code', 'option-rename-' + code, function () { renameOptionFlow(s, code); }, { small: true, kind: 'ghost' }),
            btn('Remove', 'option-remove-' + code, function () { removeOptionFlow(s, code); }, { small: true, kind: 'danger' }))),
        langFields('choice.' + s.id + '.' + code, { test: 'option-' + code, label: 'Answer', compact: true })));
    });
    wrap.appendChild(h('div', { style: 'margin-top:10px' }, btn('Add an answer', 'option-add', function () { addOptionFlow(s); }, { small: true, icon: '+' })));
    return wrap;
  }

  function builtinTextsCard(s) {
    var list = BUILTIN_SCREEN_TEXTS[s.type];
    if (!list) return null;
    var formKeys = arr(S.catalog.form_text_keys);

  function radioCard(name, value, on, label, test, onPick) {

  /* A sensible first condition for an answer: low scores for numbers, the
     first choice for lists, "was answered" for typed answers. */
  function defaultCondition(ans) {
    if (ans.kind === 'text') return { answer: ans.ref, test: 'answered', value: null };
    if (ans.kind === 'number') return { answer: ans.ref, test: 'at_most', value: ans.max === 10 ? 6 : 2 };
    return { answer: ans.ref, test: 'equals', value: ans.values.length ? ans.values[0].v : '' };
  }

  function conditionRow(c, i, answers, idx, parsed, commit) {
    var ans = null;
    answers.forEach(function (a) { if (a.ref === c.answer) ans = a; });
    var answerOptions = answers.map(function (a) { return { value: a.ref, label: a.label, group: a.group }; });
    if (!ans) {
      var d = describeAnswer(c.answer);
      answerOptions.unshift({ value: c.answer, label: '⚠ ' + (d ? d.label : c.answer) + ' (can’t be used here)' });
    }
    var answerSel = selectCtl(answerOptions, c.answer, 'rule-answer-' + i, function (v) {
      var a = null;

      if (a) parsed.conds[i] = defaultCondition(a);
      commit();
    }, { aria: 'Which earlier answer' });
    var known = ans || describeAnswer(c.answer);   // for labels, even when it can't be used here
    var kind = known ? known.kind : 'choice';
    var tests = TESTS_FOR[kind].slice();
    if (tests.indexOf(c.test) === -1) tests.unshift(c.test);
    var testSel = selectCtl(tests.map(function (t) { return { value: t, label: TEST_LABELS[t] || t }; }), c.test, 'rule-test-' + i, function (v) {

  /* Keeps the chosen value sensible when the test changes ("is" <-> "is one of"). */
  function convertTest(c, test, ans) {
    var out = { answer: c.answer, test: test, value: null };
    var first = ans && ans.values.length ? ans.values[0].v : '';
    var current = Array.isArray(c.value) ? c.value[0] : c.value;
    if (test === 'answered' || test === 'not_answered') return out;
    if (test === 'in') { out.value = current !== null && current !== undefined && current !== '' ? [current] : [first]; return out; }
    if (test === 'at_most' || test === 'at_least') {
      out.value = typeof current === 'number' ? current : (ans ? (ans.max === 10 ? 6 : 2) : 2);
      return out;
    }
    out.value = current !== null && current !== undefined && current !== '' ? current : first;
    return out;
  }

  function conditionValue(c, i, ans, commit) {
    if (c.test === 'answered' || c.test === 'not_answered') return null;
    var values = ans ? ans.values : [];
    if (c.test === 'at_most' || c.test === 'at_least') values = values.filter(function (v) { return typeof v.v === 'number'; });
    function toValue(text) {
      for (var k = 0; k < values.length; k++) if (String(values[k].v) === text) return values[k].v;
      return text;

    if (c.test === 'in') {

  function createScreen(type, english, afterIdx) {

  function langField(ref, L, o, refreshAll) {

    var test = o.test ? o.test + '-' + L.code : null;
    var key = ref.get();
    var raw = key ? textValue(key, L.code) : '';

      needed ? h('span', { class: 'muted', text: '(needed)' }) : null, tag);

        warn.appendChild(document.createTextNode('which the form replaces with a number. Keep it in every language.'));

      }
    }
    input.addEventListener('input', function () {
      var k = ref.get() || ref.create();

  /* ==========================================================================
     PART 17. LOADING, SAVING, PREVIEWING AND PUBLISHING
     ========================================================================== */

  function adoptLoad(res, keepSection) {
    res = obj(res);
    S.revision = res.revision;
    S.model = normaliseModel(res.model);
    var cat = obj(res.catalog);
    S.catalog = { settings_schema: arr(cat.settings_schema), screen_types: arr(cat.screen_types), form_text_keys: arr(cat.form_text_keys) };
    S.live = res.live && typeof res.live === 'object' ? res.live : null;
    /* codes_locked is false until the first real round opens: nothing is
       locked yet. (A server without codes_locked locks whatever is live.) */
    S.codesLocked = res.codes_locked !== false;
    S.liveIdsUnknown = S.codesLocked && !!res.live_ids_unknown;
    S.liveIds = normaliseLiveIds(S.codesLocked ? (S.liveIdsUnknown ? idsOfModel(S.model) : res.live_ids) : null);
    S.draftDiffers = !!res.draft_differs_from_live;
    S.savedKey = contentKey(S.model);
    rememberLiveBullets();
    S.user = str(res.user);
    S.urls = { sheet: str(res.spreadsheet_url), folder: str(res.folder_url), webApp: str(res.web_app_url) };
    /* The web app address counts only once someone recorded it (a server
       without web_app_url_recorded sends an address only when it knows it). */
    S.webAppRecorded = !!S.urls.webApp && res.web_app_url_recorded !== false;
    S.webAppAccess = S.webAppRecorded ? (str(res.web_app_access) === 'domain' ? 'domain' : 'anyone') : '';
    S.dcCount = Number(res.dc_count) || 0;
    S.activeDcCount = Number(res.active_dc_count) || 0;
    S.savedRoundIds = {};
    S.model.rounds.forEach(function (r) { S.savedRoundIds[r.id] = true; });
    S.dirty = false;
    if (S.undo && S.undo.remove) S.undo.remove();
    S.undo = null;
    if (!keepSection && res.open_section) {
      var hint = String(res.open_section).toLowerCase().replace(/[^a-z]/g, '');
      SECTIONS.forEach(function (sec) { if (hint === sec.id || hint.indexOf(sec.id) === 0) S.section = sec.id; });
      if (hint.indexOf('link') !== -1) S.section = 'links';
      if (hint.indexOf('publish') !== -1) S.section = 'publish';
    }
    if (S.ui.editing !== null && !findScreen(S.ui.editing)) S.ui.editing = null;
  }

  /* Loads can overlap (a background refresh after Save, then a reload after
     opening a round). Only the most recently requested one may be used, so an
     older, slower answer never overwrites a newer one. Resolves null for an
     outdated answer. */
  var loadSeq = 0;
  function loadLatest() {
    var mine = ++loadSeq;
    return call('panelLoad').then(function (res) { return mine === loadSeq ? res : null; });
  }

  function reloadQuiet() {
    return loadLatest().then(function (res) { if (res) { adoptLoad(res, true); forgetUnsaved(); renderAll(); } });
  }

  function save(o) {
    o = o || {};
    if (S.saving) return S.savingPromise;
    if (!S.dirty && !o.force) return Promise.resolve(true);
    S.saving = true;
    updateChrome();
    var seq = S.changeSeq;
    var roundIds = M().rounds.map(function (r) { return r.id; });
    var sentKey = contentKey(M());
    S.savingPromise = call('panelSave', S.revision, M()).then(function (res) {
      res = obj(res);
      S.saving = false;
      if (res.ok) {
        S.revision = res.revision;
        S.draftDiffers = !!res.draft_differs_from_live;
        S.savedKey = sentKey;
        S.savedRoundIds = {};
        roundIds.forEach(function (id) { S.savedRoundIds[id] = true; });
        if (S.changeSeq === seq) { S.dirty = false; forgetUnsaved(); rememberLiveBullets(); }
        updateChrome();
        savedMessage(o);
        refreshAfterSave(seq);
        return true;
      }
      updateChrome();
      if (res.conflict) return resolveConflict(res, o);
      throw new Error('The Sheet gave an unexpected answer while saving. Please try again.');
    }).catch(function (e) {
      S.saving = false;
      updateChrome();
      showError('Your changes were not saved', e, function () { save(o); });
      return false;
    });
    return S.savingPromise;
  }

  /* The message after a save. After "Keep mine and overwrite" it always says
     whose changes were replaced; a plain Save also mentions mistyped colours
     (they block publishing). Saves made on the way to something else (quiet)
     say nothing else. */
  function savedMessage(o) {
    if (o.replaced) {
      toast('Saved. You replaced the changes ' + o.replaced.who + ' saved ' + whenText(o.replaced.at) + '.', { kind: 'ok', timeout: 9000 });
      return;
    }
    if (o.quiet) return;
    var bad = badColorNames();
    if (bad.length) {
      var one = bad.length === 1;
      toast('Saved. ' + (one ? 'The colour code of ' + bad[0] + ' is' : 'The colour codes of ' + joinWith(bad, 'and') + ' are') +
        ' not valid yet (Look & feel): ' + COLOR_HINT + '. Publishing waits until ' + (one ? 'it is' : 'they are') + ' fixed.', { timeout: 9000 });
      return;
    }
    toast('Saved. Partners don’t see it until you publish.', { kind: 'ok' });
  }

  /* The server tidies texts while saving (fills "[TRANSLATE]", adds notes for
     translators). Fetch its version, unless the person kept typing. */
  function refreshAfterSave(seq) {
    loadLatest().then(function (res) {
      if (!res || S.changeSeq !== seq || S.dirty || S.saving) return;
      adoptLoad(res, true);
      updateChrome();
      renderMain(true);
    }, function () { /* the save itself worked; a later load will catch up */ });
  }

  /* Saves until nothing is left unsaved (edits made while a save was running
     need a second save). Resolves true when everything is in the Sheet. */
  function saveAll() {
    var tries = 0;
    function step() {
      if (!S.dirty && !S.saving) return Promise.resolve(true);
      if (tries++ > 3) return Promise.resolve(!S.dirty);
      return save({ quiet: true }).then(function (ok) { return ok ? step() : false; });
    }
    return step();
  }

      openModal({
        title: 'Someone else saved changes', test: 'conflict', dismissible: false,
        body: [h('p', null, h('strong', { text: who }), ' saved the draft (' + when + ') after you opened the control panel. Their changes and yours can’t be combined automatically.'),
          h('ul', { style: 'margin:0 0 6px;padding-left:18px' },
            h('li', null, h('strong', { text: 'Reload the latest version: ' }), 'you get their version, and your unsaved changes are lost.'),
            h('li', null, h('strong', { text: 'Keep mine and overwrite: ' }), 'your version replaces theirs.'))],
        /* Reloading is the safe choice, so it is the main button; overwriting
           throws away someone else's work, so it looks like a warning. */
        buttons: [
          { label: 'Cancel', test: 'conflict-cancel', onClick: function (c) { c(); resolve(false); } },
          { label: 'Keep mine and overwrite', kind: 'warn', test: 'conflict-overwrite', onClick: function (c) {
            c();
            S.revision = res.revision;
            S.dirty = true;
            save(Object.assign({}, o, { force: true, replaced: { who: str(res.saved_by) || 'someone else', at: res.saved_at } })).then(resolve);
          } },
          { label: 'Reload the latest version', kind: 'primary', test: 'conflict-reload', onClick: function (c) {
            c();
            withBusy('Loading the latest version…', reloadQuiet).then(function () { toast('You now have the latest version.', { kind: 'ok' }); resolve(false); },
              function (e) { showError('The latest version could not be loaded', e); resolve(false); });
          } }
        ]
      });
    });
  }

  function discardFlow() {
    confirmBox({ title: 'Discard your unsaved changes?', test: 'confirm-discard', body: [h('p', { text: 'The panel goes back to the last saved draft. This can’t be undone.' })], ok: 'Discard changes', danger: true })
      .then(function (ok) {
        if (!ok) return;
        withBusy('Loading the saved draft…', reloadQuiet).then(function () { toast('Changes discarded.', { kind: 'ok' }); },
          function (e) { showError('The saved draft could not be loaded', e); });
      });
  }

  function runCheck() {
    return withBusy('Checking for problems…', function () { return call('panelValidate', M()); }).then(function (res) {
      res = obj(res);
      S.ui.check = { errors: arr(res.errors), warnings: arr(res.warnings), summary: res.summary || null, seq: S.changeSeq, at: new Date() };
      if (S.section === 'publish') renderMain(true);
      updateChrome();
      return S.ui.check;
    }, function (e) { showError('The check could not run', e, runCheck); return null; });
  }

  function publishFlow() {
    if (S.section !== 'publish') go('publish');
    var before = saveAll();
    return before.then(function (ok) {
      if (!ok) return null;
      return runCheck();
    }).then(function (check) {
      if (!check) return;
      if (check.errors.length) {
        S.ui.pendingFocus = { test: 'check-errors' };
        applyPendingFocus();
        toast('Not published: fix the ' + plural(check.errors.length, 'problem') + ' marked in red first.', { kind: 'error', timeout: 7000 });
        return;
      }
      return askPublishNote(check).then(function (note) {
        if (note === null) return;
        return withBusy('Publishing… this can take up to a minute.', function () { return call('panelPublish', S.revision, note); })
          .then(function (res) { return afterPublish(obj(res), note); });
      });
    }).catch(function (e) { showError('Nothing was published', e); });
  }

  function askPublishNote(check) {
    return new Promise(function (resolve) {
      var next = S.live ? Number(S.live.version) + 1 : 1;
      var same = sameAsLive();
      var note = h('textarea', { rows: 3, test: 'publish-note-modal', value: S.ui.publishNote, placeholder: 'For example: Added a Returns area', 'aria-label': 'Note for the history' });
      var err = h('div', { class: 'field-error' });
      openModal({
        title: 'Publish version ' + next + '?', test: 'publish-modal', onClose: function (r) { if (r === undefined || r === null) resolve(null); },
        body: [same ? h('div', { class: 'callout is-warn', style: 'margin-bottom:10px', test: 'publish-same-as-live' }, h('p', { text: sameAsLiveText() + ' Publish anyway?' })) : null,
          h('p', { text: 'This makes your saved draft live for every partner straight away. Partners who already started get this version the next time they open their link: their answers are kept, and they carry on where they stopped (a question you added before that point is skipped for them).' }),
          check.warnings.length ? h('div', { class: 'callout is-warn', style: 'margin-bottom:10px' }, h('p', { text: 'There ' + (check.warnings.length === 1 ? 'is 1 warning' : 'are ' + check.warnings.length + ' warnings') + '. They don’t block publishing, but have a look first.' })) : null,
          field('A short note for the history: what changed?', note, null, err)],
        buttons: [
          { label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(null); } },
          { label: same ? 'Publish anyway' : 'Publish now', kind: 'primary', test: 'publish-confirm', onClick: function (c) {
            if (!note.value.trim()) { err.textContent = 'Write a few words, so everyone knows what this version changed.'; note.focus(); return; }

  function afterPublish(res, note) {
    if (res.ok) {
      S.ui.publishNote = '';
      S.ui.history = null;
      S.ui.historyFailed = false;
      return reloadQuiet().then(function () {
        loadHistory();
        /* After "Publish first" (Rounds): offer to open that round now. */
        var waiting = M().rounds.filter(function (r) { return r.id === S.ui.openAfterPublish && r.status !== 'open'; })[0] || null;
        S.ui.openAfterPublish = null;
        var buttons = [{ label: waiting ? 'Not now' : 'OK', kind: waiting ? null : 'primary', test: 'published-ok', onClick: function (c) { c(); } }];
        if (waiting) buttons.push({ label: (waiting.status === 'closed' ? 'Re-open round ' : 'Open round ') + waiting.id + ' now', kind: 'primary', test: 'published-open-round',
          onClick: function (c) { c(); roundStatusFlow(waiting, 'open'); } });
        openModal({
          title: 'Version ' + res.version + ' is live', test: 'published-modal',
          body: [h('p', { text: 'Partners get it the next time they open their link. Version code: ' + str(res.config_version) + '.' }),
            waiting ? h('p', { test: 'published-next-round', text: 'Next: open round ' + waiting.id + ', so partners with its links can answer this version.' }) : null,
            h('p', { class: 'help', text: 'Tip: download the files for the GitHub copy (step 4 below), so the backup matches what partners see.' })],

      return resolveConflict(res, { quiet: true }).then(function (ok) { if (ok) return publishFlow(); });
    }

      S.ui.check = { errors: arr(res.errors), warnings: [], summary: null, seq: S.changeSeq, at: new Date() };
      renderMain(true);
      updateChrome();
      toast('Not published: the saved draft has problems. Fix them and try again.', { kind: 'error' });
      return;
    }
    throw new Error('The Sheet gave an unexpected answer while publishing. Check Published versions below before trying again.');
  }

  function previewFlow() {
    var before = saveAll();
    before.then(function (ok) {
      if (!ok) return;
      var rounds = M().rounds.filter(function (r) { return S.savedRoundIds[r.id]; });
      if (!rounds.length) {
        openModal({ title: 'Create a round first', test: 'preview-no-round',
          body: [h('p', { text: 'The preview needs a round, so it can show that round’s “What changed” screen. Create one in Rounds (it can stay “not open yet”), save, then preview.' })],
          buttons: [{ label: 'Close', test: 'modal-cancel', onClick: function (c) { c(); } }, { label: 'Go to Rounds', kind: 'primary', test: 'preview-go-rounds', onClick: function (c) { c(); go('rounds'); } }] });
        return;
      }
      var pick = newestRound(rounds).id;
      var linkBox = h('div', { test: 'preview-link-box' });
      var hint = h('div', { class: 'help', test: 'preview-round-hint', text: previewHint(pick) });
      function loadUrl(id) {
        redraw(linkBox, function () { return h('p', { class: 'help' }, h('span', { class: 'spinner is-small' }), ' Getting the preview link…'); });
        call('panelPreviewUrl', id).then(function (res) {
          var url = str(obj(res).url);
          redraw(linkBox, function () {
            return [h('div', { class: 'link-box' }, textInput(url, 'preview-url', null, { readonly: true, aria: 'Preview link' }), btn('Copy', 'preview-copy', function () { copyText(url, 'Preview link'); }, { small: true })),
              h('p', { style: 'margin-top:12px' }, h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', class: 'btn btn-primary', test: 'preview-open' }, 'Open the preview ↗'))];
          });
        }, function (e) { redraw(linkBox, function () { return h('p', { class: 'field-error', text: e.message }); }); });
      }
      openModal({
        title: 'Preview the draft', test: 'preview-modal',
        body: [h('p', { text: 'The preview shows your saved draft exactly as partners would see it. Nothing you answer is stored. Works on a phone too: copy the link.' }),
          field('Round', selectCtl(rounds.map(function (r) { return { value: r.id, label: r.id }; }), pick, 'preview-round', function (v) { hint.textContent = previewHint(v); loadUrl(v); }), null, hint),
          h('div', { style: 'margin-top:12px' }, linkBox),
          h('div', { class: 'callout is-warn', style: 'margin-top:12px', test: 'preview-share-warning' },
            h('p', { text: 'Share only with colleagues: anyone with this link can see your unpublished draft.' }))],
        buttons: [{ label: 'Close', test: 'modal-cancel', onClick: function (c) { c(); } }]
      });
      loadUrl(pick);

  }

  /* What the preview of a round shows on its "What changed" screen. */
  function previewHint(id) {
    var screen = firstOfType('whats_changed');
    if (!screen) return 'Your draft has no “What changed” screen, so no bullets are shown.';
    if (!screen.active) return 'The “What changed” screen is hidden in your draft, so no bullets are shown.';
    var n = arr(M().whats_changed[id]).length;
    if (n) return n === 1 ? '1 “What changed” bullet is shown.' : n + ' “What changed” bullets are shown.';
    return id + ' has no “What changed” bullets: ' + (screen.skip_if === 'empty' ? 'that screen is skipped.' : 'that screen shows no news.');
  }

  /* ==========================================================================
     PART 18. POP-UPS, BUSY MESSAGE AND SHORT MESSAGES ("toasts")
     ========================================================================== */

  var modalCount = 0;

  /* o = { title, body, buttons: [{ label, kind, test, onClick(close) }], test, wide, dismissible, onClose } */
  function openModal(o) {
    var prev = document.activeElement;
    var id = 'm' + (++modalCount);

      h('h2', { id: id + '-t', text: o.title }), h('div', { class: 'modal-body' }, o.body), actions);
    var backdrop = h('div', { class: 'backdrop' }, box);
    var closed = false;
    function close(result) {
      if (closed) return;
      closed = true;
      backdrop.remove();
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.focus && document.body.contains(prev)) prev.focus({ preventScroll: true });
      if (o.onClose) o.onClose(result);
    }
    function onKey(e) {
      if (!document.body.contains(backdrop)) return;
      var top = $('#modal-root').lastElementChild;
      if (top !== backdrop) return;
      if (e.key === 'Escape' && o.dismissible !== false) { e.preventDefault(); e.stopPropagation(); close(null); }
      if (e.key === 'Tab') trapTab(e, box);
    }
    arr(o.buttons).forEach(function (b) {
      actions.appendChild(h('button', { type: 'button', class: 'btn' + (b.kind ? ' btn-' + b.kind : ''), test: b.test, onClick: function () { b.onClick(close); } }, b.label));
    });
    document.addEventListener('keydown', onKey, true);
    $('#modal-root').appendChild(backdrop);
    /* Focus the first box to fill in; otherwise the main button, except for
       risky actions (red button), where Cancel gets the focus so a stray
       Enter key never deletes anything. */
    setTimeout(function () {
      var first = box.querySelector('input:not([type=hidden]):not([readonly]):not([type=checkbox]), textarea:not([readonly]), select') ||
        actions.querySelector('.btn-primary') || actions.firstElementChild;
      if (first) first.focus();
    }, 20);
    return { close: close, box: box };
  }

  function trapTab(e, box) {
    var items = Array.prototype.filter.call(box.querySelectorAll('button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])'), function (el) { return !el.disabled && el.offsetParent !== null; });
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  /* Asks a yes/no question. Resolves true for OK, false otherwise. */
  function confirmBox(o) {
    return new Promise(function (resolve) {
      var answered = false;
      openModal({
        title: o.title, test: o.test || 'confirm', body: o.body, onClose: function (r) { if (!answered) resolve(r === true); },
        buttons: [
          { label: o.cancel || 'Cancel', test: 'modal-cancel', onClick: function (c) { c(false); } },
          { label: o.ok || 'OK', kind: o.danger ? 'danger-solid' : 'primary', test: 'modal-confirm', onClick: function (c) { answered = true; c(true); resolve(true); } }
        ]
      });
    });
  }

  /* Asks for an English name and shows the code it becomes. Resolves
     { text, code } or null. */
  function askName(o) {
    return new Promise(function (resolve) {
      var input = textInput('', o.inputTest, null, { placeholder: o.placeholder });
      var preview = h('div', { class: 'help', test: o.inputTest + '-code' });
      function upd() { preview.textContent = 'Code in the data: ' + slug(input.value, o.taken(), o.fallback) + ' (' + codeChangeHint() + ')'; }
      input.addEventListener('input', upd);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      upd();
      var result = null, modal;
      function submit() {
        if (!input.value.trim()) { input.classList.add('is-invalid'); input.focus(); return; }
        result = { text: input.value.trim(), code: slug(input.value, o.taken(), o.fallback) };
        modal.close('ok');
      }
      modal = openModal({
        title: o.title, test: o.test, onClose: function () { resolve(result); },
        body: [field(o.label, input, o.help || null, preview)],
        buttons: [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }, { label: o.okLabel || 'Add', kind: 'primary', test: o.okTest, onClick: submit }]
      });
    });
  }

  /* Asks for a new code (only for things that are not live yet). */
  function askCode(o) {
    return new Promise(function (resolve) {
      var input = textInput(o.current, 'code-new', null, { spellcheck: false, maxlength: 60 });
      var err = h('div', { class: 'field-error' });
      var result = null, modal;
      function submit() {
        var v = input.value.trim();
        var problem = !ID_RE.test(v) ? 'Use lower-case letters, digits and _, starting with a letter.'
          : (v !== o.current && o.taken[v]) ? 'This code is already used. Pick another one.' : '';
        if (problem) { err.textContent = problem; input.classList.add('is-invalid'); input.focus(); return; }
        result = v === o.current ? null : v;
        modal.close('ok');
      }
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      modal = openModal({
        title: o.title, test: 'code-modal', onClose: function () { resolve(result); },
        body: [h('p', { class: 'help', text: 'The code is how answers are stored. ' +
          (S.codesLocked ? 'Once a code is published it is locked, so rounds stay comparable.' : 'Codes lock when the first real round opens (not a SMOKE, DEMO or TEST round), so rounds stay comparable.') +
          ' Texts and rules that use it are updated too.' }),
          field('New code', input, null, err)],
        buttons: [{ label: 'Cancel', test: 'modal-cancel', onClick: function (c) { c(); } }, { label: 'Change code', kind: 'primary', test: 'code-confirm', onClick: submit }]
      });
    });
  }

  function showError(title, err, retry) {
    var buttons = [{ label: retry ? 'Close' : 'OK', kind: retry ? null : 'primary', test: 'error-close', onClick: function (c) { c(); } }];
    if (retry) buttons.push({ label: 'Try again', kind: 'primary', test: 'error-retry', onClick: function (c) { c(); retry(); } });
    openModal({ title: title, test: 'error-modal', body: [h('p', { text: (err && err.message) || String(err) })], buttons: buttons });
  }

  function busy(message) {
    var el = h('div', { class: 'busy', role: 'alert', 'aria-busy': 'true', test: 'busy' }, h('div', { class: 'busy-box' }, h('div', { class: 'spinner' }), h('div', { text: message })));
    document.body.appendChild(el);
    return function () { el.remove(); };
  }

  function withBusy(message, fn) {
    var done = busy(message);
    var p;
    try { p = Promise.resolve(fn()); } catch (e) { p = Promise.reject(e); }
    return p.then(function (v) { done(); return v; }, function (e) { done(); throw e; });
  }

  function toast(message, o) {
    o = o || {};
    var timer;
    var el = h('div', { class: 'toast' + (o.kind && o.kind !== 'info' ? ' is-' + o.kind : ''), role: 'status', test: 'toast' },
      h('span', { class: 'toast-text', text: message }),
      h('button', { type: 'button', class: 'toast-close', test: 'toast-close', 'aria-label': 'Close this message', onClick: function () { remove(); } }, '×'),
      o.action ? h('button', { type: 'button', class: 'toast-action', test: o.action.test || 'toast-action', onClick: function () { remove(); o.action.onClick(); } }, o.action.label) : null);
    function remove() { clearTimeout(timer); el.remove(); }
    var box = $('#toasts');
    box.appendChild(el);
    while (box.children.length > 2) box.removeChild(box.firstElementChild);
    timer = setTimeout(remove, o.timeout || (o.action ? 9000 : 4500));
    return remove;
  }

  /* ==========================================================================
     PART 19. START-UP
     ========================================================================== */

  function start() {
    loadLatest().then(function (res) {
      adoptLoad(res, false);
      S.loaded = true;
      renderAll();
      offerRecovery();
      if (S.section === 'publish' && !S.dirty) runCheck();
    }, function (e) {
      var boot = $('#boot');
      boot.textContent = '';
      /* Messages about Drive access, a passing Drive problem or permissions
         already say what to do; set-up would not help with those. */
      var ownAdvice = hasOwnAdvice(e.message);
      boot.appendChild(h('div', { class: 'boot-error card', test: 'load-error' },
        h('h2', { text: 'The control panel could not open' }),
        h('p', { text: e.message }),
        ownAdvice ? null : h('p', { class: 'help', test: 'load-error-setup-hint', text: 'If this keeps happening, run Partner Pulse > Set up or repair from the Sheet’s menu, then open the panel again.' }),
        btn('Try again', 'load-retry', function () {
          boot.textContent = '';
          appendKids(boot, [h('div', { class: 'spinner' }), h('div', { text: 'Loading the control panel…' })]);
          start();
        }, { kind: 'primary' })));
    });
  }

  /* Text boxes grow with their text, so long questions are never cut off. */
  function autosize(el) {
    if (!el || el.tagName !== 'TEXTAREA' || !el.isConnected) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }
  function autosizeAll(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('textarea'), autosize);
  }
  document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('is-invalid')) e.target.classList.remove('is-invalid');
    autosize(e.target);
  }, true);
  /* Size only the boxes that just appeared (cheap, even in the long Texts list). */
  new MutationObserver(function (records) {
    var added = [];
    records.forEach(function (r) {
      Array.prototype.forEach.call(r.addedNodes, function (n) { if (n.nodeType === 1) added.push(n); });
    });
    if (!added.length) return;
    requestAnimationFrame(function () {
      added.forEach(function (n) { if (n.tagName === 'TEXTAREA') autosize(n); else autosizeAll(n); });
    });
  }).observe(document.body, { childList: true, subtree: true });

  /* Ctrl+S / Cmd+S saves; a warning if the window is closed with unsaved changes. */
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      if (S.loaded) save();
    }
  });
  window.addEventListener('beforeunload', function (e) {
    if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  /* Small laptop screens: the Sheet opens the panel at 1100 × 760, which can be
     taller or wider than the screen (then its buttons are out of reach). Google
     lets the window resize itself, so it shrinks to fit: at most 760 high and
     1100 wide, leaving room around it. Every section scrolls inside the window.
     Outside Google (the local test bench) there is nothing to resize. */
  function fitToScreen() {
    var g = window.google;
    var host = g && g.script && g.script.host;
    var scr = window.screen;
    if (!host || !scr) return;
    try {
      if (typeof host.setHeight === 'function' && scr.availHeight) host.setHeight(Math.max(420, Math.min(760, scr.availHeight - 200)));
      if (typeof host.setWidth === 'function' && scr.availWidth) host.setWidth(Math.max(720, Math.min(1100, scr.availWidth - 80)));
    } catch (e) { /* the window keeps the size the Sheet gave it */ }
  }

  fitToScreen();
  start();
})();
</script>
</body>
</html>
